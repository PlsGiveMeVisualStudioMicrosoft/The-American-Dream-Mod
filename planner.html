  const also = v => (lineMode() === "both" ? ' <span style="opacity:.5">(raw ' + fmt1(v) + ')</span>' : '');
  el.innerHTML =
      '<b class="a">apr</b> ' + fmt1(SYS.first.apr) + ' &rarr; ' + fmt1(end.apr) + also(SYS.last.apr)
    + sep + '<b class="c">chaos</b> ' + fmt1(SYS.first.chaos) + ' &rarr; ' + fmt1(end.chaos) + also(SYS.last.chaos)
    + sep + '<span style="opacity:.75">' + SYS.steps + (SYS.steps === 1 ? ' event' : ' events')
    + (SYS.spans.length ? ', ' + SYS.spans.length + (SYS.spans.length === 1 ? ' spirit' : ' spirits') : '')
    + (SYS.fires.length ? ', ' + SYS.fires.length + ' overshoot' : '')
    + '</span>'
    + (SYS.undated ? sep + '<span style="color:var(--warn)" title="These write approval, chaos or a spirit but have no date yet">'
       + SYS.undated + ' undated</span>' : '')
    + (SYS.preArm ? sep + '<span style="color:var(--news)" title="These fire before USA_apr_arm_system runs, so the arming effect overwrites whatever they wrote">'
       + SYS.preArm + ' before arming</span>' : '');
}

function tHLine(g, x1, x2, y, col){
  g.strokeStyle = col; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x1, Math.round(y) + .5); g.lineTo(x2, Math.round(y) + .5); g.stroke();
}
function tVLine(g, x, y1, y2, col, dash){
  g.save();
  g.strokeStyle = col; g.lineWidth = 1;
  if(dash) g.setLineDash([3,3]);
  g.beginPath(); g.moveTo(Math.round(x) + .5, y1); g.lineTo(Math.round(x) + .5, y2); g.stroke();
  g.restore();
}
function tDot(g, x, y, col, hollow){
  g.beginPath(); g.arc(x, y, 2.6, 0, 6.2832);
  g.fillStyle = hollow ? "#fff" : col; g.fill();
  g.lineWidth = hollow ? 1.6 : 1.4; g.strokeStyle = hollow ? col : "#fff"; g.stroke();
}
function tRound(g, x, y, w, h, r){
  const rr = Math.min(r, Math.abs(w)/2, h/2);
  g.beginPath();
  g.moveTo(x+rr, y); g.lineTo(x+w-rr, y); g.quadraticCurveTo(x+w, y, x+w, y+rr);
  g.lineTo(x+w, y+h-rr); g.quadraticCurveTo(x+w, y+h, x+w-rr, y+h);
  g.lineTo(x+rr, y+h); g.quadraticCurveTo(x, y+h, x, y+h-rr);
  g.lineTo(x, y+rr); g.quadraticCurveTo(x, y, x+rr, y);
  g.closePath();
}
const TIER_COL = { 1:"green", 2:"green", 3:"amber", 4:"amber", 5:"red", 6:"red" };

function paintTrack(){
  if(trackShut()) return;
  const w = tBody.clientWidth | 0, h = tBody.clientHeight | 0;
  if(w < 2 || h < 2) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if(w !== tW || h !== tH){
    tW = w; tH = h;
    tCv.width = Math.round(w*dpr); tCv.height = Math.round(h*dpr);
    tCv.style.width = w + "px"; tCv.style.height = h + "px";
  }
  const g = tCv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  g.textBaseline = "middle";

  const vx = T.view.x, tu = tuneCfg();
  const X = d => clamp(xOf(d) + vx, -40000, w + 40000);
  const Y = v => CH_T + (1 - clamp(v, 0, 100)/100) * (CH_H - CH_T - CH_B);
  const pts = SYS.pts, sim = SYS.sim;
  tPts = []; tBars = [];

  [25, 50, 75].forEach(v=>tHLine(g, GUT, w, Y(v), "#EDEFE9"));
  tHLine(g, GUT, w, Y(100), "#E4E7E0");
  tHLine(g, GUT, w, Y(0), "#D7DAD2");

  g.save();
  g.beginPath(); g.rect(GUT, 0, w - GUT, h); g.clip();

  /* the corridor the system keeps approval inside */
  if(sysCfg().band !== false && sim.length){
    const stepD = Math.max(1, Math.floor(1 / Math.max(T.view.px, 0.0001)));
    const band = tu.band;
    g.beginPath();
    for(let i = 0; i < sim.length; i += stepD){ const p = sim[i]; g.lineTo(X(p.day), Y(p.target + band)); }
    for(let i = sim.length - 1; i >= 0; i -= stepD){ const p = sim[i]; g.lineTo(X(p.day), Y(p.target - band)); }
    g.closePath();
    g.fillStyle = "rgba(31,58,95,.075)"; g.fill();

    g.save();
    g.setLineDash([4,4]); g.strokeStyle = "rgba(31,58,95,.42)"; g.lineWidth = 1.2;
    g.beginPath();
    for(let i = 0; i < sim.length; i += stepD){ const p = sim[i]; g.lineTo(X(p.day), Y(p.target)); }
    g.stroke();
    g.restore();
  }

  if(pts.length){
    const x0 = X(pts[0].day), endX = Math.max(X(SYS.endDay), x0);

    /* the running total, as a step */
    const walk = key=>{
      g.beginPath();
      let y = Y(pts[0][key]);
      g.moveTo(x0, y);
      for(let i = 1; i < pts.length; i++){
        const nx = X(pts[i].day);
        g.lineTo(nx, y);
        y = Y(pts[i][key]);
        g.lineTo(nx, y);
      }
      g.lineTo(endX, y);
    };

    tVLine(g, X(SYS.armDay), CH_T - 6, Y(0), "#C9CDC3", true);   /* the day the system is armed */

    if(showSim() && sim.length){
      const stepD = Math.max(1, Math.floor(1 / Math.max(T.view.px, 0.0001)));
      const trace = key=>{
        g.beginPath();
        for(let i = 0; i < sim.length; i += stepD){ const p = sim[i]; g.lineTo(X(p.day), Y(p[key])); }
        const last = sim[sim.length-1];
        g.lineTo(X(last.day), Y(last[key]));
      };
      trace("chaos");
      g.lineTo(X(sim[sim.length-1].day), Y(0)); g.lineTo(X(sim[0].day), Y(0)); g.closePath();
      g.fillStyle = "rgba(163,58,42,.10)"; g.fill();
      trace("chaos"); g.strokeStyle = HEX.red;  g.lineWidth = 1.7; g.lineJoin = "round"; g.stroke();
      trace("apr");   g.strokeStyle = HEX.navy; g.lineWidth = 1.7; g.stroke();
    }

    if(showRaw()){
      g.save();
      g.setLineDash([2,3]); g.lineWidth = 1.4;
      if(!showSim()){
        walk("chaos");
        g.lineTo(endX, Y(0)); g.lineTo(x0, Y(0)); g.closePath();
        g.fillStyle = "rgba(163,58,42,.10)"; g.fill();
      }
      walk("chaos"); g.strokeStyle = showSim() ? "rgba(163,58,42,.55)" : HEX.red;  g.stroke();
      walk("apr");   g.strokeStyle = showSim() ? "rgba(31,58,95,.55)"  : HEX.navy; g.stroke();
      g.restore();
    }

    if(selKey){
      const sel = pts.find(p=>p.key === selKey);
      if(sel) tVLine(g, X(sel.day), 0, CH_H, "rgba(31,58,95,.40)");
    }

    /* one dot per event, on whichever line is the main one */
    const main = showSim() ? "sim" : "raw";
    let prevX = -1e9;
    pts.forEach(p=>{
      if(!p.e) return;
      const x = X(p.day);
      if(x < GUT - 30 || x > w + 30) return;
      const at = main === "sim" ? simAt(p.day) : p;
      tPts.push({ x:x, p:p, at:at });
      if(x - prevX < 4.5) return;
      prevX = x;
      const ring = ((p.e.timing || {}).mode !== "precise");
      tDot(g, x, Y(at.chaos), HEX.red,  ring);
      tDot(g, x, Y(at.apr),   HEX.navy, ring);
    });

    /* where the system's own overshoot events will interrupt */
    if(showSim()) SYS.fires.forEach(f=>{
      const x = X(f.day);
      if(x < GUT - 6 || x > w + 6) return;
      g.beginPath();
      g.moveTo(x, CH_T - 9); g.lineTo(x + 3.4, CH_T - 3.5); g.lineTo(x - 3.4, CH_T - 3.5);
      g.closePath();
      g.fillStyle = f.high ? HEX.green : HEX.amber; g.fill();
    });

    /* how much of each event's push is standing outside the band */
    if(showSim()) pts.forEach(p=>{
      if(!p.e || !p.r || !(p.r.spent > 0.5)) return;
      const x = X(p.day);
      if(x < GUT - 6 || x > w + 6) return;
      const edge = p.r.landed > p.r.target ? p.r.target + tu.band : p.r.target - tu.band;
      g.save();
      g.setLineDash([2,3]); g.strokeStyle = "rgba(138,106,24,.85)"; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(x, Y(p.r.landed)); g.lineTo(x, Y(edge)); g.stroke();
      g.restore();
    });

    /* the handles you drag to retune a month */
    if(curveEdit && sim.length){
      const cur = tu.curve || [], mw = 30.4 * T.view.px;
      if(mw >= 7) cur.forEach((v,i)=>{
        const a = monthStart(i), b = monthStart(i+1);
        const x = (X(a) + X(b)) / 2;
        if(x < GUT - 4 || x > w + 4) return;
        const y = Y(v);
        g.beginPath(); g.rect(x - 2.5, y - 2.5, 5, 5);
        g.fillStyle = "#fff"; g.fill();
        g.strokeStyle = HEX.navy; g.lineWidth = 1.3; g.stroke();
      });
    }

    /* the crosshair readout */
    if(tCursor != null && tCursor > GUT){
      tVLine(g, tCursor, 0, CH_H, "rgba(20,23,26,.18)");
    }
  }

  const rows = spiRows();
  if(rows){
    const base = CH_H + 6;

    /* row 0: the tier spirit the system swaps in for you */
    SYS.tiers.forEach(t=>{
      const a = X(t.from), b = t.to ? X(t.to) : X(SYS.endDay);
      if(b < GUT - 10 || a > w + 10) return;
      const y = base, bh = SPI_ROW - 4;
      const nm = TIER_COL[t.tier], col = HEX[nm], bg = HEXT[nm];
      tRound(g, a, y, Math.max(b - a, 3), bh, 3);
      g.fillStyle = bg; g.fill();
      g.strokeStyle = col; g.lineWidth = 1; g.stroke();
      const l = Math.max(a, GUT), r = Math.min(b, w);
      if(r - l > 26){
        g.save();
        g.beginPath(); g.rect(l + 1, y, r - l - 2, bh); g.clip();
        g.fillStyle = col; g.font = "600 10px " + MONO; g.textAlign = "left";
        g.fillText("USA_approval_tier_" + t.tier, l + 6, y + bh/2 + .5);
        g.restore();
      }
      tBars.push({ x0:a, x1:b, row:0, tier:t });
    });

    /* the rest: spirits your own events add and remove */
    SYS.spans.forEach(sp=>{
      if(sp.row >= rows) return;
      const a = X(sp.from), b = sp.to ? X(sp.to) : X(SYS.endDay);
      if(b < GUT - 10 || a > w + 10) return;
      const y = base + sp.row*SPI_ROW, bh = SPI_ROW - 4;
      const nm = laneColor(sp.idea), col = HEX[nm], bg = HEXT[nm];
      tRound(g, a, y, Math.max(b - a, 3), bh, 3);
      g.fillStyle = bg; g.fill();
      g.strokeStyle = col; g.lineWidth = 1; g.stroke();
      const l = Math.max(a, GUT), r = Math.min(b, w);
      if(r - l > 26){
        g.save();
        g.beginPath(); g.rect(l + 1, y, r - l - 2, bh); g.clip();
        g.fillStyle = col; g.font = "600 10px " + MONO; g.textAlign = "left";
        g.fillText(sp.idea, l + 6, y + bh/2 + .5);
        g.restore();
      }
      if(sp.open && b < w + 6){
        g.beginPath();
        g.moveTo(b + 2, y + 1); g.lineTo(b + 7, y + bh/2); g.lineTo(b + 2, y + bh - 1);
        g.fillStyle = col; g.globalAlpha = .55; g.fill(); g.globalAlpha = 1;
      }
      tBars.push({ x0:a, x1:b, row:sp.row, sp:sp });
    });
  }

  g.restore();

  /* the gutter last, so the lines run under it */
  g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, GUT, h);
  tVLine(g, GUT, 0, h, "#DEE1DA");
  g.fillStyle = "#8A9199"; g.font = "10px " + MONO; g.textAlign = "right";
  [0, 25, 50, 75, 100].forEach(v=>g.fillText(String(v), GUT - 9, Y(v)));
  g.textAlign = "left"; g.font = "700 9.5px " + MONO;
  g.fillStyle = HEX.navy; g.fillRect(10, CH_T - 1, 11, 2); g.fillText("APR", 25, CH_T);
  g.fillStyle = HEX.red;  g.fillRect(10, CH_T + 12, 11, 2); g.fillText("CHAOS", 25, CH_T + 13);
  if(sysCfg().band !== false){
    g.fillStyle = "rgba(31,58,95,.42)"; g.fillRect(10, CH_T + 25, 11, 2);
    g.fillStyle = "#8A9199"; g.fillText("TREND", 25, CH_T + 26);
  }
  if(rows){
    g.textAlign = "right"; g.fillStyle = "#8A9199";
    g.fillText("SPIRITS", GUT - 9, CH_H + 6 + (rows*SPI_ROW)/2);
    if(SYS.rows > rows) g.fillText("+" + (SYS.rows - rows) + " MORE", GUT - 9, CH_H + 6 + rows*SPI_ROW + 4);
  }
}

/* ---- the trend curve, as something you can edit ---- */
let curveEdit = false;
function armDate(){ return parseDate(sysCfg().startDate) || { y:2025, m:1, d:20 }; }
function monthIxOf(day){
  const o = fromDay(day), a = armDate(), n = (tuneCfg().curve || []).length;
  return clamp((o.y - a.y)*12 + (o.m - a.m), 0, Math.max(n - 1, 0));
}
function monthLabel(i){
  const a = armDate(), m = a.m - 1 + i;
  return MON[((m % 12) + 12) % 12] + " " + (a.y + Math.floor(m/12));
}
function monthStart(i){
  const a = armDate(), m = a.m - 1 + i;
  return dayOf({ y:a.y + Math.floor(m/12), m:((m % 12) + 12) % 12 + 1, d:1 });
}
function curveSet(mx, my){
  const tu = tuneCfg();
  if(!tu.curve || !tu.curve.length) return;
  const i = monthIxOf(Math.round(dayAt(mx - T.view.x)));
  const v = clamp(Math.round(100 * (1 - (my - CH_T) / (CH_H - CH_T - CH_B))), 0, 100);
  if(tu.curve[i] !== v){
    tu.curve[i] = v;
    buildSys(); paintTrack(); paintHead();
  }
  trackTip(mx, my, monthLabel(i), "target " + tu.curve[i] + "  <span style=\"color:#b9c2cc\">band " + (tu.curve[i]-tuneCfg().band) + "&ndash;" + (tu.curve[i]+tuneCfg().band) + "</span>");
}
function curveScript(){
  const cur = tuneCfg().curve || [];
  let out = "\tclear_array = usa_apr_target_array\n";
  cur.forEach((v,i)=>{
    out += "\tadd_to_array = { array = usa_apr_target_array value = " + v + " }\t# " + monthLabel(i) + "\n";
  });
  return out;
}
function copyText(text, msg, fname){
  const fall = ()=>{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    ta.remove();
    if(ok) toast(msg); else download(fname, text, "text/plain");
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast(msg), fall);
  else fall();
}

/* the modelled value on a given day, for tooltips and dots */
function simAt(day){
  const sim = SYS.sim;
  if(!sim.length) return { apr:SYS.first.apr, chaos:SYS.first.chaos, target:SYS.first.apr };
  const i = clamp(Math.round(day - sim[0].day), 0, sim.length - 1);
  return sim[i];
}

/* ---- pointer ---- */
function trackTip(mx, my, head, body){
  tTip.innerHTML = '<b>' + esc(head) + '</b>' + body;
  tTip.hidden = false;
  const w = tTip.offsetWidth, h = tTip.offsetHeight;
  tTip.style.left = clamp(mx - w/2, 6, Math.max(6, tBody.clientWidth - w - 6)) + "px";
  tTip.style.top  = clamp(my - h - 14, 6, Math.max(6, tBody.clientHeight - h - 6)) + "px";
}
function hideTrackTip(){ tTip.hidden = true; if(tCursor != null){ tCursor = null; paintTrack(); } }
function hitTrack(mx, my){
  if(mx < GUT) return null;
  if(my <= CH_H){
    let best = null, bd = 13;
    tPts.forEach(t=>{ const d = Math.abs(t.x - mx); if(d < bd){ bd = d; best = t; } });
    return best ? { kind:"pt", t:best } : { kind:"scan" };
  }
  const row = Math.floor((my - (CH_H + 6)) / SPI_ROW);
  const bar = tBars.find(b=>b.row === row && mx >= b.x0 - 2 && mx <= b.x1 + 2);
  return bar ? { kind:"bar", b:bar } : null;
}

let tDrag = null;
tCv.addEventListener("pointerdown", e=>{
  if(e.button !== 0) return;
  const r = tCv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if(curveEdit && mx > GUT && my <= CH_H){
    tDrag = { curve:true, moved:true };
    tCv.setPointerCapture(e.pointerId);
    curveSet(mx, my);
    e.preventDefault();
    return;
  }
  tDrag = { x0:e.clientX, vx:T.view.x, moved:false };
  tCv.setPointerCapture(e.pointerId);
  e.preventDefault();
});
tCv.addEventListener("pointermove", e=>{
  const r = tCv.getBoundingClientRect();
  if(tDrag && tDrag.curve){ curveSet(e.clientX - r.left, e.clientY - r.top); return; }
  if(tDrag){
    const dx = e.clientX - tDrag.x0;
    if(!tDrag.moved && Math.abs(dx) < 4) return;
    tDrag.moved = true;
    hideTrackTip();
    T.view.x = tDrag.vx + dx;
    repan();
    return;
  }
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const hit = hitTrack(mx, my);
  if(!hit){ hideTrackTip(); return; }

  if(hit.kind === "pt"){
    const p = hit.t.p, s = splitText(p.e.text), bits = [];
    if(p.dl.apr)   bits.push('<span style="color:#9fb4cf">apr</span> ' + sgn(p.dl.apr));
    if(p.dl.chaos) bits.push('<span style="color:#e0a79e">chaos</span> ' + sgn(p.dl.chaos));
    const at = hit.t.at;
    bits.push('&rarr; ' + fmt1(at.apr) + " / " + fmt1(at.chaos));
    if(showSim() && p.r && p.r.spent > 0.5){
      bits.push('<span style="color:#e8c46b">' + fmt1(p.r.spent) + ' outside the band, gone in '
              + Math.ceil(p.r.spent / Math.max(tuneCfg().bleed, 0.01)) + 'd</span>');
    }
    if(tCursor !== hit.t.x){ tCursor = hit.t.x; paintTrack(); }
    trackTip(hit.t.x, my, niceDate(fromDay(p.day)) + "  \u00b7  " + (s.title || "Untitled"), bits.join("&nbsp;&nbsp; "));
    return;
  }
  if(hit.kind === "scan"){
    const day = Math.round(dayAt(mx - T.view.x));
    const at = simAt(day);
    if(tCursor !== mx){ tCursor = mx; paintTrack(); }
    trackTip(mx, my, niceDate(fromDay(day)),
      '<span style="color:#9fb4cf">apr</span> ' + fmt1(at.apr)
      + '&nbsp;&nbsp; <span style="color:#e0a79e">chaos</span> ' + fmt1(at.chaos)
      + '&nbsp;&nbsp; <span style="color:#b9c2cc">trend</span> ' + fmt1(at.target)
      + '&nbsp;&nbsp; tier ' + tierAt(at.apr, tuneCfg()));
    return;
  }
  const b = hit.b;
  const mid = clamp((Math.max(b.x0, GUT) + Math.min(b.x1, tBody.clientWidth))/2, GUT, tBody.clientWidth);
  if(b.tier){
    trackTip(mid, my, "USA_approval_tier_" + b.tier.tier,
      esc(niceDate(fromDay(b.tier.from)) + (b.tier.to ? "  \u2192  " + niceDate(fromDay(b.tier.to)) : "  \u2192  to the end")
        + "   swapped in by the system"));
  } else {
    trackTip(mid, my, b.sp.idea,
      esc(niceDate(fromDay(b.sp.from)) + (b.sp.to ? "  \u2192  " + niceDate(fromDay(b.sp.to)) : "  \u2192  never removed")));
  }
});
function endTrackDrag(e){
  if(!tDrag) return;
  const d = tDrag; tDrag = null;
  if(d.curve){ saveT(); push(); hideTrackTip(); return; }
  if(d.moved){ saveT(); return; }
  const r = tCv.getBoundingClientRect();
  const hit = hitTrack(e.clientX - r.left, e.clientY - r.top);
  if(!hit) return;
  let key = null;
  if(hit.kind === "pt") key = hit.t.p.key;
  else if(hit.kind === "bar" && hit.b.sp) key = "ev:" + hit.b.sp.evId;
  if(!key) return;
  select(key); focusOn(key); paintTrack();
}
tCv.addEventListener("pointerup", endTrackDrag);
tCv.addEventListener("pointercancel", ()=>{ tDrag = null; });
tCv.addEventListener("pointerleave", hideTrackTip);
tCv.addEventListener("dblclick", e=>{
  const r = tCv.getBoundingClientRect();
  const hit = hitTrack(e.clientX - r.left, e.clientY - r.top);
  if(hit && hit.kind === "pt") openEditor(hit.t.p.key);
});
tCv.addEventListener("wheel", e=>{
  e.preventDefault();
  const r = tCv.getBoundingClientRect();
  const raw = e.deltaY * (e.deltaMode === 1 ? 16 : 1);
  zoomAt(e.clientX - r.left, Math.exp(-clamp(raw, -240, 240) * 0.0022));
  saveSoon();
}, { passive:false });

document.addEventListener("keydown", e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key === "Escape"){ if(veil) closeModal(); else { document.querySelectorAll(".pick").forEach(p=>{p.hidden=true;}); } return; }
  if(e.metaKey || e.ctrlKey){
    const k = String(e.key||"").toLowerCase();
    if(k === "s"){ e.preventDefault(); exportJSON(); }
    else if(k === "o"){ e.preventDefault(); $("#fileJson").click(); }
    else if(k === "f"){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
    else if(k === "z" && !e.shiftKey){ e.preventDefault(); step(-1); }
    else if((k === "z" && e.shiftKey) || k === "y"){ e.preventDefault(); step(1); }
    return;
  }
  if(typing || veil) return;
  if(e.key === "n" || e.key === "N"){ e.preventDefault(); $("#btnNew").click(); }
  else if(e.key === "f" || e.key === "F"){ e.preventDefault(); fitAll(); }
  else if(e.key === "Delete"){
    if(!selKey) return;
    e.preventDefault();
    const it = findItem(selKey);
    if(!it) return;
    if(it.src === "note"){
      const i = T.items.findIndex(n=>n.id === it.id);
      if(i !== -1 && confirm("Delete the note \u201c" + (it.title||"Untitled") + "\u201d?")){
        T.items.splice(i,1); selKey = null; commit(); toast("Note deleted");
      }
    } else toast("Open the event to delete it \u2014 that also removes it from the mod.");
  }
  else if(e.key === "+" || e.key === "="){ zoomAt(viewW()/2, 1.4); saveT(); }
  else if(e.key === "-" || e.key === "_"){ zoomAt(viewW()/2, 1/1.4); saveT(); }
  else if(e.key === "ArrowLeft"){ T.view.x += 90; repan(); }
  else if(e.key === "ArrowRight"){ T.view.x -= 90; repan(); }
  else if(e.key === "ArrowUp"){ T.view.y += 60; repan(); }
  else if(e.key === "ArrowDown"){ T.view.y -= 60; repan(); }
});

/* The event maker autosaves into the same bucket. When it changes in
   another tab, pick it up rather than sit on a stale copy. */
addEventListener("storage", e=>{
  if(e.key !== EKEY) return;
  const fresh = loadP();
  if(!fresh) return;
  P = fresh;
  rebuild(); repan();
  toast("Reloaded events from the event maker");
});

/* ---------------------------------------------------------------------
   17. Boot
   --------------------------------------------------------------------- */
const firstRun = store.get(TKEY) == null && store.get(TKEY_OLD) == null;
T = loadT();
P = loadP();

$("#q").value = "";
$("#srcEv").checked = T.ui.srcEv !== false;
$("#srcNote").checked = T.ui.srcNote !== false;
$("#sort").value = T.ui.sort || "date";
$("#drawer").classList.toggle("shut", T.ui.drawer === false);
trackFields();
setPx(T.view.px, true);

rebuild();
if(firstRun) fitAll(); else repan();

const hash = /[#&]ev=([A-Za-z0-9_-]+)/.exec(location.hash || "");
if(hash){
  const key = "ev:" + hash[1];
  if(REC.some(r=>r.it.key === key)){ select(key); focusOn(key); }
  else {
    const it = derive().find(x=>x.key === key);
    if(it) openEditor(key);
  }
}
push();
</script>
</body>
</html>
