<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Tree Creator — The American Dream</title>
<meta name="description" content="Design Hearts of Iron IV national focus trees on a visual grid — dates, effects, modifiers, imported icons with shine — and export a ready-to-drop mod ZIP.">
<style>
:root{
  --paper:#F5F6F2; --card:#FFFFFF; --sunk:#EFF1EC; --board:#E7E9E2;
  --ink:#14171A; --ink2:#5A6169; --ink3:#8A9199;
  --line:#DEE1DA; --line2:#C9CDC3;
  --accent:#1F3A5F; --accent2:#2E5C8A; --gold:#8A6A18; --ok:#3E6B4A; --warn:#8A6A18; --bad:#A33A2A;
  --prereq:#5A6169; --mutex:#A33A2A;
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:var(--font-mono)}

/* ---------- layout ---------- */
.app{display:flex; flex-direction:column; height:100vh; overflow:hidden}
.topbar{
  display:flex; align-items:center; gap:10px; padding:8px 12px;
  background:var(--card); border-bottom:1px solid var(--line); flex:0 0 auto; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:8px; margin-right:6px}
.brand b{font-size:15px; letter-spacing:.2px}
.brand span{font-size:11px; color:var(--ink3)}
.topbar .field{display:flex; align-items:center; gap:5px}
.topbar .field label{font-size:11px; color:var(--ink2); text-transform:uppercase; letter-spacing:.4px}
.topbar input{
  background:var(--sunk); border:1px solid var(--line); border-radius:var(--r);
  padding:5px 7px; min-width:0;
}
.topbar input.tag{width:52px; text-transform:uppercase; text-align:center; font-family:var(--font-mono)}
.topbar input.date{width:82px; font-family:var(--font-mono)}
.topbar input.name{width:150px}
.topbar input.num{width:48px; text-align:center}
.spacer{flex:1 1 auto}
.btn{
  background:var(--card); border:1px solid var(--line2); border-radius:var(--r);
  padding:6px 11px; font-size:13px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2); color:#fff}
.btn.active{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk); color:var(--accent)}
.btn.sm{padding:3px 8px; font-size:12px}
.btn.danger:hover{border-color:var(--bad); color:var(--bad)}

/* ---------- body split ---------- */
.body{flex:1 1 auto; display:flex; min-height:0}
.stage{flex:1 1 auto; position:relative; overflow:auto; background:var(--board)}
.panel{
  flex:0 0 380px; max-width:44vw; background:var(--card); border-left:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}

/* ---------- board / canvas ---------- */
.board{position:relative; transform-origin:0 0;}
.grid-bg{position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(0,0,0,.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,.045) 1px, transparent 1px);
}
svg.links{position:absolute; inset:0; pointer-events:none; overflow:visible}
.node{
  position:absolute; width:104px; height:98px; background:var(--card);
  border:1px solid var(--line2); border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.06);
  display:flex; flex-direction:column; align-items:center; padding:6px 4px 4px; cursor:grab; user-select:none;
  transition:border-color .1s, box-shadow .1s;
}
.node:hover{border-color:var(--accent2)}
.node.sel{border-color:var(--accent); box-shadow:0 0 0 2px rgba(31,58,95,.25)}
.node.linksrc{border-color:var(--gold); box-shadow:0 0 0 2px rgba(138,106,24,.35)}
.node.dragging{cursor:grabbing; opacity:.9; z-index:50}
.node .ic{width:48px; height:48px; display:flex; align-items:center; justify-content:center;
  background:var(--sunk); border-radius:6px; overflow:hidden; flex:0 0 auto}
.node .ic img{width:100%; height:100%; object-fit:contain; image-rendering:auto}
.node .ic .ph{font-size:9px; color:var(--ink3); text-align:center; line-height:1.1; padding:2px; word-break:break-all}
.node .nm{font-size:11px; font-weight:600; text-align:center; margin-top:3px; line-height:1.12;
  max-height:26px; overflow:hidden; width:100%}
.node .meta{font-size:9.5px; color:var(--ink2); margin-top:auto; font-family:var(--font-mono)}
.node .badge{position:absolute; top:-7px; right:-7px; background:var(--gold); color:#fff;
  font-size:9px; border-radius:8px; padding:1px 5px; display:none}
.node.hasadv .badge{display:block}

.stage-hint{position:absolute; left:50%; top:40%; transform:translate(-50%,-50%);
  text-align:center; color:var(--ink3); font-size:14px; pointer-events:none; width:70%}
.stage-hint b{color:var(--ink2)}
.linkbanner{position:sticky; top:0; z-index:60; margin:0; padding:7px 12px; text-align:center;
  background:var(--gold); color:#fff; font-size:13px; display:none}
.linkbanner.on{display:block}
.zoombar{position:absolute; right:12px; bottom:12px; z-index:40; background:var(--card);
  border:1px solid var(--line2); border-radius:20px; padding:4px 6px; display:flex; align-items:center; gap:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoombar button{border:none; background:transparent; width:26px; height:26px; border-radius:50%; font-size:15px}
.zoombar button:hover{background:var(--sunk)}
.zoombar span{font-size:11px; color:var(--ink2); min-width:38px; text-align:center; font-family:var(--font-mono)}

/* ---------- side panel ---------- */
.panel .ph-empty{padding:26px 18px; color:var(--ink3); font-size:13px; text-align:center}
.panel-head{padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; flex:0 0 auto}
.panel-head .ptitle{font-weight:600; font-size:13px}
.tabs{display:flex; gap:2px; padding:8px 12px 0; flex:0 0 auto}
.tab{padding:6px 12px; font-size:12.5px; border:1px solid transparent; border-bottom:none;
  border-radius:6px 6px 0 0; color:var(--ink2); background:transparent}
.tab.on{background:var(--sunk); color:var(--ink); border-color:var(--line)}
.tab .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gold); margin-left:5px; vertical-align:middle; opacity:0}
.tab.hasadv .dot{opacity:1}
.panel-scroll{flex:1 1 auto; overflow:auto; padding:12px 14px 40px; border-top:1px solid var(--line)}
.fld{margin-bottom:13px}
.fld > label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink2); margin-bottom:4px}
.fld .hint{font-size:11px; color:var(--ink3); margin-top:3px; line-height:1.35}
.inp, textarea.inp, select.inp{
  width:100%; background:var(--sunk); border:1px solid var(--line); border-radius:var(--r); padding:7px 8px;
}
textarea.inp{resize:vertical; font-family:var(--font-mono); font-size:12.5px; line-height:1.5; min-height:64px; white-space:pre}
.row2{display:flex; gap:8px}
.row2 > *{flex:1 1 0; min-width:0}
.inline{display:flex; align-items:center; gap:8px}
.iconpick{display:flex; align-items:center; gap:10px}
.iconpick .prev{width:56px; height:56px; background:var(--sunk); border:1px solid var(--line); border-radius:6px;
  display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto}
.iconpick .prev img{width:100%; height:100%; object-fit:contain}
.iconpick .prev .ph{font-size:8px; color:var(--ink3); text-align:center; padding:2px; word-break:break-all}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:2px}
.chip{display:inline-flex; align-items:center; gap:5px; background:var(--sunk); border:1px solid var(--line);
  border-radius:14px; padding:3px 6px 3px 9px; font-size:12px; font-family:var(--font-mono)}
.chip button{border:none; background:transparent; color:var(--ink3); font-size:14px; line-height:1; padding:0 2px}
.chip button:hover{color:var(--bad)}
.chip.mx{border-color:#e3c9c4; background:#f8ecea}
.derived{background:var(--sunk); border:1px solid var(--line); border-radius:var(--r); padding:8px 10px; font-size:12px}
.derived b{font-family:var(--font-mono); color:var(--accent)}
.seg{display:inline-flex; border:1px solid var(--line2); border-radius:var(--r); overflow:hidden}
.seg button{border:none; background:var(--card); padding:4px 10px; font-size:12px}
.seg button.on{background:var(--accent); color:#fff}
.checkline{display:flex; align-items:center; gap:7px; font-size:13px; margin:6px 0}
.checkline input{width:15px; height:15px}
.mini{font-size:11px; color:var(--ink3)}
.fx-tools{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:5px}
details.adv-sub{border:1px solid var(--line); border-radius:var(--r); margin-bottom:11px; background:var(--sunk)}
details.adv-sub > summary{padding:7px 10px; font-size:12.5px; font-weight:600; cursor:pointer; list-style:none}
details.adv-sub > summary::-webkit-details-marker{display:none}
details.adv-sub > summary::before{content:"▸ "; color:var(--ink3)}
details.adv-sub[open] > summary::before{content:"▾ "}
details.adv-sub .adv-body{padding:0 10px 10px}
.filtergrid{display:grid; grid-template-columns:1fr 1fr; gap:3px 10px}
.filtergrid label{font-size:12px; display:flex; gap:6px; align-items:center}

/* ---------- picker dropdown ---------- */
.pick{position:absolute; z-index:200; width:340px; max-width:90vw; background:var(--card);
  border:1px solid var(--line2); border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.22); overflow:hidden}
.pick-top{padding:8px; border-bottom:1px solid var(--line)}
.pick-top input{width:100%; background:var(--sunk); border:1px solid var(--line); border-radius:var(--r); padding:7px 9px}
.pick-list{max-height:320px; overflow:auto}
.pick-grp{padding:6px 10px 2px; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink3);
  position:sticky; top:0; background:var(--card)}
.pick-item{padding:6px 10px; cursor:pointer; border-top:1px solid var(--line)}
.pick-item:hover, .pick-item.hl{background:var(--sunk)}
.pick-item .pn{font-family:var(--font-mono); font-size:12.5px; color:var(--accent)}
.pick-item .pd{font-size:11.5px; color:var(--ink2); line-height:1.3}

/* ---------- modal ---------- */
.veil{position:fixed; inset:0; background:rgba(20,23,26,.42); z-index:300; display:flex; align-items:center; justify-content:center; padding:24px}
.modal{background:var(--card); border-radius:10px; width:760px; max-width:96vw; max-height:90vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.modal-h h3{margin:0; font-size:15px}
.modal-b{padding:14px 16px; overflow:auto}
.modal-f{padding:11px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; align-items:center}

/* icon library grid */
.iconsearch{display:flex; gap:8px; margin-bottom:10px}
.iconsearch input{flex:1 1 auto; background:var(--sunk); border:1px solid var(--line); border-radius:var(--r); padding:8px 10px}
.icongrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px}
.icontile{border:1px solid var(--line); border-radius:6px; padding:6px 4px; text-align:center; cursor:pointer; background:var(--sunk); overflow:hidden}
.icontile:hover{border-color:var(--accent); background:var(--card)}
.icontile.sel{border-color:var(--accent); box-shadow:0 0 0 2px rgba(31,58,95,.2)}
.icontile .box{width:100%; height:52px; display:flex; align-items:center; justify-content:center; background:var(--board); border-radius:4px; margin-bottom:4px; overflow:hidden}
.icontile .box img{max-width:100%; max-height:100%; object-fit:contain}
.icontile .box .g{font-size:9px; color:var(--ink3); padding:3px; word-break:break-all; line-height:1.15}
.icontile .cap{font-size:10px; color:var(--ink2); font-family:var(--font-mono); word-break:break-all; line-height:1.1; max-height:24px; overflow:hidden}
.libcount{font-size:11px; color:var(--ink3); margin-left:auto}

/* ideas manager */
.idea-card{border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; background:var(--sunk)}
.idea-card .ihead{display:flex; gap:8px; align-items:center; margin-bottom:8px}
.mod-row{display:flex; gap:6px; align-items:center; margin:4px 0}
.mod-row .mk{flex:1 1 auto; font-family:var(--font-mono); font-size:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:5px 7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mod-row input{width:78px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:5px 6px; font-family:var(--font-mono); text-align:right}

/* toast */
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:9px 16px; border-radius:20px; font-size:13px; z-index:400; box-shadow:0 6px 24px rgba(0,0,0,.3)}
.issue{border:1px solid var(--line); border-left-width:3px; border-radius:var(--r); padding:8px 10px; margin-bottom:7px; font-size:13px; background:var(--card)}
.issue.error{border-left-color:var(--bad)}
.issue.warn{border-left-color:var(--warn)}
.issue.info{border-left-color:var(--accent2)}
.issue .who{font-family:var(--font-mono); font-size:11.5px; color:var(--ink3)}
kbd{font-family:var(--font-mono); font-size:11px; background:var(--sunk); border:1px solid var(--line2); border-bottom-width:2px; border-radius:4px; padding:1px 5px}
a{color:var(--accent2)}
</style>
</head>
<body>
<div class="app">
  <!-- ================= TOP BAR ================= -->
  <div class="topbar">
    <div class="brand"><b>Focus Tree Creator</b><span>The American Dream</span></div>
    <div class="field"><label>Mod</label><input class="name" id="mMod" placeholder="The Dream" spellcheck="false"></div>
    <div class="field"><label>Tag</label><input class="tag" id="mTag" maxlength="3" value="USA" spellcheck="false"></div>
    <div class="field"><label>Start</label><input class="date" id="mStart" value="1936.1.1" spellcheck="false"></div>
    <div class="field"><label>Days / cost</label><input class="num" id="mDpc" value="7"></div>
    <div class="spacer"></div>
    <button class="btn" id="bAdd">＋ Focus</button>
    <button class="btn" id="bPre" title="Draw a prerequisite: click the parent, then the child">↳ Prerequisite</button>
    <button class="btn" id="bMx" title="Draw a mutually-exclusive link: click one focus, then the other">⇄ Exclusive</button>
    <button class="btn" id="bIdeas">◆ Spirits</button>
    <button class="btn ghost" id="bSave" title="Save project file">Save</button>
    <button class="btn ghost" id="bOpen" title="Open project file">Open</button>
    <button class="btn ghost" id="bHelp">?</button>
    <button class="btn primary" id="bExport">Export ZIP</button>
  </div>

  <div class="body">
    <!-- ================= STAGE ================= -->
    <div class="stage" id="stage">
      <div class="linkbanner" id="linkBanner"></div>
      <div class="board" id="board">
        <div class="grid-bg" id="gridBg"></div>
        <svg class="links" id="links"></svg>
        <!-- nodes injected -->
      </div>
      <div class="stage-hint" id="stageHint">
        <b>Empty tree.</b><br>Click <b>＋ Focus</b> to place your first focus, then drag it around the grid.<br>
        Use <b>↳ Prerequisite</b> and <b>⇄ Exclusive</b> to link focuses.
      </div>
      <div class="zoombar">
        <button id="zOut">－</button><span id="zLbl">100%</span><button id="zIn">＋</button>
        <button id="zFit" title="Fit / reset" style="font-size:12px">⤢</button>
      </div>
    </div>

    <!-- ================= PANEL ================= -->
    <div class="panel" id="panel">
      <div class="ph-empty" id="panelEmpty">
        Select a focus to edit it,<br>or add a new one.
      </div>
      <div id="panelBody" style="display:none; flex:1 1 auto; min-height:0; flex-direction:column">
        <div class="panel-head">
          <span class="ptitle">Focus</span>
          <span class="mono mini" id="pKeyEcho"></span>
          <div class="spacer"></div>
          <button class="btn sm" id="pDup" title="Duplicate">Duplicate</button>
          <button class="btn sm danger" id="pDel" title="Delete focus">Delete</button>
        </div>
        <div class="tabs">
          <button class="tab on" data-tab="basic">Essentials</button>
          <button class="tab" data-tab="adv">Advanced<span class="dot"></span></button>
        </div>
        <div class="panel-scroll" id="tabBasic"></div>
        <div class="panel-scroll" id="tabAdv" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileImg" accept="image/*" style="display:none">
<input type="file" id="fileProj" accept="application/json,.json" style="display:none">

const $$=s=>Array.from(document.querySelectorAll(s));
let _uid=1; function uid(){ return "f"+(_uid++)+"_"+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function slug(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,48); }
function clampInt(v,min,max,dflt){ v=parseInt(v,10); if(isNaN(v))return dflt; if(min!=null)v=Math.max(min,v); if(max!=null)v=Math.min(max,v); return v; }

const SAVE_KEY="ftc_project_v1";
function defMeta(){ return { mod:"", tag:"USA", start:"1936.1.1", dpc:7, treeId:"" }; }
let P = { meta:defMeta(), focuses:[], ideas:[], icons:{} };
let selId=null, view={z:1};

function newFocus(x,y){
  return {
    id:uid(), key:"", autoKey:"", name:"", desc:"", icon:"GFX_goal_unknown", custom:false,
    x:x, y:y, cost:5,
    prereq:[], prereqMode:"all", mutex:[], relTo:"",
    reward:"", available:"", aiWillDo:"", selectEffect:"", bypass:"", completeTooltip:"",
    searchFilters:[], willWarWith:"", offX:0, offY:0,
    flags:{ availCap:false, cancelInvalid:false, contInvalid:false, dynamic:false }, allowBranch:""
  };
}
function newIdea(){
  return { id:uid(), key:"", name:"", desc:"", icon:"GFX_goal_unknown", removalCost:-1, mods:[], custom:false };
}
function byId(id){ return P.focuses.find(f=>f.id===id); }
function tag(){ return (P.meta.tag||"USA").toUpperCase().replace(/[^A-Z]/g,"").slice(0,3)||"USA"; }
function treeId(){ return P.meta.treeId && P.meta.treeId.trim() ? P.meta.treeId.trim() : tag().toLowerCase()+"_focus_dream"; }

function persist(){ try{ store.set(SAVE_KEY, JSON.stringify(P)); }catch(e){} }
function loadSaved(){
  const raw=store.get(SAVE_KEY); if(!raw) return false;
  try{
    const j=JSON.parse(raw);
    if(j && j.focuses){ P = normalize(j); return true; }
  }catch(e){}
  return false;
}
function normalize(j){
  const m=Object.assign(defMeta(), j.meta||{});
  const icons=j.icons||{};
  const focuses=(j.focuses||[]).map(f=>Object.assign(newFocus(f.x||0,f.y||0), f, {
    flags:Object.assign({availCap:false,cancelInvalid:false,contInvalid:false,dynamic:false}, f.flags||{}),
    searchFilters:f.searchFilters||[], prereq:f.prereq||[], mutex:f.mutex||[]
  }));
  const ideas=(j.ideas||[]).map(i=>Object.assign(newIdea(), i, { mods:i.mods||[] }));
  // keep uid counter ahead
  return { meta:m, focuses, ideas, icons };
}

/* =====================================================================
   5. Board geometry, rendering
   ===================================================================== */
const GX=124, GY=132, PAD=48, NW=104, NH=98;
function cellLeft(x){ return PAD + x*GX + (GX-NW)/2; }
function cellTop(y){ return PAD + y*GY + 6; }

function iconHTML(name, cls){
  const cust = P.icons[name];
  if(cust) return '<img src="'+cust.url+'" alt="">';
  return '<div class="'+(cls||"ph")+'">'+esc(name.replace(/^GFX_/,""))+'</div>';
}

function computeDates(){
  const dpc=Math.max(1, P.meta.dpc||7);
  const base=parseDate(P.meta.start)||{y:1936,mo:1,d:1};
  const memo={};
  function rec(id, stack){
    if(memo[id]!=null) return memo[id];
    const f=byId(id); if(!f) return 0;
    if(stack.has(id)) return (f.cost||0)*dpc;
    stack.add(id);
    const pre=(f.prereq||[]).filter(pid=>byId(pid));
    let b=0;
    if(pre.length){
      const vals=pre.map(pid=>rec(pid,stack));
      b = f.prereqMode==="any" ? Math.min.apply(null,vals) : Math.max.apply(null,vals);
    }
    stack.delete(id);
    const t=b+(f.cost||0)*dpc; memo[id]=t; return t;
  }
  const out={};
  P.focuses.forEach(f=>{
    const total=rec(f.id,new Set());
    out[f.id]={ days:(f.cost||0)*dpc, total:total, finish:addDays(base,total) };
  });
  return out;
}
function parseDate(s){ const m=/^\s*(\d+)\.(\d+)\.(\d+)/.exec(String(s||"")); return m?{y:+m[1],mo:+m[2],d:+m[3]}:null; }
function addDays(base,days){
  const dt=new Date(Date.UTC(base.y,base.mo-1,base.d));
  dt.setUTCDate(dt.getUTCDate()+Math.round(days));
  return dt.getUTCFullYear()+"."+(dt.getUTCMonth()+1)+"."+dt.getUTCDate();
}

let DATES={};
function focusHasAdv(f){
  return !!(f.available||f.aiWillDo||f.selectEffect||f.bypass||f.completeTooltip||
    (f.searchFilters&&f.searchFilters.length)||f.willWarWith||f.relTo||f.allowBranch||
    (f.flags&&(f.flags.availCap||f.flags.cancelInvalid||f.flags.contInvalid||f.flags.dynamic)));
}

function render(){
  DATES=computeDates();
  const board=$("#board");
  // size the board to fit
  let maxX=6,maxY=4;
  P.focuses.forEach(f=>{ maxX=Math.max(maxX,f.x); maxY=Math.max(maxY,f.y); });
  const W=cellLeft(maxX+2), H=cellTop(maxY+2);
  board.style.width=W+"px"; board.style.height=H+"px";
  board.style.transform="scale("+view.z+")";
  $("#gridBg").style.width=W+"px"; $("#gridBg").style.height=H+"px";
  $("#gridBg").style.backgroundSize=GX+"px "+GY+"px";
  $("#gridBg").style.backgroundPosition=PAD+"px "+PAD+"px";

  // nodes
  board.querySelectorAll(".node").forEach(n=>n.remove());
  P.focuses.forEach(f=>{
    const n=document.createElement("div");
    n.className="node"+(f.id===selId?" sel":"")+(focusHasAdv(f)?" hasadv":"")+(linkSrc===f.id?" linksrc":"");
    n.dataset.id=f.id;
    n.style.left=cellLeft(f.x)+"px"; n.style.top=cellTop(f.y)+"px";
    const d=DATES[f.id]||{days:0,finish:""};
    n.innerHTML=
      '<span class="badge">adv</span>'+
      '<div class="ic">'+iconHTML(f.icon)+'</div>'+
      '<div class="nm">'+esc(f.name||f.key||"(unnamed)")+'</div>'+
      '<div class="meta">'+d.days+'d · '+esc(d.finish)+'</div>';
    board.appendChild(n);
  });
  drawLinks();
  $("#stageHint").style.display = P.focuses.length ? "none":"block";
  syncTopbar();
  persist();
}

function nodeAnchor(f, which){
  const l=cellLeft(f.x), t=cellTop(f.y);
  if(which==="top") return {x:l+NW/2, y:t};
  if(which==="bottom") return {x:l+NW/2, y:t+NH};
  if(which==="left") return {x:l, y:t+NH/2};
  if(which==="right") return {x:l+NW, y:t+NH/2};
  return {x:l+NW/2, y:t+NH/2};
}
function drawLinks(){
  const svg=$("#links");
  let maxX=6,maxY=4; P.focuses.forEach(f=>{ maxX=Math.max(maxX,f.x); maxY=Math.max(maxY,f.y); });
  svg.setAttribute("width", cellLeft(maxX+2)); svg.setAttribute("height", cellTop(maxY+2));
  let s="";
  // prerequisite links: parent bottom -> child top (elbow)
  P.focuses.forEach(child=>{
    (child.prereq||[]).forEach(pid=>{
      const parent=byId(pid); if(!parent) return;
      const a=nodeAnchor(parent,"bottom"), b=nodeAnchor(child,"top");
      const midY=(a.y+b.y)/2;
      s+='<path d="M '+a.x+' '+a.y+' L '+a.x+' '+midY+' L '+b.x+' '+midY+' L '+b.x+' '+b.y+
         '" fill="none" stroke="var(--prereq)" stroke-width="2" stroke-linejoin="round"/>';
      s+='<circle cx="'+b.x+'" cy="'+b.y+'" r="3" fill="var(--prereq)"/>';
    });
  });
  // mutex links (draw each pair once)
  const seen={};
  P.focuses.forEach(f=>{
    (f.mutex||[]).forEach(oid=>{
      const key=[f.id,oid].sort().join("|"); if(seen[key])return; seen[key]=1;
      const o=byId(oid); if(!o)return;
      const a=nodeAnchor(f, f.x<=o.x?"right":"left");
      const b=nodeAnchor(o, f.x<=o.x?"left":"right");
      s+='<path d="M '+a.x+' '+a.y+' L '+b.x+' '+b.y+'" fill="none" stroke="var(--mutex)" stroke-width="2" stroke-dasharray="5 4"/>';
    });
  });
  svg.innerHTML=s;
}

let linkMode=null;     // 'pre' | 'mx' | null
let linkSrc=null;      // focus id chosen first
const stage=$("#stage"), board=$("#board");

board.addEventListener("mousedown", e=>{
  const node=e.target.closest(".node");
  if(!node) return;
  const f=byId(node.dataset.id); if(!f) return;
  if(linkMode){ e.preventDefault(); handleLinkClick(f); return; }
  // select without rebuilding the board, so the node we grabbed stays attached
  selId=f.id; highlightSelection(); renderPanel();
  startDrag(f, node, e);
});
function highlightSelection(){
  document.querySelectorAll(".node").forEach(n=>{
    n.classList.toggle("sel", n.dataset.id===selId);
    n.classList.toggle("linksrc", n.dataset.id===linkSrc);
  });

function startDrag(f, node, e){
  const z=view.z;
  const startX=e.clientX, startY=e.clientY, ox=f.x, oy=f.y;
  node.classList.add("dragging");
  let moved=false;
  function mv(ev){
    const dx=(ev.clientX-startX)/z, dy=(ev.clientY-startY)/z;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    const nx=Math.max(0, Math.round(ox + dx/GX));
    const ny=Math.max(0, Math.round(oy + dy/GY));
    if(nx!==f.x||ny!==f.y){ f.x=nx; f.y=ny; node.style.left=cellLeft(nx)+"px"; node.style.top=cellTop(ny)+"px"; drawLinks(); }
  }
  function up(){
    document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up);
    node.classList.remove("dragging");
    if(moved){ refreshDerived(f); render(); persist(); }
  }
  document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
}

function setLinkMode(m){
  linkMode=(linkMode===m)?null:m; linkSrc=null;
  $("#bPre").classList.toggle("active", linkMode==="pre");
  $("#bMx").classList.toggle("active", linkMode==="mx");
  const b=$("#linkBanner");
  if(linkMode==="pre"){ b.className="linkbanner on"; b.textContent="Prerequisite mode — click the PARENT focus, then the CHILD. Esc to stop."; }
  else if(linkMode==="mx"){ b.className="linkbanner on"; b.textContent="Exclusive mode — click one focus, then the other. Esc to stop."; }
  else b.className="linkbanner";
  render();
}
function handleLinkClick(f){
  if(!linkSrc){ linkSrc=f.id; render(); return; }
  if(linkSrc===f.id){ linkSrc=null; render(); return; }
  const src=byId(linkSrc), dst=f;
  if(linkMode==="pre"){
    // src is parent, dst is child -> child requires src
    if((dst.prereq||[]).indexOf(src.id)<0){
      if(wouldCycle(dst.id, src.id)){ toast("That would make a prerequisite loop."); }
      else { dst.prereq.push(src.id); toast(focusName(dst)+" now needs "+focusName(src)); }
    }
  }else if(linkMode==="mx"){
    src.mutex=src.mutex||[]; dst.mutex=dst.mutex||[];
    if(src.mutex.indexOf(dst.id)<0) src.mutex.push(dst.id);
    if(dst.mutex.indexOf(src.id)<0) dst.mutex.push(src.id);
    toast(focusName(src)+" ⇄ "+focusName(dst));
  }
  linkSrc=null; select(dst.id); render();
}
function focusName(f){ return f.name||focusKey(f); }
function wouldCycle(childId, newParentId){
  // adding newParent as prereq of child: cycle if child is (transitively) a prereq of newParent
  const stack=[newParentId], seen={};
  while(stack.length){
    const id=stack.pop(); if(id===childId) return true;
    if(seen[id]) continue; seen[id]=1;
    const f=byId(id); if(f) (f.prereq||[]).forEach(p=>stack.push(p));
  }
  return false;
}

function fillIconGrid(q){
  q=(q||"").trim().toLowerCase();
  const custom=Object.keys(P.icons);
  let libs=ICONS;
  if(q) libs=ICONS.filter(n=>n.toLowerCase().indexOf(q)>=0);

  const tile=(name)=>'<div class="icontile'+(iconSel===name?" sel":"")+'" data-ic="'+esc(name)+'">'+
      '<div class="box">'+(P.icons[name]?'<img src="'+P.icons[name].url+'">':'<span class="g">'+esc(name.replace(/^GFX_/,""))+'</span>')+'</div>'+
      '<div class="cap">'+esc(name.replace(/^GFX_/,""))+'</div></div>';

/* image import: resize to 95x95, store as data URL under a GFX name */
let picImageMode="library"; // 'library' -> picker flow
$("#fileImg").onchange=ev=>{
  const file=ev.target.files[0]; ev.target.value="";
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const S=95;
      const cv=document.createElement("canvas"); cv.width=S; cv.height=S;
      const cx=cv.getContext("2d"); cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality="high";
      cx.clearRect(0,0,S,S); cx.drawImage(img,0,0,S,S);
      const base=(file.name.replace(/\.[^.]+$/,"")||"custom").replace(/[^A-Za-z0-9_-]/g,"_").toLowerCase();
      let name="GFX_focus_"+tag()+"_"+base, i=2;
      while(P.icons[name] && !(iconSel===name)){ name="GFX_focus_"+tag()+"_"+base+"_"+(i++); }
      P.icons[name]={ url:cv.toDataURL("image/png"), w:S, h:S, file:tag().toLowerCase()+"_"+base, ow:img.naturalWidth, oh:img.naturalHeight };
      persist();
      if($("#iconVeil")){ iconSel=name; fillIconGrid($("#icSearch").value); }
      else if(byId(selId)){ setFocusIcon(byId(selId), name); }
      toast("Imported "+name);
    };
    img.onerror=()=>toast("That file could not be read as an image.");
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
};

function openScriptPicker(anchor, textarea, mode, f, field){

function insertAtCursor(ta, text){

/* =====================================================================
   11. DDS encoder + ZIP writer  (from the Event Maker)
   ===================================================================== */
function ddsFromDataURL(url,w,h){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      const cx=cv.getContext("2d"); cx.drawImage(img,0,0,w,h);
      const px=cx.getImageData(0,0,w,h).data;
      const out=new Uint8Array(128+w*h*4), dv=new DataView(out.buffer);
      out[0]=0x44;out[1]=0x44;out[2]=0x53;out[3]=0x20;
      dv.setUint32(4,124,true); dv.setUint32(8,0x0002100F,true);
      dv.setUint32(12,h,true); dv.setUint32(16,w,true); dv.setUint32(20,w*4,true);
      dv.setUint32(24,1,true); dv.setUint32(28,1,true);
      dv.setUint32(76,32,true); dv.setUint32(80,0x41,true); dv.setUint32(84,0,true);
      dv.setUint32(88,32,true); dv.setUint32(92,0x00FF0000,true); dv.setUint32(96,0x0000FF00,true);
      dv.setUint32(100,0x000000FF,true); dv.setUint32(104,0xFF000000,true); dv.setUint32(108,0x1000,true);
      let p=128;
      for(let i=0;i<px.length;i+=4){ out[p++]=px[i+2]; out[p++]=px[i+1]; out[p++]=px[i]; out[p++]=px[i+3]; }
      res(out);
    };
    img.onerror=()=>rej(new Error("bad image")); img.src=url;
  });
}
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function utf8(s){ return new TextEncoder().encode(s); }
function makeZip(files){
  const parts=[],central=[]; let offset=0;
  const now=new Date();
  const dosTime=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()/2))&0xFFFF;
  const dosDate=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  files.forEach(f=>{
    const name=utf8(f.path), crc=crc32(f.data);
    const lh=new Uint8Array(30+name.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true); dv.setUint16(8,0,true);
    dv.setUint16(10,dosTime,true); dv.setUint16(12,dosDate,true); dv.setUint32(14,crc,true);
    dv.setUint32(18,f.data.length,true); dv.setUint32(22,f.data.length,true); dv.setUint16(26,name.length,true); dv.setUint16(28,0,true);
    lh.set(name,30); parts.push(lh,f.data);
    const ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0x0800,true);
    cv.setUint16(10,0,true); cv.setUint16(12,dosTime,true); cv.setUint16(14,dosDate,true); cv.setUint32(16,crc,true);
    cv.setUint32(20,f.data.length,true); cv.setUint32(24,f.data.length,true); cv.setUint16(28,name.length,true); cv.setUint32(42,offset,true);
    ch.set(name,46); central.push(ch); offset+=lh.length+f.data.length;
  });
  let cSize=0; central.forEach(c=>cSize+=c.length);
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cSize,true); ev.setUint32(16,offset,true);
  const all=parts.concat(central,[end]); let total=0; all.forEach(a=>total+=a.length);
  const out=new Uint8Array(total); let p=0; all.forEach(a=>{ out.set(a,p); p+=a.length; }); return out;
}
function download(name,data,type){
  const blob=new Blob([data],{type:type||"application/octet-stream"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

function ind(s,n){ const pad="\t".repeat(n); return String(s||"").replace(/\r/g,"").split("\n").map(l=>l.trim()===""?"":pad+l).join("\n"); }
function block(name, body, n){ return "\t".repeat(n)+name+" = {\n"+ind(body,n+1)+"\n"+"\t".repeat(n)+"}\n"; }

function buildFocusFile(){
  const T=tag();
  let maxX=6,maxY=4; P.focuses.forEach(f=>{ maxX=Math.max(maxX,f.x); maxY=Math.max(maxY,f.y); });
  let s="";
  s+="focus_tree = {\n";
  s+="\tid = "+treeId()+"\n\n";
  s+="\tcountry = {\n\t\tfactor = 0\n\t\tmodifier = {\n\t\t\tadd = 100\n\t\t\ttag = "+T+"\n\t\t}\n\t}\n\n";
  s+="\tdefault = no\n";
  s+="\treset_on_civilwar = no\n";
  s+="\tcontinuous_focus_position = { x = 50 y = "+((maxY+3)*100)+" }\n\n";
  P.focuses.forEach(f=>{ s+=buildFocus(f); });
  s+="}\n";
  return s;
}
function buildFocus(f){
  const key=focusKey(f);
  let b="";
  b+="\tfocus = {\n";
  b+="\t\tid = "+key+"\n";
  b+="\t\ticon = "+(f.icon||"GFX_goal_unknown")+"\n";
  // if positioned relative to another focus, export coords relative to it so the
  // in-game position matches what you see on the canvas
  let ox=f.x, oy=f.y;
  if(f.relTo && byId(f.relTo)){
    const rel=byId(f.relTo);
    b+="\t\trelative_position_id = "+focusKey(rel)+"\n";
    ox=f.x-rel.x; oy=f.y-rel.y;
  }
  b+="\t\tx = "+ox+"\n\t\ty = "+oy+"\n";
  b+="\t\tcost = "+(f.cost||0)+"\n";
  // prerequisites
  if(f.prereq && f.prereq.length){
    const valid=f.prereq.map(id=>byId(id)).filter(Boolean);
    if(valid.length){
      if(f.prereqMode==="any"){
        b+="\t\tprerequisite = { "+valid.map(p=>"focus = "+focusKey(p)).join(" ")+" }\n";
      }else{
        valid.forEach(p=>{ b+="\t\tprerequisite = { focus = "+focusKey(p)+" }\n"; });
      }
    }
  }
  // mutually exclusive
  if(f.mutex && f.mutex.length){
    const valid=f.mutex.map(id=>byId(id)).filter(Boolean);
    if(valid.length) b+="\t\tmutually_exclusive = { "+valid.map(p=>"focus = "+focusKey(p)).join(" ")+" }\n";
  }
  if(f.searchFilters && f.searchFilters.length) b+="\t\tsearch_filters = { "+f.searchFilters.join(" ")+" }\n";
  if(f.willWarWith) b+="\t\twill_lead_to_war_with = "+f.willWarWith+"\n";
  if(f.flags.availCap) b+="\t\tavailable_if_capitulated = yes\n";
  if(f.flags.cancelInvalid) b+="\t\tcancel_if_invalid = yes\n";
  if(f.flags.contInvalid) b+="\t\tcontinue_if_invalid = yes\n";
  if(f.flags.dynamic) b+="\t\tdynamic = yes\n";
  if(f.allowBranch.trim()) b+=block("allow_branch", f.allowBranch, 2);
  if(f.available.trim()) b+=block("available", f.available, 2);
  if(f.bypass.trim()) b+=block("bypass", f.bypass, 2);
  if(f.selectEffect.trim()) b+=block("select_effect", f.selectEffect, 2);
  // completion reward
  if(f.reward.trim()) b+=block("completion_reward", f.reward, 2);
  else b+="\t\tcompletion_reward = { }\n";
  if(f.completeTooltip.trim()) b+=block("complete_tooltip", f.completeTooltip, 2);
  if(f.aiWillDo.trim()) b+=block("ai_will_do", f.aiWillDo, 2);
  b+="\t}\n\n";
  return b;
}

function ymlLine(key,val){ return " "+key+':0 "'+String(val||"").replace(/"/g,'\\"').replace(/\n/g,"\\n")+'"\n'; }

/* =====================================================================
   13. Validation + export
   ===================================================================== */
function validate(){
  const out=[];
  const keys={};
  P.focuses.forEach(f=>{
    const k=focusKey(f);
    if(!f.name) out.push(["warn", k, "has no in-game name."]);
    if(!/^[A-Za-z0-9_]+$/.test(k)) out.push(["error", k, "script id has characters the game will reject — use letters, numbers, underscore."]);
    if(keys[k]) out.push(["error", k, "duplicate script id — two focuses share it."]); keys[k]=1;
  });
  P.ideas.forEach(i=>{ const k=ideaKey(i); if(!/^[A-Za-z0-9_]+$/.test(k)) out.push(["error", k, "spirit id is invalid."]); });
  if(!P.focuses.length) out.push(["error","tree","no focuses to export."]);
  if(!parseDate(P.meta.start)) out.push(["warn","date","start date is not a valid Y.M.D — dates may look wrong."]);
  return out;
}
async function exportAll(skip){
  if(!P.focuses.length){ toast("Add a focus first."); return; }
  const issues=validate();
  if(!skip && issues.some(i=>i[0]==="error")){ showIssues(issues); return; }
  const T=tag(), ns=treeId();
  const files=[];
  const paths=[];
  function add(path,data){ files.push({path,data:utf8(data)}); paths.push(path); }
  add("common/national_focus/"+T+"_focus.txt", buildFocusFile());
  add("localisation/english/"+T+"_focus_l_english.yml", buildLocFile());
  const gfx=buildGfxFile(); if(gfx){ add("interface/"+T+"_focus.gfx", gfx); }
  const shine=buildShineFile(); if(shine){ add("interface/"+T+"_focus_shine.gfx", shine); }
  const ideas=buildIdeasFile(); if(ideas){ add("common/ideas/"+T+"_focus_ideas.txt", ideas); }
  // dds icons
  for(const n of customIcons()){
    try{ const dds=await ddsFromDataURL(P.icons[n].url, P.icons[n].w, P.icons[n].h);
      files.push({path:"gfx/interface/goals/"+P.icons[n].file+".dds", data:dds}); paths.push("gfx/interface/goals/"+P.icons[n].file+".dds"); }
    catch(e){}
  }
  files.push({path:"README.txt", data:utf8(buildReadme(paths))});
  download(ns+".zip", makeZip(files), "application/zip");
  toast("Exported "+files.length+" files");
}
function showIssues(issues){
  const veil=document.createElement("div"); veil.className="veil";
  const body=issues.map(i=>'<div class="issue '+i[0]+'"><span class="who">'+esc(i[1])+'</span> — '+esc(i[2])+'</div>').join("");
  const nErr=issues.filter(i=>i[0]==="error").length;
  veil.innerHTML='<div class="modal" style="width:520px"><div class="modal-h"><h3>Before exporting</h3></div>'+
    '<div class="modal-b">'+body+'</div>'+
    '<div class="modal-f"><button class="btn" id="ivClose">Close</button>'+
    (nErr?'<button class="btn danger" id="ivGo">Export anyway</button>':'<button class="btn primary" id="ivGo">Export</button>')+'</div></div>';
  document.body.appendChild(veil);
  veil.onclick=e=>{ if(e.target===veil) veil.remove(); };
  $("#ivClose").onclick=()=>veil.remove();
  $("#ivGo").onclick=()=>{ veil.remove(); exportAll(true); };
}

/* =====================================================================
   14. Save / open project, help, toast
   ===================================================================== */
function saveProject(){
  download((tag().toLowerCase())+"_focustree_project.json", utf8(JSON.stringify(P,null,1)), "application/json");
}
$("#fileProj").onchange=ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{ const j=JSON.parse(fr.result); P=normalize(j); selId=null; renderPanel(); render(); toast("Project opened."); }catch(e){ toast("That file is not a valid project."); } };
  fr.readAsText(f);
};
function toast(msg){ const o=document.querySelector(".toast"); if(o)o.remove(); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function openHelp(){
  const veil=document.createElement("div"); veil.className="veil";
  veil.innerHTML='<div class="modal" style="width:600px"><div class="modal-h"><h3>How it works</h3></div>'+
    '<div class="modal-b" style="line-height:1.6">'+
    '<p><b>Place focuses.</b> Click <b>＋ Focus</b>, then drag nodes on the grid. The grid is the same x / y the game uses.</p>'+
    '<p><b>Link them.</b> <b>↳ Prerequisite</b>: click the parent, then the child. <b>⇄ Exclusive</b>: click two focuses that should exclude each other. Toggle the button again (or press <kbd>Esc</kbd>) to stop.</p>'+
    '<p><b>Dates.</b> Set a start date and days-per-cost up top. Each node shows how long it takes and — following its prerequisite chain — the date it would finish.</p>'+
    '<p><b>Effects &amp; modifiers.</b> In a focus, use <b>＋ Effect</b> to search the effect library for the completion reward. Build a national spirit under <b>◆ Spirits</b> from a searchable modifier list, then grant it with <b>◆ Grant spirit</b>.</p>'+
    '<p><b>Icons.</b> Pick from '+ICONS.length+' vanilla icons or <b>Import image…</b> — imports are resized to 95×95, converted to .dds, and given a matching shine automatically.</p>'+
    '<p><b>Export.</b> <b>Export ZIP</b> writes a ready-to-drop mod: the focus file, localisation, the two .gfx files, .dds icons, spirits, and a README. Everything saves in your browser automatically; use <b>Save</b> / <b>Open</b> for a portable project file.</p>'+
    '</div><div class="modal-f"><button class="btn primary" id="hlClose">Got it</button></div></div>';
  document.body.appendChild(veil);
  veil.onclick=e=>{ if(e.target===veil) veil.remove(); };
  $("#hlClose").onclick=()=>veil.remove();
}

/* =====================================================================
   15. Wire up + init
   ===================================================================== */
function addFocusAt(){
  // find a free-ish cell near top
  const taken={}; P.focuses.forEach(f=>taken[f.x+","+f.y]=1);
  let x=0,y=0; outer: for(y=0;y<40;y++){ for(x=0;x<20;x++){ if(!taken[x+","+y]){ break outer; } } }
  const f=newFocus(x,y); f.reward="add_political_power = 100";
  P.focuses.push(f); select(f.id); activeTab="basic"; renderPanel(); render();
  const el=$("#tabBasic #fName"); if(el) el.focus();
}
function delFocus(id){
  P.focuses=P.focuses.filter(f=>f.id!==id);
  P.focuses.forEach(f=>{ f.prereq=(f.prereq||[]).filter(p=>p!==id); f.mutex=(f.mutex||[]).filter(m=>m!==id); if(f.relTo===id) f.relTo=""; });
  if(selId===id) selId=null;
  renderPanel(); render();
}
function dupFocus(id){
  const src=byId(id); if(!src) return;
  const c=JSON.parse(JSON.stringify(src)); c.id=uid(); c.x=src.x+1; c.y=src.y; c.prereq=[]; c.mutex=[]; c.keyEdited=false; c.key=""; c.name=src.name?src.name+" copy":"";
  P.focuses.push(c); select(c.id);
}

$("#bAdd").onclick=addFocusAt;
$("#bPre").onclick=()=>setLinkMode("pre");
$("#bMx").onclick=()=>setLinkMode("mx");
$("#bIdeas").onclick=openIdeas;
$("#bExport").onclick=()=>exportAll(false);
$("#bSave").onclick=saveProject;
$("#bOpen").onclick=()=>$("#fileProj").click();
$("#bHelp").onclick=openHelp;
$("#pDel").onclick=()=>{ if(selId) delFocus(selId); };
$("#pDup").onclick=()=>{ if(selId) dupFocus(selId); };
$$(".tab").forEach(t=> t.onclick=()=>{ activeTab=t.dataset.tab; renderPanel(); });

$("#mMod").oninput=e=>{ P.meta.mod=e.target.value; persist(); };
$("#mTag").oninput=e=>{ P.meta.tag=e.target.value; if(selId){ const kf=$("#fKey"); const f=byId(selId); if(f&&!f.keyEdited&&kf){ kf.value=focusKey(f); $("#pKeyEcho").textContent=f.key; } } render(); };
$("#mStart").oninput=e=>{ P.meta.start=e.target.value; if(selId)refreshDerived(byId(selId)); render(); };
$("#mDpc").oninput=e=>{ P.meta.dpc=clampInt(e.target.value,1,60,7); if(selId)refreshDerived(byId(selId)); render(); };
$("#mDpc").onchange=e=>{ e.target.value=P.meta.dpc; };

$("#zIn").onclick=()=>{ view.z=Math.min(1.6, view.z+0.1); render(); updZoom(); };
$("#zOut").onclick=()=>{ view.z=Math.max(0.4, view.z-0.1); render(); updZoom(); };
$("#zFit").onclick=()=>{ view.z=1; render(); updZoom(); };
function updZoom(){ $("#zLbl").textContent=Math.round(view.z*100)+"%"; }

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(linkMode){ setLinkMode(linkMode); } closePicker(); }
  if((e.key==="Delete"||e.key==="Backspace") && selId){
    const t=e.target.tagName; if(t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable) return;
    e.preventDefault(); delFocus(selId);
  }
});

/* boot */
(function init(){
  const had=loadSaved();
  if(!had){
    // seed a tiny example so the canvas isn't intimidatingly blank
    const a=newFocus(2,0); a.name="Rebuild the Nation"; a.icon="GFX_goal_generic_construct_civ_factory"; a.cost=5; a.reward="add_political_power = 100\nadd_stability = 0.05";
    const b=newFocus(2,1); b.name="Industrial Effort"; b.icon="GFX_goal_generic_production"; b.cost=7; b.prereq=[a.id]; b.reward="add_tech_bonus = {\n\tname = industry_bonus\n\tbonus = 0.5\n\tuses = 1\n\tcategory = industry\n}";
    P.focuses=[a,b];
  }
  syncTopbar(); updZoom(); render(); renderPanel();
})();
</script>
