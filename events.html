    '<button class="issue '+i.level+'" data-ev="'+(i.evId||"")+'" data-opt="'+(i.optId||"")+'">'
    + '<span class="lv">'+(i.level==="error"?"Problem":i.level==="warn"?"Warning":"Note")+'</span>'

      }).join("")

    + '<div class="modal-b" style="padding:12px">'+body+'</div>'
    + '<div class="modal-f">'
    + '<button class="btn" id="iClose">Close</button>'
    + (onward ? '<button class="btn '+(c.error?"":"primary")+'" id="iGo">'+(c.error?"Export anyway":"Export")+'</button>' : '')
    + '</div></div>';
  document.body.appendChild(veil);
  veil.onclick = ev=>{ if(ev.target===veil) veil.remove(); };
  veil.querySelector("#iClose").onclick = ()=>veil.remove();
  const go = veil.querySelector("#iGo");
  if(go) go.onclick = ()=>{ veil.remove(); onward(); };
  veil.querySelectorAll(".issue").forEach(b=>{
    b.onclick = ()=>{
      if(!b.dataset.ev) return;
      selId = b.dataset.ev;
      if(b.dataset.opt) openOpts[b.dataset.opt] = true;
      veil.remove(); renderList(); renderMain();
    };
  });
}

/* =====================================================================
   11. ZIP writer — stored entries, no dependencies
   ===================================================================== */
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function utf8(s){ return new TextEncoder().encode(s); }

function makeZip(files){          // files: [{path, data:Uint8Array}]
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()/2)) & 0xFFFF;
  const dosDate = (((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate()) & 0xFFFF;

  files.forEach(f=>{
    const name = utf8(f.path);
    const crc = crc32(f.data);
    const lh = new Uint8Array(30 + name.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);      // UTF-8 names
    dv.setUint16(8, 0, true);           // stored
    dv.setUint16(10, dosTime, true);
    dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, f.data.length, true);
    dv.setUint32(22, f.data.length, true);
    dv.setUint16(26, name.length, true);
    dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, f.data);

    const ch = new Uint8Array(46 + name.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, f.data.length, true);
    cv.setUint32(24, f.data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);

    offset += lh.length + f.data.length;
  });

  let cSize = 0;
  central.forEach(c=>cSize += c.length);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cSize, true);
  ev.setUint32(16, offset, true);

  const all = parts.concat(central, [end]);
  let total = 0; all.forEach(a=>total += a.length);
  const out = new Uint8Array(total);
  let p = 0; all.forEach(a=>{ out.set(a, p); p += a.length; });
  return out;
}

function download(name, data, type){
  const blob = new Blob([data], {type: type || "application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

async function exportAll(skipCheck){
  if(!P.events.length){ toast("Add an event first."); return; }
  if(!skipCheck){
    const issues = validate();
    if(issues.some(i=>i.level!=="info")){ showIssues(issues, ()=>exportAll(true)); return; }
  }
  assignNumbers();
  const ns = nsClean();
  const files = [];
  const useFile = P.settings.driverMode === "file";

  files.push({ path:"events/"+ns+".txt", data: utf8(buildEventsFile()) });
  files.push({ path:"localisation/english/"+ns+"_l_english.yml", data: utf8(buildLocFile()) });

  const gfx = buildGfxFile();
  if(gfx) files.push({ path:"interface/"+ns+"_events.gfx", data: utf8(gfx) });

  const dyn = buildDynModFile();
  if(dyn) files.push({ path:"common/dynamic_modifiers/"+ns+"_dynamic_modifiers.txt", data: utf8(dyn) });

  const oa = buildOnActions();
  if(oa && useFile) files.push({ path:"common/on_actions/"+ns+"_on_actions.txt", data: utf8(oa) });

  for(const e of P.events){
    if(!e.pic) continue;
    try {
      const dds = await ddsFromDataURL(e.pic.url, e.pic.w, e.pic.h);
      files.push({ path:"gfx/event_pictures/"+e.pic.name+".dds", data: dds });
    } catch(err){ /* skip a broken picture rather than losing the export */ }
  }

  files.push({ path:"README.txt", data: utf8(buildReadme(!!(oa && useFile))) });

  download(ns+"_events.zip", makeZip(files), "application/zip");
  toast("Exported " + files.length + " files");
}

}

    +     '<strong style="display:inline">Its own on_actions file</strong>'
    +     '<small>Writes <span class="mono">common/on_actions/&lt;namespace&gt;_on_actions.txt</span>. Mod-unique filename, so it will not overwrite a vanilla one.</small></label>'
    +   '<label class="opt-radio'+(s.driverMode==="snippet"?" on":"")+'"><input type="radio" name="dm" value="snippet"'+(s.driverMode==="snippet"?" checked":"")+'>'
    +     '<strong style="display:inline">Snippet in the README</strong>'
    +     '<small>No on_actions file is written. The blocks go in README.txt for you to merge into a file you already have.</small></label>'
    + '</div>'
    + '<div class="field"><label>Country event picture</label><div class="row">'
    +   '<input type="number" id="sCW" value="'+s.countryW+'" min="1"><input type="number" id="sCH" value="'+s.countryH+'" min="1"></div>'
    +   '<div class="hint">Width &times; height. Your mod uses 210 &times; 176.</div></div>'
    + '<div class="field"><label>News event picture</label><div class="row">'
    +   '<input type="number" id="sNW" value="'+s.newsW+'" min="1"><input type="number" id="sNH" value="'+s.newsH+'" min="1"></div>'
    +   '<div class="hint">Width &times; height. 397 &times; 153 is the vanilla news size.</div></div>'
    + '<div class="row">'
    +   '<div class="field" style="margin:0"><label>Default country tag</label>'
    +     '<input type="text" id="sTag" class="mono" value="'+esc(s.defaultTag||"USA")+'" maxlength="3" style="text-transform:uppercase"></div>'
    +   '<div class="field" style="margin:0;flex:1.4"><label>Campaign start date</label>'
    +     '<input type="text" id="sStart" class="mono" value="'+esc(s.startDate||"2025.1.1")+'" placeholder="2025.1.1"></div>'
    + '</div>'
    + '<div class="hint" style="margin:-4px 0 13px">The tag fills new precise events and the <span class="mono">original_tag</span> line of an approximate trigger &mdash; it holds through civil wars and tag changes where <span class="mono">tag</span> does not. The start date is your bookmark\'s date: precise events are scheduled as a delay counted from it, so it must match.</div>'
    + '<div class="field"><label>Event numbering</label><div class="row">'
    +   '<input type="number" id="sCB" value="'+s.countryBase+'" min="0"><input type="number" id="sNB" value="'+s.newsBase+'" min="0"></div>'
    +   '<div class="hint">First country number, then first news number. Keeping them apart stops the two lists colliding once you have more than a handful of each.</div></div>'
    + '</div><div class="modal-f">'
    + '<button class="btn" id="sCancel">Cancel</button><button class="btn primary" id="sOk">Save settings</button>'
    + '</div></div>';
  document.body.appendChild(veil);
  veil.onclick = ev=>{ if(ev.target===veil) veil.remove(); };
  veil.querySelectorAll('input[name=dm]').forEach(r=>{
    r.onchange = ()=>veil.querySelectorAll(".opt-radio").forEach(l=>l.classList.toggle("on", l.contains(r) && r.checked));
  });
  veil.querySelector("#sCancel").onclick = ()=>veil.remove();
  veil.querySelector("#sOk").onclick = ()=>{
    const num = (id,def)=>{ const v = parseInt(veil.querySelector(id).value,10); return (isFinite(v) && v>0) ? v : def; };
    s.driverMode = veil.querySelector('input[name=dm]:checked').value;
    s.countryW = num("#sCW",210); s.countryH = num("#sCH",176);
    s.newsW = num("#sNW",397);   s.newsH = num("#sNH",153);
    const cb = parseInt(veil.querySelector("#sCB").value,10);
    const nb = parseInt(veil.querySelector("#sNB").value,10);
    s.defaultTag = (veil.querySelector("#sTag").value||"").toUpperCase().slice(0,3);
    s.countryBase = isFinite(cb)&&cb>=0 ? cb : 1;
    s.newsBase = isFinite(nb)&&nb>=0 ? nb : 100;
    P.events.forEach(e=>{ if(e.pic) refitPic(e); });
    veil.remove(); touch(true); renderMain();
    toast("Settings saved");
  };
}

/* =====================================================================
   13. Boot
   ===================================================================== */
P = restore();
if(!P.events.length){ /* start empty; the empty state explains itself */ }
selId = P.events.length ? P.events[0].id : null;
if(selId) P.events[0].options.forEach(o=>openOpts[o.id]=true);

$("#ns").value = P.ns;
$("#ns").oninput = ev=>{ P.ns = ev.target.value; touch(true); updatePreviewSafe(); };
function updatePreviewSafe(){ const e = P.events.find(x=>x.id===selId); if(e) updatePreview(e); }

$("#btnAddC").onclick = ()=>addEvent("country");
$("#btnAddN").onclick = ()=>addEvent("news");
$("#btnSettings").onclick = openSettings;
$("#btnCheck").onclick = ()=>showIssues(validate(), null);
$("#btnExport").onclick = exportAll;

$("#btnSave").onclick = ()=>{
  download(nsClean()+"_project.json", JSON.stringify(P,null,2), "application/json");
};
$("#btnImport").onclick = ()=>$("#fileProj").click();
$("#fileProj").onchange = ev=>{
  const f = ev.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try {
      const p = JSON.parse(fr.result);
      if(!p || !Array.isArray(p.events)) throw new Error("not a project file");
      p.settings = Object.assign({}, DEF_SETTINGS, p.settings||{});
      p.events.forEach(e=>{
        e.timing = Object.assign({}, TIMING_DEFAULTS, e.timing||{});
        e.options = (e.options||[]).map(o=>Object.assign(newOption(), o));
      });
      P = p; selId = P.events.length ? P.events[0].id : null;
      openOpts = {};
      $("#ns").value = P.ns || "my_events";
      touch(true); renderMain();
      toast("Opened " + (P.events.length) + " events");
    } catch(err){ toast("That file is not a project export."); }
  };
  fr.readAsText(f);
  ev.target.value = "";
};

document.addEventListener("keydown", ev=>{
  if(!(ev.metaKey || ev.ctrlKey)) return;
  const k = String(ev.key||"").toLowerCase();
  if(k === "s"){ ev.preventDefault(); $("#btnSave").click(); }
  else if(k === "z" && !ev.shiftKey){ ev.preventDefault(); undo(); }
  else if((k === "z" && ev.shiftKey) || k === "y"){ ev.preventDefault(); redo(); }
});

renderList();
renderMain();
refreshCheckBadge();
HIST.cur = snap();
</script>
</body>
</html>
