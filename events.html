<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Maker — The American Dream</title>
<meta name="description" content="Write Hearts of Iron IV country and news events, then export them as ready-to-drop mod files: events, localisation, on_actions and DDS pictures.">
<style>
:root{
  --paper:#F5F6F2; --card:#FFFFFF; --sunk:#EFF1EC;
  --ink:#14171A; --ink2:#5A6169; --ink3:#8A9199;
  --line:#DEE1DA; --line2:#C9CDC3;
  --country:#1F3A5F; --news:#A33A2A; --ok:#3E6B4A; --warn:#8A6A18;
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--country); outline-offset:2px}

/* ---------- structure ---------- */
.app{display:flex; flex-direction:column; height:100vh; overflow:hidden}
.topbar{
  display:flex; align-items:center; gap:14px; padding:0 16px; height:52px;
  background:var(--card); border-bottom:1px solid var(--line); flex:none;
}
.brand{font-weight:700; letter-spacing:-.01em; font-size:15px; white-space:nowrap}
.brand span{color:var(--ink3); font-weight:500}
.back{
  display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink3); border:1px solid var(--line); border-radius:var(--r);
  padding:5px 10px; white-space:nowrap;
}
.back:hover{color:var(--country); border-color:#a9bed6; background:var(--sunk)}
@media (max-width:760px){ .back span{display:none} }
.ns-wrap{display:flex; align-items:center; gap:7px; margin-left:6px}
.ns-wrap label{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); font-weight:600}
.ns-input{
  font-family:var(--font-mono); font-size:12.5px; padding:5px 8px; width:190px;
  border:1px solid var(--line2); border-radius:var(--r); background:var(--sunk);
}
.spacer{flex:1}
.btn{
  border:1px solid var(--line2); background:var(--card); border-radius:var(--r);
  padding:6px 11px; font-size:13px; font-weight:500; white-space:nowrap;
}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--country); border-color:var(--country); color:#fff}
.btn.primary:hover{background:#162943}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk); color:var(--ink)}
.btn.sm{padding:3px 8px; font-size:12px}
.btn.danger:hover{background:#fbeceb; border-color:#e2b6b0; color:var(--news)}

.body{display:flex; flex:1; min-height:0}

/* ---------- sidebar ---------- */
.side{
  width:246px; flex:none; background:var(--card); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
.side-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 12px 9px; border-bottom:1px solid var(--line);
}
.side-head h2{margin:0; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); font-weight:700}
.side-list{overflow-y:auto; padding:7px; flex:1}
.ev-item{
  display:flex; align-items:flex-start; gap:8px; width:100%; text-align:left;
  padding:8px 9px; border-radius:var(--r); border:1px solid transparent; background:none;
  margin-bottom:2px;
}
.ev-item:hover{background:var(--sunk)}
.ev-item.sel{background:var(--sunk); border-color:var(--line2)}
.ev-dot{width:3px; align-self:stretch; border-radius:2px; flex:none; background:var(--country)}
.ev-item[data-t="news"] .ev-dot{background:var(--news)}
.ev-main{min-width:0; flex:1}
.ev-title{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ev-title.empty{color:var(--ink3); font-weight:400; font-style:italic}
.ev-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--ink3); margin-top:1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.side-foot{padding:9px 12px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink3)}

/* ---------- main ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden}
.tabs{display:flex; gap:0; padding:0 20px; background:var(--card); border-bottom:1px solid var(--line); flex:none}
.tab{
  border:1px solid var(--line); border-bottom:none; background:var(--sunk);
  padding:9px 26px; margin:9px 5px -1px 0; border-radius:var(--r) var(--r) 0 0;
  font-size:13px; font-weight:600; color:var(--ink2); position:relative;
}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card); color:var(--ink); border-color:var(--line)}
.tab.on::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--card)}
.tab.on[data-t="country"]{box-shadow:inset 0 3px 0 var(--country)}
.tab.on[data-t="news"]{box-shadow:inset 0 3px 0 var(--news)}

.scroll{overflow-y:auto; flex:1; padding:20px 20px 80px}
.cols{display:grid; grid-template-columns:minmax(0,1fr) 336px; gap:20px; align-items:start; max-width:1240px}
@media (max-width:1080px){ .cols{grid-template-columns:minmax(0,1fr)} }

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin-bottom:16px}
.card-h{
  display:flex; align-items:center; gap:9px; padding:10px 14px; border-bottom:1px solid var(--line);
}
.card-h h3{margin:0; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); font-weight:700}
.card-b{padding:14px}

.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field > label{display:block; font-size:12px; font-weight:600; color:var(--ink2); margin-bottom:5px}
.hint{font-size:11.5px; color:var(--ink3); margin-top:5px; line-height:1.4}
input[type=text],input[type=number],select,textarea{
  width:100%; border:1px solid var(--line2); border-radius:var(--r); background:var(--card);
  padding:7px 9px; font-size:13px;
}
input:focus,select:focus,textarea:focus{border-color:var(--country); outline:none;
  box-shadow:0 0 0 3px rgba(31,58,95,.09)}
textarea{resize:vertical; font-family:var(--font-mono); font-size:12.5px; line-height:1.55}
.mono{font-family:var(--font-mono)}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row > *{flex:1; min-width:120px}
.chk{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink2); cursor:pointer}
.chk input{width:auto; margin:0}

/* title/desc splitter */
.split-note{
  display:flex; gap:8px; align-items:baseline; font-size:11.5px; margin-top:6px;
  padding:7px 9px; background:var(--sunk); border-radius:var(--r); border:1px solid var(--line);
}
.split-note b{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3)}
.split-note span{font-family:var(--font-mono); color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.split-note span.none{color:var(--ink3); font-style:italic; font-family:var(--font-ui)}

/* image */
.drop{
  border:1.5px dashed var(--line2); border-radius:var(--r); background:var(--sunk);
  padding:18px; text-align:center; color:var(--ink2); font-size:12.5px; cursor:pointer;
}
.drop:hover,.drop.over{border-color:var(--country); background:#eef2f7; color:var(--country)}
.pic-row{display:flex; gap:12px; align-items:flex-start}
.pic-prev{border:1px solid var(--line2); border-radius:3px; background:var(--sunk); flex:none; display:block}
.pic-info{font-size:12px; color:var(--ink2); min-width:0; flex:1}
.pic-info .name{font-family:var(--font-mono); font-size:12px; word-break:break-all; color:var(--ink)}
.tag{
  display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:2px 6px; border-radius:3px; margin:5px 5px 0 0;
}
.tag.ok{background:#e7f0e9; color:var(--ok)}
.tag.fix{background:#fbf3e0; color:var(--warn)}

/* options */
.opt{border:1px solid var(--line2); border-radius:var(--r); margin-bottom:9px; overflow:hidden; background:var(--card)}
.opt-bar{
  display:flex; align-items:center; gap:10px; width:100%; background:none; border:none;
  padding:10px 12px; text-align:left;
}
.opt-bar:hover{background:var(--sunk)}
.tri{flex:none; width:11px; height:11px; transition:transform .16s ease; color:var(--ink2)}
.opt.open .tri{transform:rotate(90deg)}
.opt-key{font-family:var(--font-mono); font-size:11.5px; color:var(--ink3); flex:none}
.opt-name{flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.opt-name.empty{color:var(--ink3); font-style:italic}
.opt-flags{display:flex; gap:4px; flex:none}
.pip{font-size:9.5px; font-weight:700; letter-spacing:.05em; padding:2px 5px; border-radius:3px;
  background:var(--sunk); color:var(--ink3); border:1px solid var(--line)}
.pip.on{background:#eef2f7; color:var(--country); border-color:#c6d3e2}
.opt-body{display:none; padding:0 12px 13px; border-top:1px solid var(--line)}
.opt.open .opt-body{display:block}
.opt-body .field:first-child{margin-top:13px}

.varbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:7px}
.varbtn{border:1px solid var(--line2); background:var(--card); border-radius:var(--r);
  padding:4px 9px; font-size:12px; font-weight:600; color:var(--ink2); display:flex; align-items:center; gap:5px}
.varbtn:hover{background:var(--sunk)}
.varbtn.on{background:#eef2f7; border-color:#a9bed6; color:var(--country)}
.varbtn.on[data-v="chaos"]{background:#fbeceb; border-color:#e2b6b0; color:var(--news)}
.varbtn .tick{width:11px; height:11px; flex:none; opacity:.35}
.varbtn.on .tick{opacity:1}
.varnum{width:62px; padding:4px 6px; font-size:12px; font-family:var(--font-mono)}
.varnum[disabled]{opacity:.4; background:var(--sunk)}
.chip{border:1px solid var(--line2); background:var(--card); border-radius:var(--r);
  padding:3px 8px; font-size:11.5px; font-family:var(--font-mono); color:var(--ink2)}
.chip:hover{background:var(--sunk); color:var(--ink)}

.eff-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; gap:8px}
.eff-head label{margin:0}
.eff-tools{display:flex; gap:5px}

/* picker */
.pick-wrap{position:relative}
.pick{
  position:absolute; z-index:40; top:calc(100% + 5px); right:0; width:390px; max-width:88vw;
  background:var(--card); border:1px solid var(--line2); border-radius:var(--r);
  box-shadow:0 10px 30px rgba(20,23,26,.14); overflow:hidden;
}
.pick-top{display:flex; gap:0; border-bottom:1px solid var(--line)}
.pick-tab{flex:1; border:none; background:var(--sunk); padding:8px; font-size:12px; font-weight:600; color:var(--ink2)}
.pick-tab.on{background:var(--card); color:var(--ink); box-shadow:inset 0 -2px 0 var(--country)}
.pick-search{padding:9px 10px; border-bottom:1px solid var(--line)}
.pick-search input{font-family:var(--font-mono); font-size:12.5px}
.pick-list{max-height:280px; overflow-y:auto}
.pick-grp{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); font-weight:700;
  padding:8px 12px 3px; background:var(--card); position:sticky; top:0}
.pick-it{display:block; width:100%; text-align:left; border:none; background:none; padding:6px 12px}
.pick-it:hover,.pick-it.cur{background:var(--sunk)}
.pick-it .k{font-family:var(--font-mono); font-size:12px; color:var(--ink)}
.pick-it .d{font-size:11px; color:var(--ink3); line-height:1.35}
.pick-empty{padding:18px 12px; text-align:center; color:var(--ink3); font-size:12.5px}
.pick-foot{padding:8px 10px; border-top:1px solid var(--line); background:var(--sunk); font-size:11px; color:var(--ink3)}

/* modifier basket */
.mod-basket{padding:9px 10px; border-top:1px solid var(--line); background:var(--sunk)}
.mod-chip{display:inline-flex; align-items:center; gap:5px; background:var(--card); border:1px solid var(--line2);
  border-radius:3px; padding:2px 4px 2px 7px; margin:0 4px 4px 0; font-family:var(--font-mono); font-size:11px}
.mod-chip input{width:56px; padding:1px 4px; font-size:11px; border-radius:2px}
.mod-chip button{border:none; background:none; color:var(--ink3); padding:0 3px; font-size:14px; line-height:1}
.mod-chip button:hover{color:var(--news)}

/* preview */
.prev-card{position:sticky; top:0}
.prev-win{background:var(--sunk); border:1px solid var(--line2); border-radius:3px; padding:12px}
.prev-pic{
  width:100%; border:1px solid var(--line2); background:#e2e5de; display:block; border-radius:2px;
  object-fit:cover;
}
.prev-pic-ph{display:flex; align-items:center; justify-content:center; color:var(--ink3); font-size:11.5px}
.prev-title{font-size:14.5px; font-weight:700; margin:11px 0 6px; line-height:1.3}
.prev-desc{font-size:12.5px; color:var(--ink2); white-space:pre-wrap; line-height:1.5; max-height:220px; overflow-y:auto}
.prev-tt{font-size:12px; color:var(--country); border-left:2px solid var(--country); padding-left:8px; margin-top:9px}
.prev-opts{margin-top:12px; display:flex; flex-direction:column; gap:5px}
.prev-opt{background:var(--card); border:1px solid var(--line2); border-radius:3px; padding:6px 9px; font-size:12.5px}
.prev-opt.empty{color:var(--ink3); font-style:italic}
.prev-meta{margin-top:11px; padding-top:10px; border-top:1px solid var(--line);
  font-family:var(--font-mono); font-size:11px; color:var(--ink3); line-height:1.7}
.prev-meta b{color:var(--ink2); font-weight:600}

/* empty state */
.empty-state{max-width:420px; margin:70px auto; text-align:center; color:var(--ink2)}
.empty-state h2{font-size:17px; margin:0 0 8px; color:var(--ink)}
.empty-state p{font-size:13px; margin:0 0 18px; line-height:1.55}

/* modal */
.veil{position:fixed; inset:0; background:rgba(20,23,26,.4); display:flex; align-items:center;
  justify-content:center; z-index:100; padding:20px}
.modal{background:var(--card); border-radius:8px; width:520px; max-width:100%; max-height:86vh;
  overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-h{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center}
.modal-h h3{margin:0; font-size:14px}
.modal-b{padding:18px}
.modal-f{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}
.opt-radio{display:block; border:1px solid var(--line2); border-radius:var(--r); padding:11px 13px; margin-bottom:9px; cursor:pointer}
.opt-radio:hover{background:var(--sunk)}
.opt-radio.on{border-color:var(--country); background:#f2f6fa}
.opt-radio strong{display:block; font-size:13px; margin-bottom:3px}
.opt-radio small{color:var(--ink2); font-size:11.5px; line-height:1.45; display:block}
.opt-radio input{width:auto; margin-right:7px}

.btn.check{border-color:#c3d6c8; background:#f0f6f1; color:var(--ok); font-weight:600}
.btn.check:hover{background:#e5efe7}
.btn.check.has-warn{border-color:#e3d3a6; background:#fbf6e8; color:var(--warn)}
.btn.check.has-warn:hover{background:#f6efdb}
.btn.check.has-err{border-color:#e2b6b0; background:#fbeceb; color:var(--news)}
.btn.check.has-err:hover{background:#f7e0dd}

.igrp{margin-bottom:4px}
.issue{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
  border:1px solid var(--line); border-radius:var(--r); background:var(--card);
  padding:9px 11px; margin-bottom:6px}
.issue:hover{background:var(--sunk)}
.issue .lv{flex:none; font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  padding:3px 6px; border-radius:3px; margin-top:1px; min-width:56px; text-align:center}
.issue.error{border-color:#e8cbc6}
.issue.error .lv{background:#fbeceb; color:var(--news)}
.issue.warn .lv{background:#fbf6e8; color:var(--warn)}
.issue.info .lv{background:var(--sunk); color:var(--ink3)}
.issue .ms{font-size:12.5px; line-height:1.45; color:var(--ink)}
.issue.info .ms{color:var(--ink2)}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:9px 16px; border-radius:var(--r); font-size:13px;
  z-index:200; box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <a class="back" href="index.html" title="Back to the mod roadmap">&larr;<span>Roadmap</span></a>
    <div class="brand">Event Maker <span>&middot; The American Dream</span></div>
    <div class="ns-wrap">
      <label for="ns">Namespace</label>
      <input id="ns" class="ns-input mono" type="text" spellcheck="false" placeholder="my_events">
    </div>
    <div class="spacer"></div>
    <button class="btn check" id="btnCheck">Checks pass</button>
    <button class="btn ghost" id="btnSettings">Settings</button>
    <button class="btn ghost" id="btnImport">Open project</button>
    <button class="btn" id="btnSave">Save project</button>
    <button class="btn primary" id="btnExport">Export mod files</button>
  </div>

  <div class="body">
    <aside class="side">
      <div class="side-head">
        <h2>Events</h2>
        <div style="display:flex;gap:4px">
          <button class="btn sm" id="btnAddC">+ Country</button>
          <button class="btn sm" id="btnAddN">+ News</button>
        </div>
      </div>
      <div class="side-list" id="list"></div>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <main class="main" id="main"></main>
  </div>
</div>

<input type="file" id="fileImg" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="fileProj" accept="application/json,.json" hidden>

<script>
"use strict";

/* =====================================================================
   0. Safe storage — localStorage where available, memory otherwise.
      (Sandboxed previews block localStorage; saving the file to disk
      and opening it locally gives real persistence.)
   ===================================================================== */
const store = (()=>{
  let mem = {}, live = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); live = true; } catch(e){ live = false; }
  return {
    live,
    get(k){ try { return live ? localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch(e){ return k in mem ? mem[k] : null; } },
    set(k,v){ try { if(live) localStorage.setItem(k,v); else mem[k]=v; return true; } catch(e){ mem[k]=v; return false; } }
  };
})();

const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const $  = s => document.querySelector(s);

/* =====================================================================
   1. Effect library — curated, grouped. Snippets use tab indentation
      because that is what the game files use.
   ===================================================================== */
const EFFECTS = [
["Political power / stability", [
  ["add_political_power","add_political_power = 50","Adds political power."],
  ["set_political_power","set_political_power = 100","Sets political power outright."],
  ["add_stability","add_stability = 0.05","Adds stability. Range is 0 to 1, so 0.05 is five points."],
  ["set_stability","set_stability = 0.5","Sets stability outright."],
  ["add_war_support","add_war_support = 0.05","Adds war support. Range is 0 to 1."],
  ["set_war_support","set_war_support = 0.5","Sets war support outright."],
  ["add_command_power","add_command_power = 25","Adds command power."],
  ["add_manpower","add_manpower = 10000","Adds manpower to the pool."],
  ["add_stability + war support","add_stability = 0.03\nadd_war_support = -0.05","Common paired swing."],
]],
["Politics", [
  ["set_politics","set_politics = {\n\truling_party = neutrality\n\tlast_election = \"2024.11.4\"\n\telection_frequency = 48\n\telections_allowed = yes\n}","Changes the ruling party and election setup."],
  ["set_popularities","set_popularities = {\n\tdemocratic = 50\n\tneutrality = 15\n\tfascism = 30\n\tcommunism = 5\n}","Sets all party popularities. Must total 100 or it does nothing."],
  ["add_popularity","add_popularity = {\n\tideology = neutrality\n\tpopularity = 0.05\n}","Shifts one party's popularity. Values are 0 to 1."],
  ["set_party_name","set_party_name = {\n\tideology = neutrality\n\tlong_name = TAG_party_long\n\tname = TAG_party\n}","Renames a party."],
  ["hold_election","hold_election = ROOT","Runs the on_new_term_election on_action."],
  ["set_cosmetic_tag","set_cosmetic_tag = USA_second_republic","Swaps country name and flag."],
  ["drop_cosmetic_tag","drop_cosmetic_tag = yes","Reverts to the normal name and flag."],

let P = null;          // project

let openOpts = {};     // which option bars are expanded

function blankProject(){
  return { ns:"my_events", settings:Object.assign({},DEF_SETTINGS), events:[] };
}

/* ---- persistence ---- */
const KEY = "hoi4_event_maker_v1";
const KEY_SET = "hoi4_event_maker_settings_v1";

let quotaWarned = false;
function persist(){
  let ok = true;
  try { ok = store.set(KEY, JSON.stringify(P)); } catch(e){ ok = false; }
  try { store.set(KEY_SET, JSON.stringify(P.settings)); } catch(e){}
  if(!ok && !quotaWarned && store.live){
    quotaWarned = true;
    toast("Autosave stopped \u2014 browser storage is full. Use Save project to keep your work.");
  }
}
function restore(){
  const raw = store.get(KEY);
  if(raw){
    try {
      const p = JSON.parse(raw);
      if(p && Array.isArray(p.events)){
        p.settings = Object.assign({}, DEF_SETTINGS, p.settings||{});
        p.events.forEach(ev=>{
          ev.timing = Object.assign({}, TIMING_DEFAULTS, ev.timing||{});
          ev.options = (ev.options||[]).map(o=>Object.assign(newOption(), o));
        });
        return p;
      }
    } catch(e){}
  }
  const p = blankProject();
  const s = store.get(KEY_SET);
  if(s){ try { p.settings = Object.assign({}, DEF_SETTINGS, JSON.parse(s)); } catch(e){} }
  return p;
}

/* =====================================================================
   4. Derived values
   ===================================================================== */
function nsClean(){ return (P.ns||"my_events").trim().replace(/[^A-Za-z0-9_]/g,"_").toLowerCase() || "my_events"; }

function assignNumbers(){
  let c = P.settings.countryBase, n = P.settings.newsBase;
  const used = new Set();
  P.events.forEach(e=>{ if(e.num!=null) used.add(e.num); });
  P.events.forEach(e=>{
    if(e.num!=null){ e._num = e.num; return; }
    if(e.type==="country"){ while(used.has(c)) c++; e._num = c; used.add(c); c++; }
    else { while(used.has(n)) n++; e._num = n; used.add(n); n++; }
  });
}
function evKey(e){ return nsClean()+"."+e._num; }

function splitText(t){
  const s = String(t==null?"":t);
  const i = s.indexOf("\n");
  if(i === -1) return { title:s.trim(), desc:"" };
  return { title:s.slice(0,i).trim(), desc:s.slice(i+1).replace(/^\n+/,"") };
}

const OPT_LETTERS = "abcdefghijklmnopqrstuvwxyz";
function optSuffix(i){ return i < 26 ? OPT_LETTERS[i] : "opt"+(i+1); }

function picSize(type){
  const s = P.settings;
  return type==="news" ? {w:s.newsW,h:s.newsH} : {w:s.countryW,h:s.countryH};
}
function gfxName(e){
  const base = (e.pic && e.pic.name) ? e.pic.name : evKey(e).replace(/\./g,"_");
  return (e.type==="news" ? "GFX_news_event_" : "GFX_report_event_") + base;
}

      return '<button class="ev-item'+(e.id===selId?' sel':'')+'" data-t="'+e.type+'" data-id="'+e.id+'">'
        + '<span class="ev-dot"></span>'
        + '<span class="ev-main">'

        + '<span class="ev-meta">'+esc(evKey(e))+' &middot; '+(e.type==="news"?"news":"country")+'</span>'
        + '</span></button>';
    }).join("");
    list.querySelectorAll(".ev-item").forEach(b=>{
      b.onclick = ()=>{ selId = b.dataset.id; renderList(); renderMain(); };

  const c = P.events.filter(e=>e.type==="country").length;
  const n = P.events.length - c;
  $("#sideFoot").textContent = P.events.length
    ? (c+" country, "+n+" news")

}

        + '<textarea id="fTT" rows="2" placeholder="§RApproval is sliding back toward [?USA.usa_apr_target|0]%.§!">'+esc(e.ttText||"")+'</textarea>'
        + '<div class="hint">Gets its own key, <span class="mono">'+esc(key)+'.tt</span>, and is appended to the description as <span class="mono">['+esc(key)+'.tt]</span> &mdash; the same pattern as your approval events. Square brackets read variables; <span class="mono">§R</span>&hellip;<span class="mono">§!</span> colours text.</div>')
    )

  /* ---- picture ---- */
  + card("Picture",
      (e.pic ? picBlock(e, sz) :
        '<div class="drop" id="drop">Drop a PNG here, or click to choose one'
        + '<div style="margin-top:5px;font-size:11.5px;color:var(--ink3)">Target for '+(e.type==="news"?"news":"country")+' events: '+sz.w+'&times;'+sz.h+'. Anything else gets resized; an exact match is left untouched.</div></div>')
    )

  /* ---- timing ---- */
  + card("When it fires", timingBlock(e))

  /* ---- options ---- */
  + card("Options",
      '<div id="opts">'+e.options.map((o,i)=>optBlock(e,o,i)).join("")+'</div>'
      + '<button class="btn sm" id="btnAddOpt" style="margin-top:4px">+ Add option</button>'
      + '<div class="hint">An event with no options cannot be dismissed. Keep at least one unless the event is hidden.</div>'
    )

  /* ---- flags ---- */
  + card("Event flags",
      '<div class="row">'
      + '<label class="chk"><input type="checkbox" id="fOnce"'+(e.fireOnce?" checked":"")+'> Fire only once</label>'
      + (e.type==="news" ? '<label class="chk"><input type="checkbox" id="fMajor"'+(e.major?" checked":"")+'> Major (reaches every country)</label>' : '')
      + '<label class="chk"><input type="checkbox" id="fHidden"'+(e.hidden?" checked":"")+'> Hidden</label>'
      + '</div>'
      + (e.type==="news"
          ? '<div class="hint">Leave <b>Fire only once</b> off for a major news event. A news event reaching a second country counts as firing again, so the flag would pin it to one recipient.</div>'
          : '')
      + field2("Immediate block <span style='font-weight:400;color:var(--ink3)'>(optional)</span>",
          '<textarea id="fImm" rows="3" placeholder="set_country_flag = my_flag">'+esc(e.immediate||"")+'</textarea>'
          + '<div class="hint">Runs the moment the event fires, before the player picks an option.</div>')
    )

  + '</div>'

  /* ---- preview ---- */
  + '<div><div class="card prev-card"><div class="card-h"><h3>Preview</h3></div><div class="card-b">'
  + previewBlock(e, sp, sz, key)
  + '</div></div></div>'

  + '</div></div>';

  wireMain(e);
}

function card(title, inner){
  return '<div class="card"><div class="card-h"><h3>'+title+'</h3></div><div class="card-b">'+inner+'</div></div>';
}
function field(label, inner){ return '<div class="field"><label>'+label+'</label>'+inner+'</div>'; }
function field2(label, inner){ return '<div class="field" style="margin-top:13px"><label>'+label+'</label>'+inner+'</div>'; }

function picBlock(e, sz){
  const p = e.pic;
  const exact = (p.ow===sz.w && p.oh===sz.h);
  const scale = Math.min(1, 150/p.w);
  return '<div class="pic-row">'
    + '<img class="pic-prev" src="'+p.url+'" width="'+Math.round(p.w*scale)+'" height="'+Math.round(p.h*scale)+'" alt="">'
    + '<div class="pic-info">'
    +   '<div class="name">'+esc(p.name)+'.dds</div>'
    +   '<div style="margin-top:3px">Source '+p.ow+'&times;'+p.oh+' &rarr; exported at '+p.w+'&times;'+p.h+'</div>'
    +   (exact ? '<span class="tag ok">Exact size, untouched</span>' : '<span class="tag fix">Resized to fit</span>')
    +   '<div style="margin-top:9px;display:flex;gap:5px">'
    +     '<button class="btn sm" id="btnRepic">Replace</button>'
    +     '<button class="btn sm danger" id="btnUnpic">Remove</button>'
    +   '</div>'
    +   '<div class="hint" style="margin-top:9px">Sprite: <span class="mono">'+esc(gfxName(e))+'</span></div>'
    + '</div></div>';
}

function timingBlock(e){
  const t = e.timing;
  const r = (v,title,desc)=>
    '<label class="opt-radio'+(t.mode===v?" on":"")+'"><input type="radio" name="tmode" value="'+v+'"'+(t.mode===v?" checked":"")+'>'
    + '<strong style="display:inline">'+title+'</strong><small style="margin-top:4px">'+desc+'</small></label>';

  let extra = "";
  if(t.mode === "precise"){
    const d = startupDelay(t.date);
    const ok = dateValid(t.date);
    const dlabel = !ok ? "the date is not a real day" : (d==null ? "—" : (d<0 ? d + " days (before the start date)" : (d===0 ? "0 days (fires at game start)" : d + " days after " + (P.settings.startDate||"2025.1.1"))));
    extra = '<div class="row">'
      + '<div class="field" style="margin:0"><label>Country tag</label><input type="text" class="mono" id="tTag" value="'+esc(t.tag)+'" placeholder="USA" maxlength="3" style="text-transform:uppercase"></div>'
      + '<div class="field" style="margin:0;flex:1.4"><label>Date</label><input type="text" class="mono" id="tDate" value="'+esc(t.date)+'" placeholder="2025.1.20"></div>'
      + '</div>'
      + '<div class="hint">Scheduled once at game start with a delay of <b>'+esc(dlabel)+'</b>, so nothing is checked every day. Counted on the game\'s 365-day calendar &mdash; no leap day.</div>'
      + '<div class="field" style="margin-top:13px"><label>Extra conditions <span style=\'font-weight:400;color:var(--ink3)\'>(optional)</span></label>'
      + '<textarea id="tConds" rows="3" placeholder="NOT = { has_country_flag = coup_happened }">'+esc(t.conds||"")+'</textarea>'
      + '<div class="hint">Goes in the event\'s own <span class="mono">trigger = { }</span> and is checked when the delay elapses. If it fails on that day the event is skipped &mdash; it does not wait and retry. Leave empty for an unconditional date.</div></div>';
  } else if(t.mode === "approximate"){
    extra = '<div class="row"><div class="field" style="margin:0"><label>Land around</label>'
      + '<input type="text" class="mono" id="tADate" value="'+esc(t.date)+'" placeholder="2025.6.1"></div>'
      + '<div class="field" style="margin:0"><label>Mean time &mdash; days</label><input type="number" id="tDays" value="'+(t.mtthDays||0)+'" min="0"></div>'
      + '<div class="field" style="margin:0"><label>&hellip; or months</label><input type="number" id="tMonths" value="'+(t.mtthMonths||0)+'" min="0"></div>'
      + '</div>'
      + '<div class="field" style="margin-top:13px"><label>Trigger</label>'
      + '<textarea id="tTrig" rows="4" placeholder="tag = USA&#10;date &gt; 2025.6.1">'+esc(t.trigger)+'</textarea>'
      + '<div class="hint">The date line is kept in sync with the field above. Everything else in here is yours &mdash; add flags, wars, whatever gates it.</div></div>'
      + '<div class="hint">With a mean time of one day the event fires at the first check after the date passes. Triggers are only tested every 20 days, so it lands somewhere in the three weeks after '+esc(t.date||"the date")+' rather than on it. That twenty-day window is also why this costs the game almost nothing.</div>';
  } else {
    extra = '<div class="hint">The event gets <span class="mono">is_triggered_only = yes</span> and nothing else. Fire it yourself from another event, a decision, a focus, or an on_action.</div>';
  }

  return '<div id="tmodes">'
    + r("triggered","Triggered only","Nothing fires it automatically. You call it from somewhere else.")
    + r("precise","Precise date","Lands on the exact day. Scheduled once at game start, no daily checks.")
    + r("approximate","Approximate","Normal trigger plus mean_time_to_happen. Cheaper, but only checked every 20 days.")
    + '</div><div style="margin-top:13px">'+extra+'</div>';
}

/* =====================================================================
   Approval and Chaos shortcuts.

   aproval_rate and civil_war are rounded display variables that the
   monthly tick overwrites from usa_apr_real / usa_chaos_real, so an
   event must never write to them directly. These buttons emit the
   two documented helpers instead, and write the matching tooltip
   line, since neither helper produces a tooltip of its own.
   ===================================================================== */
const VAR_FX_LINE = /^\s*(set_temp_variable\s*=\s*\{\s*(apr|chaos)_delta\s*=\s*-?[\d.]+\s*\}|USA_(apr|chaos)_add\s*=\s*yes)\s*$/;
const VAR_TT_LINE = /^\s*\u00A7[GR](Approval|Chaos)\s[+-]?[\d.]+\u00A7!/;

function varLines(o){
  const fx = [], tt = [];
  const v = o.vars || {};
  if(v.aprOn){
    const n = Number(v.apr)||0;
    fx.push("set_temp_variable = { apr_delta = " + n + " }", "USA_apr_add = yes");
    tt.push((n>=0 ? "\u00A7GApproval +" : "\u00A7RApproval ") + n + "\u00A7! (now [?USA.aproval_rate|0]%)");
  }
  if(v.chaosOn){
    const n = Number(v.chaos)||0;
    fx.push("set_temp_variable = { chaos_delta = " + n + " }", "USA_chaos_add = yes");
    tt.push((n>=0 ? "\u00A7RChaos +" : "\u00A7GChaos ") + n + "\u00A7! (now [?USA.civil_war|0])");
  }
  return { fx, tt };
}

function joinBlock(head, rest){
  const tail = rest.filter((l,i,a)=> !(i===0 && !l.trim())).join("\n").replace(/^\n+/,"");
  if(!head.length) return tail.replace(/\s+$/,"");
  return (head.join("\n") + (tail.trim() ? "\n\n" + tail : "")).replace(/\s+$/,"");
}

function syncVars(o, box){
  const { fx, tt } = varLines(o);
  o.effects = joinBlock(fx, String(o.effects||"").split("\n").filter(l=>!VAR_FX_LINE.test(l)));
  o.ttText  = joinBlock(tt, String(o.ttText ||"").split("\n").filter(l=>!VAR_TT_LINE.test(l)));
  if(box){
    const fe = box.querySelector('[data-f="effects"]'); if(fe) fe.value = o.effects;
    const te = box.querySelector('[data-f="ttText"]');  if(te) te.value = o.ttText;
    refreshPips(box, o);
  }
  touch();
}

/* Update the "scheduled with a delay of N days" hint live as the date
   is typed, without a full re-render that would drop the text cursor. */
function refreshDelayHint(e){
  if(e.timing.mode !== "precise") return;
  const box = document.getElementById("tDate");
  if(!box) return;
  const hint = box.closest(".row") && box.closest(".row").nextElementSibling;
  if(!hint || !hint.classList.contains("hint")) return;
  const d = startupDelay(e.timing.date);
  const ok = dateValid(e.timing.date);
  const dlabel = !ok ? "the date is not a real day"
    : (d==null ? "\u2014" : (d<0 ? d + " days (before the start date)"
    : (d===0 ? "0 days (fires at game start)"
    : d + " days after " + (P.settings.startDate||"2025.1.1"))));
  hint.innerHTML = 'Scheduled once at game start with a delay of <b>'+esc(dlabel)+'</b>, so nothing is checked every day. Counted on the game\'s 365-day calendar &mdash; no leap day.';
}

/* The trigger box owns its own text; this only rewrites the date line,
   so anything else typed in there survives. */
function syncApxTrigger(e){
  const line = "date > " + prevDay(e.timing.date);
  let lines = String(e.timing.trigger||"").split("\n");
  let found = false;
  lines = lines.map(l=>{ if(/^\s*date\s*>/.test(l)){ found = true; return line; } return l; });
  if(!found){
    while(lines.length && !lines[lines.length-1].trim()) lines.pop();
    lines.push(line);
  }
  e.timing.trigger = lines.join("\n");
}

function optBlock(e, o, i){
  const key = evKey(e)+"."+optSuffix(i);
  const open = !!openOpts[o.id];
  const modCount = o.mods && o.mods.list && o.mods.list.length ? o.mods.list.length : 0;
  return '<div class="opt'+(open?" open":"")+'" data-oid="'+o.id+'">'
    + '<button class="opt-bar" data-act="toggle">'
    +   '<svg class="tri" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 L7 5 L3 8.5"/></svg>'
    +   '<span class="opt-key">.'+optSuffix(i)+'</span>'
    +   '<span class="opt-name'+(o.name?"":" empty")+'">'+esc(o.name||"Untitled option")+'</span>'
    +   '<span class="opt-flags">'
    +     (o.trigger.trim() ? '<span class="pip on">TRIG</span>' : '')
    +     (o.effects.trim() ? '<span class="pip on">FX</span>' : '')
    +     (o.ttText && o.ttText.trim() ? '<span class="pip on">TT</span>' : '')
    +     (modCount ? '<span class="pip on">MOD '+modCount+'</span>' : '')
    +   '</span>'
    + '</button>'
    + '<div class="opt-body">'
    +   field("Option text",'<input type="text" data-f="name" value="'+esc(o.name)+'" placeholder="A new administration takes the reins."><div class="hint">Key: <span class="mono">'+esc(key)+'</span></div>')
    +   field("Trigger <span style=\'font-weight:400;color:var(--ink3)\'>(optional)</span>",'<textarea data-f="trigger" rows="2" placeholder="tag = USA">'+esc(o.trigger)+'</textarea><div class="hint">Hides the option unless these conditions pass.</div>')
    +   '<div class="field">'
    +     '<div class="eff-head"><label>Effects</label><div class="eff-tools pick-wrap">'
    +       '<button class="btn sm" data-act="pick" data-oid="'+o.id+'">Insert&hellip;</button>'
    +     '</div></div>'
    +     '<textarea data-f="effects" rows="7" placeholder="add_political_power = 50&#10;set_country_flag = my_flag">'+esc(o.effects)+'</textarea>'
    +   '</div>'
    +   field("Custom tooltip <span style=\'font-weight:400;color:var(--ink3)\'>(optional)</span>",
            varBar(o)
            + '<textarea data-f="ttText" rows="2" placeholder="Approval will drift toward [?USA.usa_apr_target|0]% over the next month.">'+esc(o.ttText||"")+'</textarea>'
            + '<div class="hint">Adds <span class="mono">custom_effect_tooltip = '+esc(key)+'_tt</span> to the top of the effect block and writes the localisation line for you. Use it to spell out anything the game cannot describe on its own &mdash; variables, flags, delayed events.<br>The two buttons write the matching <span class="mono">USA_apr_add</span> / <span class="mono">USA_chaos_add</span> call into the effects above and a coloured line into the tooltip. Turning one off removes both again.</div>')
    +   '<div style="display:flex;justify-content:flex-end;gap:5px;margin-top:11px">'
    +     '<button class="btn sm" data-act="up">Move up</button>'
    +     '<button class="btn sm danger" data-act="rm">Remove option</button>'
    +   '</div>'
    + '</div></div>';
}

function varBar(o){
  const v = o.vars || { aprOn:false, apr:5, chaosOn:false, chaos:5 };
  const tick = '<svg class="tick" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 L4.8 9.2 L10 3.5"/></svg>';
  return '<div class="varbar">'
    + '<button type="button" class="varbtn'+(v.aprOn?" on":"")+'" data-v="apr">'+tick+'Approval</button>'
    + '<input class="varnum" type="number" data-vn="apr" value="'+(v.apr)+'" step="1"'+(v.aprOn?"":" disabled")+'>'
    + '<button type="button" class="varbtn'+(v.chaosOn?" on":"")+'" data-v="chaos">'+tick+'Chaos</button>'
    + '<input class="varnum" type="number" data-vn="chaos" value="'+(v.chaos)+'" step="1"'+(v.chaosOn?"":" disabled")+'>'
    + '</div>';
}

function previewBlock(e, sp, sz, key){
  let pic;
  if(e.pic){
    pic = '<img class="prev-pic" src="'+e.pic.url+'" style="aspect-ratio:'+sz.w+'/'+sz.h+'" alt="">';
  } else {
    pic = '<div class="prev-pic prev-pic-ph" style="aspect-ratio:'+sz.w+'/'+sz.h+'">'+sz.w+' &times; '+sz.h+'</div>';
  }
  const opts = e.options.length
    ? e.options.map(o=>'<div class="prev-opt'+(o.name?"":" empty")+'">'+esc(o.name||"Untitled option")+'</div>').join("")
    : '<div class="prev-opt empty">No options &mdash; the player cannot close this</div>';

  let when = "triggered only";
  if(e.timing.mode==="precise") when = (e.timing.tag||"TAG").toUpperCase()+" on "+e.timing.date;
  else if(e.timing.mode==="approximate"){
    const m = e.timing.mtthMonths||0, d = e.timing.mtthDays||0;
    const t = (m||d) ? ("MTTH " + (m?m+"mo ":"") + (d?d+"d":"")).trim() : "MTTH not set";
    when = "around " + (e.timing.date||"?") + " (" + t + ")";
  }

  return '<div class="prev-win">'
    + pic
    + '<div class="prev-title">'+esc(sp.title||"Untitled event")+'</div>'
    + '<div class="prev-desc">'+esc(sp.desc||"No description yet.")+'</div>'
    + (e.ttText ? '<div class="prev-tt">'+esc(e.ttText)+'</div>' : '')
    + '<div class="prev-opts">'+opts+'</div>'
    + '</div>'
    + '<div class="prev-meta">'
    +   '<div><b>id</b> '+esc(key)+'</div>'
    +   '<div><b>type</b> '+(e.type==="news"?"news_event":"country_event")+(e.type==="news"&&e.major?" (major)":"")+'</div>'
    +   '<div><b>when</b> '+esc(when)+'</div>'
    +   '<div><b>picture</b> '+esc(e.pic?gfxName(e):"none")+'</div>'
    + '</div>';
}

/* =====================================================================
   7. Wiring
   ===================================================================== */
let badgeTimer = null;
function touch(rerenderList){
  persist();
  if(rerenderList) renderList();
  scheduleCommit();
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(refreshCheckBadge, 220);
}

function wireMain(e){
  $("#tabC").onclick = ()=>{ if(e.type!=="country"){ e.type="country"; refitPic(e); touch(true); renderMain(); } };
  $("#tabN").onclick = ()=>{ if(e.type!=="news"){ e.type="news"; refitPic(e); touch(true); renderMain(); } };

  $("#btnDup").onclick = ()=>{
    const copy = JSON.parse(JSON.stringify(e));
    copy.id = uid(); copy.num = null;
    copy.options.forEach(o=>o.id=uid());
    P.events.splice(P.events.indexOf(e)+1, 0, copy);
    selId = copy.id; touch(true); renderMain();
  };
  $("#btnDel").onclick = ()=>{
    if(!confirm("Delete this event?")) return;
    P.events.splice(P.events.indexOf(e),1);
    selId = P.events.length ? P.events[0].id : null;
    touch(true); renderMain();
  };

  const ft = $("#fText");
  ft.oninput = ()=>{
    e.text = ft.value;
    const sp = splitText(e.text);
    const note = ft.parentElement.querySelector(".split-note span");
    note.textContent = sp.title || "first line, up to the first Enter";
    note.className = sp.title ? "" : "none";
    updatePreview(e); touch(true);
  };
  $("#fTT").oninput = ev=>{ e.ttText = ev.target.value; updatePreview(e); touch(); };
  document.querySelectorAll("[data-ins]").forEach(b=>{
    b.onclick = ()=>{ insertAtCursor($("#fTT"), b.dataset.ins, true); };
  });
  $("#fImm").oninput = ev=>{ e.immediate = ev.target.value; touch(); };
  $("#fOnce").onchange = ev=>{ e.fireOnce = ev.target.checked; touch(); };
  const fm = $("#fMajor"); if(fm) fm.onchange = ev=>{ e.major = ev.target.checked; touch(); };
  $("#fHidden").onchange = ev=>{ e.hidden = ev.target.checked; touch(); };

  /* picture */
  const drop = $("#drop");
  if(drop){
    drop.onclick = ()=>pickImage(e);
    drop.ondragover = ev=>{ ev.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = ()=>drop.classList.remove("over");
    drop.ondrop = ev=>{ ev.preventDefault(); drop.classList.remove("over");
      if(ev.dataTransfer.files[0]) loadImage(e, ev.dataTransfer.files[0]); };
  }
  const rp = $("#btnRepic"); if(rp) rp.onclick = ()=>pickImage(e);
  const up = $("#btnUnpic"); if(up) up.onclick = ()=>{ e.pic = null; touch(); renderMain(); };

  /* timing */
  document.querySelectorAll('#tmodes input[name=tmode]').forEach(r=>{
    r.onchange = ()=>{
      e.timing.mode = r.value;
      if(r.value === "approximate"){
        if(!String(e.timing.trigger||"").trim() && P.settings.defaultTag)
          e.timing.trigger = "original_tag = " + P.settings.defaultTag.toUpperCase();
        if(!e.timing.mtthDays && !e.timing.mtthMonths) e.timing.mtthDays = 1;
        syncApxTrigger(e);
      }
      if(r.value === "precise" && !e.timing.tag) e.timing.tag = P.settings.defaultTag || "";
      touch(); renderMain();
    };
  });
  const bind = (sel, fn)=>{ const el = $(sel); if(el) el.oninput = ()=>{ fn(el.value); touch(); }; };
  bind("#tTag", v=>{ e.timing.tag = v.toUpperCase().slice(0,3); });
  bind("#tDate", v=>{ e.timing.date = v; updatePreview(e); refreshDelayHint(e); });
  bind("#tConds", v=>{ e.timing.conds = v; });
  bind("#tTrig", v=>{ e.timing.trigger = v; });
  const ad = $("#tADate");
  if(ad) ad.oninput = ()=>{
    e.timing.date = ad.value;
    syncApxTrigger(e);
    const tt = $("#tTrig"); if(tt) tt.value = e.timing.trigger;
    updatePreview(e); touch();
  };
  bind("#tMonths", v=>{ e.timing.mtthMonths = Math.max(0, parseInt(v||"0",10)||0); updatePreview(e); });
  bind("#tDays", v=>{ e.timing.mtthDays = Math.max(0, parseInt(v||"0",10)||0); updatePreview(e); });

  /* options */
  $("#btnAddOpt").onclick = ()=>{
    const o = newOption(); openOpts[o.id] = true;
    e.options.push(o); touch(); renderMain();
  };
  wireOptions(e);
}

function wireOptions(e){
  document.querySelectorAll("#opts .opt").forEach(box=>{
    const oid = box.dataset.oid;
    const o = e.options.find(x=>x.id===oid);
    if(!o) return;

    box.querySelector('[data-act="toggle"]').onclick = ()=>{
      openOpts[oid] = !openOpts[oid];
      box.classList.toggle("open", !!openOpts[oid]);
    };

    box.querySelectorAll("[data-f]").forEach(inp=>{
      inp.oninput = ()=>{
        o[inp.dataset.f] = inp.value;
        if(inp.dataset.f === "ttText") o.ttKey = inp.value.trim() ? "1" : "";
        const nameEl = box.querySelector(".opt-name");
        if(inp.dataset.f === "name"){
          nameEl.textContent = o.name || "Untitled option";
          nameEl.className = "opt-name" + (o.name ? "" : " empty");
          updatePreview(e);
        }
        refreshPips(box, o);
        touch();
      };
    });

    box.querySelectorAll(".varbtn").forEach(b=>{
      b.onclick = ev=>{
        ev.stopPropagation();
        const k = b.dataset.v;
        if(!o.vars) o.vars = { aprOn:false, apr:5, chaosOn:false, chaos:5 };
        o.vars[k+"On"] = !o.vars[k+"On"];
        b.classList.toggle("on", o.vars[k+"On"]);
        const num = box.querySelector('[data-vn="'+k+'"]');
        num.disabled = !o.vars[k+"On"];
        syncVars(o, box);
      };
    });
    box.querySelectorAll(".varnum").forEach(inp=>{
      inp.oninput = ()=>{
        if(!o.vars) o.vars = { aprOn:false, apr:5, chaosOn:false, chaos:5 };
        o.vars[inp.dataset.vn] = inp.value === "" ? 0 : Number(inp.value);
        syncVars(o, box);
      };
    });

    const pk = box.querySelector('[data-act="pick"]');
    if(pk) pk.onclick = ev=>{ ev.stopPropagation(); openPicker(pk, box.querySelector('[data-f="effects"]'), o, e); };

    box.querySelector('[data-act="rm"]').onclick = ()=>{
      e.options.splice(e.options.indexOf(o),1); touch(); renderMain();
    };
    box.querySelector('[data-act="up"]').onclick = ()=>{
      const i = e.options.indexOf(o);
      if(i>0){ e.options.splice(i,1); e.options.splice(i-1,0,o); touch(); renderMain(); }
    };
  });
}

   ===================================================================== */
let picTarget = null;                       // event id, not the object:
function pickImage(e){ picTarget = e.id; $("#fileImg").click(); }
$("#fileImg").onchange = ev=>{               // an undo in between replaces it
  const f = ev.target.files[0];
  const e = P.events.find(x=>x.id===picTarget);
  if(f && e) loadImage(e, f);
  ev.target.value = "";
};

function loadImage(e, file){
  const fr = new FileReader();
  fr.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const sz = picSize(e.type);
      const exact = (img.naturalWidth===sz.w && img.naturalHeight===sz.h);
      const cv = document.createElement("canvas");
      cv.width = sz.w; cv.height = sz.h;
      const cx = cv.getContext("2d");
      cx.imageSmoothingEnabled = true;
      cx.imageSmoothingQuality = "high";
      cx.drawImage(img, 0, 0, sz.w, sz.h);
      e.pic = {
        name: (file.name.replace(/\.[^.]+$/,"") || "event_picture").replace(/[^A-Za-z0-9_-]/g,"_").toLowerCase(),
        url: cv.toDataURL("image/png"),
        w: sz.w, h: sz.h,
        ow: img.naturalWidth, oh: img.naturalHeight,
        exact: exact
      };
      touch(); renderMain();
    };
    img.onerror = ()=>toast("That file could not be read as an image.");
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* If the tab flips between country and news the target size changes,
   so re-render the stored picture at the new size from the same pixels. */
function refitPic(e){
  if(!e.pic) return;
  const sz = picSize(e.type);
  const img = new Image();
  const old = e.pic;
  img.onload = ()=>{
    const cv = document.createElement("canvas");
    cv.width = sz.w; cv.height = sz.h;
    const cx = cv.getContext("2d");
    cx.imageSmoothingQuality = "high";
    cx.drawImage(img, 0, 0, sz.w, sz.h);
    e.pic = Object.assign({}, old, { url:cv.toDataURL("image/png"), w:sz.w, h:sz.h });
    touch(); renderMain();
  };
  img.src = old.url;
}

/* uncompressed 32-bit BGRA DDS — byte-for-byte the layout the game's
   own event pictures use: 128-byte header, then raw pixels, no mipmaps */
function ddsFromDataURL(url, w, h){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const cx = cv.getContext("2d");
      cx.drawImage(img, 0, 0, w, h);
      const px = cx.getImageData(0,0,w,h).data;      // RGBA
      const out = new Uint8Array(128 + w*h*4);
      const dv = new DataView(out.buffer);
      out[0]=0x44; out[1]=0x44; out[2]=0x53; out[3]=0x20;   // "DDS "
      dv.setUint32(4,124,true);                              // header size
      dv.setUint32(8,0x0002100F,true);                       // CAPS|HEIGHT|WIDTH|PITCH|PIXELFORMAT|MIPMAPCOUNT
      dv.setUint32(12,h,true);
      dv.setUint32(16,w,true);
      dv.setUint32(20,w*4,true);                             // pitch
      dv.setUint32(24,1,true);                               // depth
      dv.setUint32(28,1,true);                               // base level only
      dv.setUint32(76,32,true);                              // pixelformat size
      dv.setUint32(80,0x41,true);                            // ALPHAPIXELS|RGB
      dv.setUint32(84,0,true);                               // no fourCC
      dv.setUint32(88,32,true);                              // bit count
      dv.setUint32(92,0x00FF0000,true);                      // R mask
      dv.setUint32(96,0x0000FF00,true);                      // G mask
      dv.setUint32(100,0x000000FF,true);                     // B mask
      dv.setUint32(104,0xFF000000,true);                     // A mask
      dv.setUint32(108,0x1000,true);                         // caps: texture
      let p = 128;
      for(let i=0;i<px.length;i+=4){
        out[p++] = px[i+2];   // B
        out[p++] = px[i+1];   // G
        out[p++] = px[i];     // R
        out[p++] = px[i+3];   // A
      }
      res(out);
    };
    img.onerror = ()=>rej(new Error("bad image"));
    img.src = url;
  });
}

/* =====================================================================

let pickerEl = null;
function closePicker(){ if(pickerEl){ pickerEl.remove(); pickerEl = null; } }
document.addEventListener("click", ev=>{
  if(pickerEl && !pickerEl.contains(ev.target)) closePicker();
});

function openPicker(anchor, textarea, o, e){
  closePicker();
  const wrap = anchor.parentElement;             // .pick-wrap
  const el = document.createElement("div");
  el.className = "pick";
  el.innerHTML =
    '<div class="pick-top">'
    + '<button class="pick-tab on" data-k="fx">Effects</button>'
    + '<button class="pick-tab" data-k="mod">Modifiers</button>'
    + '</div>'
    + '<div class="pick-search"><input type="text" id="pkq" placeholder="Search&hellip;" autocomplete="off" spellcheck="false"></div>'
    + '<div class="pick-list" id="pkl"></div>'
    + '<div class="mod-basket" id="pkb" style="display:none"></div>'
    + '<div class="pick-foot" id="pkf">Click to insert at the cursor.</div>';
  wrap.appendChild(el);
  pickerEl = el;
  el.onclick = ev=>ev.stopPropagation();

  let mode = "fx";
  const q  = el.querySelector("#pkq");
  const lst= el.querySelector("#pkl");
  const bsk= el.querySelector("#pkb");
  const foot=el.querySelector("#pkf");

  if(!o.mods) o.mods = { name:"", days:0, list:[] };

  function draw(){
    const term = q.value.trim().toLowerCase();
    const src = mode==="fx" ? EFFECTS : MODIFIERS;
    let html = "", hits = 0;
    src.forEach(([grp, items])=>{
      const keep = items.filter(it=>{
        if(!term) return true;
        return (it[0]+" "+it[2]).toLowerCase().indexOf(term) !== -1
            || (mode==="fx" && it[1].toLowerCase().indexOf(term) !== -1);
      });
      if(!keep.length) return;
      hits += keep.length;
      html += '<div class="pick-grp">'+esc(grp)+'</div>';
      keep.forEach(it=>{
        const idx = items.indexOf(it);
        html += '<button class="pick-it" data-g="'+esc(grp)+'" data-i="'+idx+'">'
             +  '<span class="k">'+esc(it[0])+'</span>'
             +  '<span class="d">'+esc(it[2])+'</span></button>';
      });
    });
    lst.innerHTML = hits ? html : '<div class="pick-empty">Nothing matches &ldquo;'+esc(q.value)+'&rdquo;</div>';
    lst.querySelectorAll(".pick-it").forEach(b=>{
      b.onclick = ()=>{
        const grp = b.dataset.g, i = +b.dataset.i;
        const items = (mode==="fx"?EFFECTS:MODIFIERS).find(x=>x[0]===grp)[1];
        if(mode==="fx") insertAtCursor(textarea, items[i][1]);
        else addMod(items[i]);
      };
    });
    drawBasket();
  }

  function addMod(m){
    if(o.mods.list.some(x=>x.key===m[0])) return;
    o.mods.list.push({ key:m[0], val:m[2] });
    if(!o.mods.name) o.mods.name = suggestModName(e, o);
    drawBasket(); syncMods(); 
  }

  function drawBasket(){
    if(mode !== "mod"){ bsk.style.display = "none"; foot.textContent = "Click to insert at the cursor."; return; }
    bsk.style.display = "block";
    foot.textContent = "Modifiers cannot sit loose in an effect block, so these are bundled into a dynamic modifier and applied with add_dynamic_modifier.";
    if(!o.mods.list.length){
      bsk.innerHTML = '<div style="font-size:11.5px;color:var(--ink3)">Pick modifiers above and they collect here.</div>';
      return;
    }
    bsk.innerHTML =
      o.mods.list.map((m,i)=>
        '<span class="mod-chip">'+esc(m.key)
        + ' <input type="text" data-mi="'+i+'" value="'+esc(m.val)+'">'
        + '<button data-rm="'+i+'" title="Remove">&times;</button></span>').join("")
      + '<div style="display:flex;gap:6px;margin-top:6px">'
      + '<input type="text" id="mname" placeholder="dynamic modifier name" class="mono" style="font-size:11.5px;padding:4px 6px" value="'+esc(o.mods.name)+'">'
      + '<input type="number" id="mdays" placeholder="days" style="font-size:11.5px;padding:4px 6px;max-width:78px" value="'+(o.mods.days||"")+'">'
      + '</div>'
      + '<div style="font-size:11px;color:var(--ink3);margin-top:5px">Leave days blank for a permanent modifier.</div>';

    bsk.querySelectorAll("[data-mi]").forEach(inp=>{
      inp.oninput = ()=>{ o.mods.list[+inp.dataset.mi].val = inp.value; syncMods(); };
    });
    bsk.querySelectorAll("[data-rm]").forEach(b=>{
      b.onclick = ()=>{ o.mods.list.splice(+b.dataset.rm,1); drawBasket(); syncMods(); };
    });
    bsk.querySelector("#mname").oninput = ev2=>{ o.mods.name = ev2.target.value; syncMods(); };
    bsk.querySelector("#mdays").oninput = ev2=>{ o.mods.days = parseInt(ev2.target.value||"0",10)||0; syncMods(); };
  }

  /* keep exactly one add_dynamic_modifier line in the effects text */
  function syncMods(){
    const marker = /^\s*add_dynamic_modifier\s*=\s*\{[^}]*\}\s*$/gm;
    let txt = textarea.value.replace(marker, "").replace(/\n{3,}/g,"\n\n").replace(/^\n+/,"");
    if(o.mods.list.length && o.mods.name){
      const line = "add_dynamic_modifier = { modifier = " + o.mods.name
        + (o.mods.days ? " days = " + o.mods.days : "") + " }";
      txt = (txt.trim() ? txt.replace(/\s*$/,"") + "\n" : "") + line;
    }
    textarea.value = txt;
    o.effects = txt;
    const box = textarea.closest(".opt");
    if(box) refreshPips(box, o);
    touch();
  }

  el.querySelectorAll(".pick-tab").forEach(t=>{
    t.onclick = ()=>{
      el.querySelectorAll(".pick-tab").forEach(x=>x.classList.remove("on"));
      t.classList.add("on"); mode = t.dataset.k; q.value = ""; draw(); q.focus();
    };
  });
  q.oninput = draw;
  q.onkeydown = ev=>{ if(ev.key==="Escape"){ ev.stopPropagation(); closePicker(); } };
  draw();
  q.focus();
}

function suggestModName(e, o){
  const i = e.options.indexOf(o);
  return (nsClean()+"_"+e._num+"_"+optSuffix(i<0?0:i)+"_mod");
}

function insertAtCursor(ta, text, inline){
  const s = ta.selectionStart, en = ta.selectionEnd;
  const before = ta.value.slice(0,s), after = ta.value.slice(en);
  const needsNL = !inline && before.length && !/\n$/.test(before);
  const ins = (needsNL ? "\n" : "") + text;
  ta.value = before + ins + after;
  const pos = s + ins.length;
  ta.selectionStart = ta.selectionEnd = pos;
  ta.focus();
  ta.dispatchEvent(new Event("input", {bubbles:true}));
}

/* =====================================================================
   9b. Undo

   renderMain rebuilds the DOM, which throws away the browser's own
   undo stack, so the app keeps its own. Typing is coalesced, but only
   just: a quarter-second pause closes the step, so one Ctrl+Z is
   about a word. The history runs deeper to make up for the finer
   steps - snapshots are small, so depth is nearly free.

   Picture data is held aside by token so a snapshot stays small -
   otherwise sixty snapshots of a batch with pictures would be
   hundreds of megabytes.
   ===================================================================== */
const PICS = new Map();
let picSeq = 0;

function packState(){
  return JSON.stringify({ ns:P.ns, settings:P.settings, events:P.events }, (k,v)=>{
    if(k === "url" && typeof v === "string" && v.slice(0,5) === "data:"){
      for(const [t,u] of PICS) if(u === v) return t;
      const tok = "pic#" + (++picSeq);
      PICS.set(tok, v);
      return tok;
    }
    return v;
  });
}
function unpackState(str){
  const o = JSON.parse(str);
  (o.events||[]).forEach(e=>{
    if(e.pic && typeof e.pic.url === "string" && e.pic.url.slice(0,4) === "pic#")
      e.pic.url = PICS.get(e.pic.url) || "";
  });
  return o;
}

function focusInfo(){
  const el = document.activeElement;
  if(!el || (el.tagName !== "TEXTAREA" && el.tagName !== "INPUT")) return null;
  const box = el.closest ? el.closest(".opt") : null;
  let start = 0, end = 0;
  try { start = el.selectionStart||0; end = el.selectionEnd||0; } catch(err){}
  return { id: el.id||"", oid: box ? box.dataset.oid : "", f: (el.dataset && el.dataset.f)||"", start, end };
}
function restoreFocus(f){
  if(!f) return;
  let el = null;
  if(f.id) el = document.getElementById(f.id);
  else if(f.oid && f.f){
    const box = document.querySelector('.opt[data-oid="'+f.oid+'"]');
    if(box) el = box.querySelector('[data-f="'+f.f+'"]');
  }
  if(!el) return;
  el.focus();
  try { el.selectionStart = f.start; el.selectionEnd = f.end; } catch(err){}
}

const HIST = { past:[], future:[], cur:null, timer:null, MAX:150 };

function snap(){
  return { data: packState(), selId: selId, open: Object.assign({}, openOpts), focus: focusInfo() };
}
function commit(){
  clearTimeout(HIST.timer); HIST.timer = null;
  const s = snap();
  if(!HIST.cur){ HIST.cur = s; return; }
  if(HIST.cur.data === s.data){
    HIST.cur.selId = s.selId; HIST.cur.open = s.open; HIST.cur.focus = s.focus;
    return;
  }
  HIST.past.push(HIST.cur);
  if(HIST.past.length > HIST.MAX) HIST.past.shift();
  HIST.cur = s;
  HIST.future.length = 0;
}
function scheduleCommit(){
  clearTimeout(HIST.timer);
  HIST.timer = setTimeout(commit, 250);
}

function applySnap(s){
  const o = unpackState(s.data);
  P.ns = o.ns; P.settings = o.settings; P.events = o.events;
  selId = (s.selId && P.events.some(e=>e.id===s.selId)) ? s.selId
        : (P.events.length ? P.events[0].id : null);
  openOpts = Object.assign({}, s.open);
  const nsEl = $("#ns"); if(nsEl) nsEl.value = P.ns;
  closePicker();
  persist(); renderList(); renderMain(); refreshCheckBadge();
  restoreFocus(s.focus);
}

function undo(){
  commit();
  if(!HIST.past.length){ toast("Nothing left to undo"); return; }
  HIST.future.push(HIST.cur);
  HIST.cur = HIST.past.pop();
  applySnap(HIST.cur);
}
function redo(){
  commit();
  if(!HIST.future.length){ toast("Nothing to redo"); return; }
  HIST.past.push(HIST.cur);
  HIST.cur = HIST.future.pop();
  applySnap(HIST.cur);
}

/* =====================================================================
   10. Export — HOI4 files
   ===================================================================== */
/* HOI4's calendar has no leap day - February is always 28, every year
   is 365 days. All date maths here uses that calendar, never JS Date,
   so a delay counted here lines up with the day the game counts to. */
const MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
function parseDate(d){
  const m = /^(\d{1,4})\.(\d{1,2})\.(\d{1,2})\s*$/.exec(String(d||"").trim());
  if(!m) return null;
  const y = +m[1], mo = +m[2], da = +m[3];
  if(mo < 1 || mo > 12 || da < 1) return null;
  return { y, mo, da };
}
function dateValid(d){
  const p = parseDate(d);
  return !!p && p.da <= MONTH_DAYS[p.mo-1];
}
function dayOfYear(mo, da){         // 0-indexed within the year
  let n = 0;
  for(let i=0;i<mo-1;i++) n += MONTH_DAYS[i];
  return n + (da - 1);
}
function absDay(d){                  // days since year 0, 365-day years
  const p = parseDate(d);
  return p ? p.y*365 + dayOfYear(p.mo, p.da) : null;
}
/* whole days from the campaign start to a target date, game calendar */
function startupDelay(target){
  const a = absDay(P.settings.startDate || "2025.1.1");
  const b = absDay(target);
  return (a==null || b==null) ? null : (b - a);
}

function locEscape(s){
  return String(s==null?"":s)
    .replace(/\\/g,"\\\\")
    .replace(/"/g,'\\"')
    .replace(/\r\n/g,"\n")
    .replace(/\n/g,"\\n");
}
/* Re-indent a pasted block to sit at `tabs` deep while keeping its own
   nesting. Four spaces count as one tab so mixed input still lines up. */
function indent(text, tabs){
  const pad = "\t".repeat(tabs);
  const lines = String(text||"").replace(/\r\n/g,"\n").split("\n");
  const depth = l => /^[\t ]*/.exec(l)[0].replace(/ {4}/g,"\t").replace(/ +/g,"").length;
  let min = Infinity;
  lines.forEach(l=>{ if(l.trim()) min = Math.min(min, depth(l)); });
  if(!isFinite(min)) min = 0;
  return lines.map(l=>{
    if(!l.trim()) return "";
    return pad + "\t".repeat(Math.max(0, depth(l) - min)) + l.replace(/^[\t ]*/,"");
  }).join("\n");
}

function buildEventsFile(){
  const ns = nsClean();
  let out = "add_namespace = " + ns + "\n";
  P.events.forEach(e=>{
    const sp = splitText(e.text);
    const key = evKey(e);
    const kind = e.type==="news" ? "news_event" : "country_event";

    out += "\n" + "#".repeat(72) + "\n";
    out += "# " + key + (sp.title ? " - " + sp.title : "") + "\n";
    out += "#\n";
    if(e.timing.mode === "precise"){
      const d = startupDelay(e.timing.date);
      out += "# Scheduled from common/on_actions at game start, " +
             (d==null ? "on its date." : (d===0 ? "with no delay (fires at start)." : "with a " + d + "-day delay.")) + "\n";
      out += "# No daily check runs. Any trigger below is an extra prerequisite,\n";
      out += "# tested when the delay elapses.\n";
    } else if(e.timing.mode === "approximate"){
      out += "# Approximate timing: trigger plus mean_time_to_happen. Checked\n";
      out += "# every 20 days, which is why it is cheap and why the exact day\n";
      out += "# it lands on will vary.\n";
    } else {
      out += "# Triggered only. Fire it from another event, a decision, a focus\n";
      out += "# or an on_action.\n";
    }
    out += "#".repeat(72) + "\n";

    out += kind + " = {\n";
    out += "\tid = " + key + "\n";
    if(!e.hidden){
      out += "\ttitle = " + key + ".t\n";
      out += "\tdesc = " + key + ".d\n";
      if(e.pic) out += "\tpicture = " + gfxName(e) + "\n";
    } else {
      out += "\thidden = yes\n";
    }
    out += "\n";

    if(e.timing.mode === "approximate"){
      const trig = String(e.timing.trigger||"").trim();
      if(trig) out += "\ttrigger = {\n" + indent(trig,2) + "\n\t}\n\n";
      const m = e.timing.mtthMonths||0, d = e.timing.mtthDays||0;
      if(m || d){
        out += "\tmean_time_to_happen = {\n";
        if(m) out += "\t\tmonths = " + m + "\n";
        if(d) out += "\t\tdays = " + d + "\n";
        out += "\t}\n\n";
      } else {
        out += "\t# WARNING: no mean_time_to_happen. With a trigger but no timer\n";
        out += "\t# the event fires on the first check after the trigger passes.\n\n";
      }
    } else {
      out += "\tis_triggered_only = yes\n";
      if(e.timing.mode === "precise" && String(e.timing.conds||"").trim())
        out += "\n\ttrigger = {\n" + indent(e.timing.conds,2) + "\n\t}\n";
    }

    if(e.type==="news" && e.major) out += "\tmajor = yes\n";
    if(e.fireOnce && !(e.type==="news" && e.major)) out += "\tfire_only_once = yes\n";
    out += "\n";

    if(String(e.immediate||"").trim()){
      out += "\timmediate = {\n" + indent(e.immediate,2) + "\n\t}\n\n";
    }

    if(!e.options.length && !e.hidden){
      out += "\t# WARNING: no options. The player cannot dismiss this event.\n";
    }

    e.options.forEach((o,i)=>{
      const ok = key + "." + optSuffix(i);
      out += "\toption = {\n";
      out += "\t\tname = " + ok + "\n";
      if(String(o.trigger||"").trim()) out += "\n\t\ttrigger = {\n" + indent(o.trigger,3) + "\n\t\t}\n";
      const bits = [];
      if(String(o.ttText||"").trim()) bits.push("custom_effect_tooltip = " + ok + "_tt");
      if(String(o.effects||"").trim()) bits.push(String(o.effects).trim());
      if(bits.length) out += "\n" + indent(bits.join("\n"),2) + "\n";
      out += "\t}\n";
      if(i < e.options.length-1) out += "\n";
    });

    out += "}\n";
  });
  return out;
}

function buildLocFile(){
  let out = "\uFEFFl_english:\n";
  P.events.forEach(e=>{
    const sp = splitText(e.text);
    const key = evKey(e);
    let desc = sp.desc;
    if(String(e.ttText||"").trim()) desc = (desc ? desc + "\n\n" : "") + "[" + key + ".tt]";
    out += "\n";
    if(!e.hidden){
      out += " " + key + '.t:0 "' + locEscape(sp.title) + '"\n';
      out += " " + key + '.d:0 "' + locEscape(desc) + '"\n';
      if(String(e.ttText||"").trim())
        out += " " + key + '.tt:0 "' + locEscape(e.ttText) + '"\n';
    }
    e.options.forEach((o,i)=>{
      const ok = key + "." + optSuffix(i);
      out += " " + ok + ':0 "' + locEscape(o.name) + '"\n';
      if(String(o.ttText||"").trim())
        out += " " + ok + '_tt:0 "' + locEscape(o.ttText) + '"\n';
    });
  });
  // dynamic modifier names
  const mods = collectMods();
  if(mods.length){
    out += "\n";
    mods.forEach(m=>{ out += " " + m.name + ':0 "' + locEscape(m.label) + '"\n'; });
  }
  return out;
}

function collectMods(){
  const seen = {}, res = [];
  P.events.forEach(e=>{
    e.options.forEach((o,i)=>{
      if(o.mods && o.mods.list && o.mods.list.length && o.mods.name){
        if(seen[o.mods.name]) return;
        seen[o.mods.name] = 1;
        const sp = splitText(e.text);
        res.push({ name:o.mods.name, list:o.mods.list, label: sp.title || o.mods.name });
      }
    });
  });
  return res;
}

function buildDynModFile(){
  const mods = collectMods();
  if(!mods.length) return null;
  let out = "# Dynamic modifiers used by the " + nsClean() + " events.\n";
  out += "# Definitions here cannot be reloaded in-game; a restart is needed\n";
  out += "# after any change to this file.\n";
  mods.forEach(m=>{
    out += "\n" + m.name + " = {\n";
    out += "\ticon = GFX_idea_unknown\n";
    out += "\tenable = { always = yes }\n\n";
    m.list.forEach(x=>{ out += "\t" + x.key + " = " + (String(x.val).trim()||"0") + "\n"; });
    out += "}\n";
  });
  return out;
}

function preciseEvents(){ return P.events.filter(e=>e.timing.mode==="precise" && e.timing.tag); }

function buildOnActions(){
  const list = preciseEvents();
  if(!list.length) return null;
  const ns = nsClean();
  const start = P.settings.startDate || "2025.1.1";
  const byTag = {};
  list.forEach(e=>{ const t = e.timing.tag.toUpperCase(); (byTag[t] = byTag[t]||[]).push(e); });

  let out = "";
  out += "# " + "=".repeat(68) + "\n";
  out += "#  Precise-date drivers for the " + ns + " events.\n";
  out += "#\n";
  out += "#  Every event is scheduled once, here at game start, with the\n";
  out += "#  exact number of days from " + start + " to its date. No daily\n";
  out += "#  check runs and no guard flag is needed - the schedule fires it\n";
  out += "#  a single time on the right day. Days are counted on the game's\n";
  out += "#  own 365-day calendar, which has no leap day.\n";
  out += "#\n";
  out += "#  Any extra prerequisite lives in the event's own trigger block\n";
  out += "#  and is checked when the delay elapses; if it fails then, the\n";
  out += "#  event is simply skipped.\n";
  out += "# " + "=".repeat(68) + "\n\n";
  out += "on_actions = {\n";
  out += "\ton_startup = {\n";
  out += "\t\teffect = {\n";
  Object.keys(byTag).sort().forEach(tag=>{
    out += "\n\t\t\t" + tag + " = {\n";
    byTag[tag].sort((a,b)=>(startupDelay(a.timing.date)||0)-(startupDelay(b.timing.date)||0)).forEach(e=>{
      const key = evKey(e);
      const sp = splitText(e.text);
      const d = startupDelay(e.timing.date);
      const kind = e.type==="news" ? "news_event" : "country_event";
      const call = (d && d>0)
        ? kind + " = { id = " + key + " days = " + d + " }"
        : kind + " = { id = " + key + " }";
      out += "\t\t\t\t" + call.padEnd(52)
           + " # " + e.timing.date + (d===0 ? " (at start)" : "") + (sp.title ? "  " + sp.title : "") + "\n";
    });
    out += "\t\t\t}\n";
  });
  out += "\t\t}\n";
  out += "\t}\n";
  out += "}\n";
  return out;
}

function buildGfxFile(){
  const withPics = P.events.filter(e=>e.pic);
  if(!withPics.length) return null;
  let out = "spriteTypes = {\n";
  const seen = {};
  withPics.forEach(e=>{
    const n = gfxName(e);
    if(seen[n]) return; seen[n] = 1;
    out += "\n\tspriteType = {\n";
    out += '\t\tname = "' + n + '"\n';
    out += '\t\ttexturefile = "gfx/event_pictures/' + e.pic.name + '.dds"\n';
    out += "\t}\n";
  });
  out += "}\n";
  return out;
}

function buildReadme(hasDriverFile){
  const ns = nsClean();
  const list = preciseEvents();
  let r = "";
  r += "HOI4 Event Maker export\n";
  r += "namespace: " + ns + "\n";
  r += "events: " + P.events.length + " (" + P.events.filter(e=>e.type==="country").length + " country, "
     + P.events.filter(e=>e.type==="news").length + " news)\n\n";
  r += "Drop the folders into your mod root, keeping the structure:\n\n";

  if(buildDynModFile()) r += "  common/dynamic_modifiers/" + ns + "_dynamic_modifiers.txt\n";
  if(hasDriverFile) r += "  common/on_actions/" + ns + "_on_actions.txt\n";
  r += "\n";
  r += "Notes\n";
  r += "-----\n";

  r += "  ignores the file.\n";
  r += "* Pictures are uncompressed 32-bit DDS, the same layout the base\n";
  r += "  game uses for event pictures. No mipmaps, no conversion needed.\n";
  r += "* A missing sprite shows an empty frame rather than crashing, so\n";
  r += "  pictures can be swapped freely afterwards.\n";
  r += "* Precise-date events are scheduled at game start with a day delay\n";
  r += "  counted on the game's 365-day calendar (no leap day), so no daily\n";
  r += "  on_action check runs. Set the campaign start date in the tool to\n";

  if(list.length && !hasDriverFile){
    r += "\n";

    r += "-------------------\n";
    r += "You chose to paste this in yourself. Merge the on_startup block\n";
    r += "below into any on_actions file. on_actions are additive, so it sits\n";

    r += "the file itself does not share a name with a vanilla one. Each event\n";
    r += "is scheduled once, as a day delay from the campaign start; no daily\n";
    r += "check runs.\n\n";
    r += buildOnActions();
  }
  return r;
}

/* =====================================================================
   10b. Pre-export check

   Brace and quote counting catches the mistakes that stop a file
   parsing at all. The rest are things that load fine and then quietly
   do nothing, which is far harder to notice in-game.
   ===================================================================== */
const BAD_TOKENS = [
  ["create_faction",
   "create_faction is obsolete and can throw an access violation when the event fires. Use create_faction_from_template."],
  ["political_power_cost_factor",
   "Not a real modifier, so it is silently ignored. Use political_power_factor, or a negative political_power_gain."],
  ["on_monthly_pulse_country",
   "Not a real on_action. HOI4 drops unknown keys without complaining, so the tick never runs. Use on_monthly_TAG."],
  ["add_namespace",
   "The namespace is written once at the top of the exported file. A second one here would break the event."]
];

const DIRECT_WRITE = /(?:set_variable|add_to_variable|subtract_from_variable)\s*=\s*\{[^}]*\b(aproval_rate|civil_war)\b/;

function braceBalance(txt){
  let d = 0;
  String(txt||"").split("\n").forEach(line=>{
    let inStr = false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(c === '"'){ inStr = !inStr; continue; }
      if(inStr) continue;
      if(c === "#") break;
      if(c === "{") d++;
      else if(c === "}") d--;
    }
  });
  return d;
}
function oddQuoteLine(txt){
  const lines = String(txt||"").split("\n");
  for(let i=0;i<lines.length;i++){
    const body = lines[i].split("#")[0];
    if((body.match(/"/g)||[]).length % 2) return i+1;
  }
  return 0;
}

function scanScript(txt, where, evId, optId, push){
  if(!String(txt||"").trim()) return;
  const b = braceBalance(txt);
  if(b > 0) push("error", evId, optId, where + " has " + b + " unclosed " + (b===1?"brace":"braces") + ". The file will not parse.");
  if(b < 0) push("error", evId, optId, where + " has " + (-b) + " extra closing " + (b===-1?"brace":"braces") + ". The file will not parse.");
  const q = oddQuoteLine(txt);
  if(q) push("error", evId, optId, where + " has an unclosed quote on line " + q + ".");
  BAD_TOKENS.forEach(([tok,msg])=>{
    if(new RegExp("\\b"+tok+"\\b").test(txt)) push("warn", evId, optId, where + ": " + msg);
  });
  if(DIRECT_WRITE.test(txt))
    push("error", evId, optId, where + " writes straight to a display variable. The next monthly tick overwrites it from usa_apr_real. Use the Approval and Chaos buttons, or call USA_apr_add / USA_chaos_add.");
}

function validate(){
  assignNumbers();
  const out = [];
  const push = (level, evId, optId, msg)=>out.push({level, evId, optId, msg});

  if(!/^[a-z0-9_]+$/.test(nsClean()))
    push("error", null, null, "The namespace must be lower-case letters, digits and underscores.");

  const nums = {}, pics = {};
  P.events.forEach(e=>{
    const key = evKey(e);
    const label = splitText(e.text).title || key;
    const at = s => label + " \u2014 " + s;

    if(nums[e._num]) push("error", e.id, null, at("shares id " + key + " with another event. Clear one of the manual numbers."));
    nums[e._num] = 1;

    const sp = splitText(e.text);
    if(!e.hidden){
      if(!sp.title) push("error", e.id, null, at("has no title. The first line of the text box becomes the title."));
      if(!sp.desc)  push("warn",  e.id, null, at("has no description."));
      if(!e.pic)    push("info",  e.id, null, at("has no picture. The frame will be empty, which is harmless."));
    }

    if(e.pic){
      if(pics[e.pic.name] && pics[e.pic.name] !== e.pic.url)
        push("warn", e.id, null, at("uses the picture filename " + e.pic.name + ".dds, which another event already claims with a different image. One will overwrite the other."));
      pics[e.pic.name] = e.pic.url;
    }

    if(!e.options.length && !e.hidden)
      push("error", e.id, null, at("has no options, so the player cannot close it."));
    if(e.options.length && e.hidden)
      push("warn", e.id, null, at("is hidden but still has options. They will never be seen."));

    if(e.type === "news" && e.major && e.fireOnce)
      push("info", e.id, null, at("is a major news event, so fire_only_once is left out of the export \u2014 it would pin the event to a single recipient."));

    if(e.timing.mode === "precise"){
      if(!e.timing.tag) push("error", e.id, null, at("is set to a precise date but has no country tag, so no driver can be written."));
      if(!/^\d{1,4}\.\d{1,2}\.\d{1,2}$/.test(String(e.timing.date||"").trim()))
        push("error", e.id, null, at("has a date the driver cannot read. Use year.month.day, as in 2025.1.20."));
      else if(!dateValid(e.timing.date))
        push("error", e.id, null, at("has a date that is not a real day on the game calendar (February has 28 days and there is no leap day). It would silently land on the following day."));
      else {
        const dd = startupDelay(e.timing.date);
        if(dd != null && dd < 0)
          push("error", e.id, null, at("falls before the campaign start of " + (P.settings.startDate||"2025.1.1") + ", so its delay is negative and it can never fire. Move the date, or change the start date in Settings."));
      }
      scanScript(e.timing.conds, at("extra conditions"), e.id, null, push);
    }
    if(e.timing.mode === "approximate"){
      const hasTrig = String(e.timing.trigger||"").trim();
      const hasTime = (e.timing.mtthMonths||0) || (e.timing.mtthDays||0);
      if(!hasTrig && !hasTime)
        push("error", e.id, null, at("has no trigger and no mean time, so it fires immediately for every country."));
      else if(!hasTrig)
        push("warn", e.id, null, at("has a timer but no trigger, so every country in the game can get it."));
      else if(!hasTime)
        push("warn", e.id, null, at("has a trigger but no mean time, so it fires on the first check after the trigger passes."));
      scanScript(e.timing.trigger, at("trigger"), e.id, null, push);
    }

    scanScript(e.immediate, at("immediate block"), e.id, null, push);

    e.options.forEach((o,i)=>{
      const ok = key + "." + optSuffix(i);
      const oat = s2 => label + " \u00b7 option ." + optSuffix(i) + " \u2014 " + s2;
      if(!String(o.name||"").trim())
        push("error", e.id, o.id, oat("has no text, so the button will be blank in game."));
      scanScript(o.trigger, oat("trigger"), e.id, o.id, push);
      scanScript(o.effects, oat("effects"), e.id, o.id, push);
      if(/custom_effect_tooltip/.test(o.effects||"") && String(o.ttText||"").trim())
        push("warn", e.id, o.id, oat("has a custom_effect_tooltip typed into the effects and a tooltip in the field above. Both will show."));
      if(o.mods && o.mods.list && o.mods.list.length){
        if(!String(o.mods.name||"").trim())
          push("error", e.id, o.id, oat("has modifiers collected but no dynamic modifier name, so nothing will be written."));
        o.mods.list.forEach(m=>{
          if(!String(m.val).trim() || isNaN(Number(m.val)))
            push("error", e.id, o.id, oat(m.key + " has no usable number. A modifier set to 0 does nothing at all."));
        });
      }
    });
  });

  if(!P.events.length) push("warn", null, null, "There are no events to export yet.");
  return out;
}

function issueCounts(list){
  return {
    error: list.filter(i=>i.level==="error").length,
    warn:  list.filter(i=>i.level==="warn").length,
    info:  list.filter(i=>i.level==="info").length
  };
}

  const c = issueCounts(validate());

  if(!b) return;
  b.classList.toggle("has-err", c.error>0);
  b.classList.toggle("has-warn", !c.error && c.warn>0);

               : c.warn  ? (c.warn + (c.warn===1?" warning":" warnings"))

  veil.className = "veil";
