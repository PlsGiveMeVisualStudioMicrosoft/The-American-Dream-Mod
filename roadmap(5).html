<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The American Dream — Mod Roadmap</title>
<style>
  /* ============================================================
     LOOK & FEEL  —  small tweaks here change the whole site.
     ============================================================ */
  :root{
    --paper:        #ffffff;   /* page background            */
    --grid:         #ececec;   /* faint grid lines           */
    --ink:          #1f2328;   /* main text                  */
    --muted:        #6b7280;   /* secondary text             */
    --line:         #c4c8ce;   /* borders & dotted lines     */
    --marker:       #16181d;   /* the black square markers   */
    --accent:       #0b5fb0;   /* blue used for feature items*/
    --header-tint:  #eef3fb;   /* card title-bar background  */
    --card-w:       250px;     /* width of each update card  */
    --card-gap:     56px;      /* space between updates      */
    --grid-hot:     #c3cee1;   /* brighter grid lines near the pointer */
    --glow:         rgba(11,95,176,.10); /* soft light that follows pointer */
    /* pointer position for the glow, and grid parallax offset — updated by JS */
    --mx:50vw; --my:38vh;
    --px:0px;  --py:0px;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    background:var(--paper);
  }

  /* ---- animated background layers (sit behind all content) ---- */
  .bg{ position:fixed; pointer-events:none; z-index:0; }
  .bg-grid{
    inset:-40px;                 /* oversized so parallax never bares an edge */
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 34px 34px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 34px 34px;
    transform: translate(var(--px), var(--py));
    transition: transform .25s cubic-bezier(.22,.61,.36,1);
    will-change: transform;
  }
  /* a slightly stronger copy of the grid, scaled about the pointer = a soft
     magnifying lens that adds depth right under the cursor */
  .bg-lens{
    inset:-40px;
    background:
      linear-gradient(var(--grid-hot) 1px, transparent 1px) 0 0 / 34px 34px,
      linear-gradient(90deg, var(--grid-hot) 1px, transparent 1px) 0 0 / 34px 34px;
    transform: translate(var(--px), var(--py)) scale(var(--lens, 1.09));
    transform-origin: calc(var(--mx) + 40px) calc(var(--my) + 40px);
    -webkit-mask: radial-gradient(150px circle at calc(var(--mx) + 40px) calc(var(--my) + 40px), #000 0%, rgba(0,0,0,.55) 42%, transparent 74%);
            mask: radial-gradient(150px circle at calc(var(--mx) + 40px) calc(var(--my) + 40px), #000 0%, rgba(0,0,0,.55) 42%, transparent 74%);
    will-change: transform, mask;
  }
  /* the liquid trail is painted here; blur fuses the trail into one flowing blob */
  canvas.bg-liquid{
    inset:0;
    width:100%; height:100%;
    filter: blur(5px);
  }

  /* keep real content above the background layers */
  .page-head, .legend, .rail-wrap{ position:relative; z-index:1; }

  /* ---- top banner (edit text in the config below) ---- */
  .page-head{
    max-width:1100px;
    margin:0 auto;
    padding:56px 28px 8px;
  }
  .page-head h1{
    font-size:2rem;
    letter-spacing:-.02em;
    margin:0 0 6px;
  }
  .page-head .subtitle{
    color:var(--muted);
    font-size:1.05rem;
    margin:0 0 14px;
  }
  .page-head .intro{
    max-width:640px;
    line-height:1.55;
    color:var(--ink);
    font-size:.97rem;
  }
  .page-head .intro img{ max-width:100%; border:1px solid var(--line); }

  /* ---- small framed cover art (minimalist matte + hairline) ---- */
  .cover{
    float:right;
    width:148px;
    margin:2px 0 14px 24px;
    padding:7px;                 /* white matte around the picture */
    background:#fff;
    border:1px solid var(--line);
    box-shadow:3px 3px 0 rgba(0,0,0,.05);
  }
  .cover img{
    display:block;
    width:100%; height:auto;
    border:1px solid var(--line); /* inner hairline */
    margin:0;
  }
  .cover figcaption{
    margin-top:6px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:.62rem;
    letter-spacing:.04em;
    text-align:center;
    color:var(--muted);
  }
  @media (max-width:560px){
    .cover{ float:none; margin:0 0 16px; }
  }

  /* ---- status legend ---- */
  .legend{
    max-width:1100px;
    margin:22px auto 0;
    padding:0 28px;
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    font-size:.82rem;
    color:var(--muted);
  }
  .legend span{ display:inline-flex; align-items:center; gap:8px; }
  .swatch{ width:14px; height:14px; border:1.5px solid var(--marker); }
  .swatch.released{ background:var(--marker); }
  .swatch.progress{ background:linear-gradient(135deg, var(--marker) 50%, #fff 50%); }
  .swatch.planned{  background:#fff; }

  /* ---- the horizontal timeline rail ---- */
  .rail-wrap{
    overflow:hidden;           /* panning is handled in JS, not native scroll */
    padding:40px 28px 60px;
    cursor:grab;
    touch-action:pan-y;        /* let the page scroll vertically; JS pans sideways */
    user-select:none;
  }
  .rail-wrap.dragging{ cursor:grabbing; }
  .rail{
    display:flex;
    align-items:flex-end;      /* keeps every marker on one baseline */
    gap:var(--card-gap);
    width:max-content;         /* shrink-wrap to content so it can be centred */
    border-bottom:1px solid var(--line);
    padding-bottom:0;
    will-change:transform;
  }

  .col{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:flex-end; /* card floats up, marker stays on baseline */
    width:var(--card-w);
    flex:0 0 auto;
  }

  /* ---- update card ---- */
  .card{
    width:100%;
    border:1px solid var(--line);
    background:var(--paper);
  }
  .card .bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 10px;
    background:var(--header-tint);
    border-bottom:1px solid var(--line);
  }
  .card .bar .glyph{
    font-size:.8rem; color:var(--muted); line-height:1;
  }
  .card .bar .ver{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:.78rem;
    color:var(--muted);
  }
  .card .bar .name{
    font-weight:600;
    font-size:.92rem;
    margin-left:auto;
    text-align:right;
  }
  .card .body{ padding:10px 12px 12px; }
  .card .date{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:.72rem;
    color:var(--muted);
    margin-bottom:8px;
  }
  .card img{
    display:block;
    width:100%;
    height:auto;
    border:1px solid var(--line);
    margin-bottom:10px;
  }
  .card ul{ list-style:none; margin:0; padding:0; }
  .card li{
    color:var(--accent);
    font-size:.9rem;
    line-height:1.5;
    padding:3px 0;
  }
  .card li::before{ content:"– "; color:var(--muted); }
  .card .note{
    margin-top:10px;
    padding-top:9px;
    border-top:1px dashed var(--line);
    color:var(--ink);
    font-size:.85rem;
    line-height:1.5;
  }

  /* ---- dotted diagonal connector ---- */
  .connector{ width:100%; height:66px; }
  .connector line{ stroke:var(--line); stroke-width:1.4; stroke-dasharray:3 4; }

  /* ---- baseline marker ---- */
  .marker{
    width:18px; height:18px;
    margin-left:2px;
    border:1.5px solid var(--marker);
    background:var(--marker);
    transform:translateY(9px);   /* sits astride the baseline */
  }
  .marker.progress{ background:linear-gradient(135deg, var(--marker) 50%, #fff 50%); }
  .marker.planned{  background:#fff; }

  .card{ transition:box-shadow .15s ease; }
  .card:hover{ box-shadow:0 2px 0 var(--line), 4px 4px 0 rgba(0,0,0,.04); }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
    .bg-grid, .bg-lens{ transition:none; }
  }
  ::-webkit-scrollbar{ height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); }
</style>
</head>
<body>

  <div class="bg bg-grid"></div>
  <div class="bg bg-lens"></div>
  <canvas class="bg bg-liquid"></canvas>

  <header class="page-head" id="page-head"></header>
  <div class="legend">
    <span><i class="swatch released"></i> Released</span>
    <span><i class="swatch progress"></i> In progress</span>
    <span><i class="swatch planned"></i> Planned</span>
  </div>

  <div class="rail-wrap">
    <div class="rail" id="rail"></div>
  </div>

/* ==================================================================
   ====================   E D I T   H E R E   ======================
   ==================================================================

   1) PAGE  — the title and intro text at the top of the page.
   2) UPDATES — one { ... } block per major update, left to right.

   Each update has:
     version   the version number, e.g. "1.2"     (shown small)
     name      short name of the update            (shown bold)
     date      when it ships, e.g. "Q3 2025"       (any text)
     status    "released" | "progress" | "planned" (controls the marker)
     features  a list of the epic features
     image     (optional) a picture — a URL or a file next to this page,
               e.g. "screenshots/map.png". Leave "" for no image.
     note      (optional) any free text under the features. Leave "" to skip.

   To ADD an update: copy a whole { ... } block, paste it, edit it.
   To REMOVE one: delete its { ... } block.
   ================================================================== */

<script>
/* ==================================================================
   INTERACTION  —  pointer-reactive grid + centred, elastic timeline.
   (Behaviour only; nothing here needs editing to update the roadmap.)
   ================================================================== */
(function(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.documentElement;
  const wrap = document.querySelector(".rail-wrap");
  const rail = document.getElementById("rail");

  /* ---------- the grid follows the pointer: magnifier lens + parallax + liquid trail ---------- */
  if (!reduce){
    const canvas = document.querySelector(".bg-liquid");
    const ctx = canvas.getContext("2d");
    let dpr = 1, W = 0, H = 0;

    function size(){
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width  = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    addEventListener("resize", size);

    // rx/ry = real pointer, tx/ty = eased "liquid" position that lags behind it
    let rx = innerWidth/2, ry = innerHeight*0.38;
    let tx = rx, ty = ry, lastMove = 0, running = false;

    function setVars(){
      root.style.setProperty("--mx", rx + "px");
      root.style.setProperty("--my", ry + "px");
      root.style.setProperty("--px", ((rx/innerWidth  - .5) * -16).toFixed(2) + "px");
      root.style.setProperty("--py", ((ry/innerHeight - .5) * -16).toFixed(2) + "px");
    }

    function blob(x, y, r, a){
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0,   "rgba(96,162,226," + a + ")");
      g.addColorStop(0.5, "rgba(135,186,235," + (a * 0.5) + ")");
      g.addColorStop(1,   "rgba(135,186,235,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function frame(){
      // ease the trail toward the pointer -> lag = liquid flow
      tx += (rx - tx) * 0.16;
      ty += (ry - ty) * 0.16;

      // fade the previous frame toward transparent -> a soft motion-blur wake
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0,0,0,0.14)";
      ctx.fillRect(0, 0, W, H);

      // paint the liquid: a trailing body + a brighter head at the pointer
      ctx.globalCompositeOperation = "source-over";
      blob(tx, ty, 120, 0.075);                         // body (lags)
      blob((tx + rx) / 2, (ty + ry) / 2, 90, 0.05);     // neck (stretches between)
      blob(rx, ry, 64, 0.10);                           // head (at the pointer)

      // keep going until the pointer is idle and the wake has faded out
      if (performance.now() - lastMove < 900 ||
          Math.abs(rx - tx) > 0.5 || Math.abs(ry - ty) > 0.5){
        requestAnimationFrame(frame);
      } else {
        ctx.globalCompositeOperation = "destination-out";
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0, 0, W, H);                        // clear the last faint remnants
        running = false;
      }
    }
    function start(){ if (!running){ running = true; requestAnimationFrame(frame); } }

    addEventListener("pointermove", e => {
      if (e.pointerType === "touch") return;             // touch is for panning
      rx = e.clientX; ry = e.clientY;
      lastMove = performance.now();
      setVars();
      start();
    }, { passive:true });

    setVars();
  }

  /* ---------- the rail: centred when it fits, elastic against both walls ---------- */
  const PAD = 28;                       // matches .rail-wrap horizontal padding
  let offset = 0, vel = 0, min = 0, max = 0;
  let dragging = false, lastX = 0, lastT = 0, ticking = false;

  function measure(){
    const availW = wrap.clientWidth - PAD * 2;
    const railW  = rail.scrollWidth;
    if (railW <= availW){                // fits: rest in the centre, both sides springy
      const c = (availW - railW) / 2;
      min = max = c;
    } else {                             // overflows: pan the full width
      min = availW - railW; max = 0;
    }
  }
  const clamp  = v => Math.max(min, Math.min(max, v));
  const rubber = x => { const dim = 180; return (1 - 1/(x/dim + 1)) * dim; }; // compress overshoot

  function applyDelta(d){
    let n = offset + d;
    if      (n > max) n = max + rubber(n - max);   // push against the right wall
    else if (n < min) n = min - rubber(min - n);   // push against the left wall
    offset = n;
  }
  const render = () => { rail.style.transform = "translateX(" + offset.toFixed(2) + "px)"; };

  function tick(){
    if (!dragging){
      if (Math.abs(vel) > 0.06){ applyDelta(vel); vel *= 0.92; } else vel = 0;
      const c = clamp(offset);
      if (offset !== c){                 // spring back off the wall / to centre
        offset += (c - offset) * 0.16;
        if (Math.abs(c - offset) < 0.08) offset = c;
      }
    }
    render();
    if (!dragging && vel === 0 && offset === clamp(offset)) ticking = false;
    else requestAnimationFrame(tick);
  }
  const kick = () => { if (!ticking){ ticking = true; requestAnimationFrame(tick); } };

  wrap.addEventListener("wheel", e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    e.preventDefault();
    applyDelta(-d);                      // scroll down / right -> content moves left
    vel = 0;                             // discrete input; let the spring do the bounce
    kick();
  }, { passive:false });

  wrap.addEventListener("pointerdown", e => {
    if (e.button && e.button !== 0) return;
    dragging = true; lastX = e.clientX; lastT = performance.now(); vel = 0;
    wrap.classList.add("dragging");
    if (wrap.setPointerCapture) wrap.setPointerCapture(e.pointerId);
    kick();
  });
  wrap.addEventListener("pointermove", e => {
    if (!dragging) return;
    const now = performance.now();
    const dx = e.clientX - lastX, dt = (now - lastT) || 16;
    applyDelta(dx);
    vel = dx / dt * 16;                  // carry a little momentum on release
    lastX = e.clientX; lastT = now;
  });
  const endDrag = () => { if (dragging){ dragging = false; wrap.classList.remove("dragging"); kick(); } };
  wrap.addEventListener("pointerup", endDrag);
  wrap.addEventListener("pointercancel", endDrag);

  addEventListener("resize", () => { measure(); offset = clamp(offset); render(); kick(); });

  measure();
  offset = clamp(0);                     // centred if it fits, else at the first card
  render();
})();
</script>
</body>
</html>
