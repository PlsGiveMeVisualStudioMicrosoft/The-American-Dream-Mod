/* =====================================================================
   Code editor — line numbers, syntax colours, pragmatic linter
   ===================================================================== */
const EFFECT_SET=new Set(), TRIGGER_SET=new Set(), MOD_SET=new Set();
EFFECTS.forEach(([g,items])=>items.forEach(it=>{ const m=/^([a-z_][a-z0-9_]*)/.exec(it[1]); if(m) EFFECT_SET.add(m[1]); }));
TRIGGERS.forEach(([g,items])=>items.forEach(it=>{ const m=/^([a-z_][a-z0-9_]*)/.exec(it[1]); if(m) TRIGGER_SET.add(m[1]); }));
MODIFIERS.forEach(([g,items])=>items.forEach(it=>MOD_SET.add(it[0])));
const STRUCT_KEYS=new Set(("id icon x y cost prerequisite focus mutually_exclusive relative_position_id available bypass "+
  "select_effect completion_reward complete_tooltip ai_will_do allow_branch search_filters will_lead_to_war_with "+
  "available_if_capitulated cancel_if_invalid continue_if_invalid dynamic offset text default reset_on_civilwar "+
  "continuous_focus_position initial_show_position shared_focus focus_tree country factor modifier add tag value days "+
  "limit trigger if else else_if hidden_effect custom_effect_tooltip set_temp_variable name long_name ideology popularity "+
  "ruling_party last_election election_frequency elections_allowed type target amount producer province level instant_build "+
  "state rule option progress ideas idea removal_cost allowed picture on_add on_remove targeted_modifier equipment_bonus "+
  "research_bonus bonus uses category prioritize random random_list count all any_of hours random_hours random_days").split(/\s+/));
const KNOWN_KEYS=new Set([...EFFECT_SET,...TRIGGER_SET,...STRUCT_KEYS]);
function classifyWord(w){
  let cls="";
  if(w==="yes"||w==="no") cls="tok-bool";
  else if(/^(ROOT|FROM|THIS|PREV|OWNER|CONTROLLER|OVERLORD|TAG|OR|AND|NOT)$/.test(w) || /^[A-Z]{2,3}$/.test(w)) cls="tok-tag";
  else if(MOD_SET.has(w)) cls="tok-mod";
  else if(EFFECT_SET.has(w)) cls="tok-eff";
  else if(TRIGGER_SET.has(w)) cls="tok-trig";
  return cls?'<span class="'+cls+'">'+esc(w)+'</span>':esc(w);
}
function highlightScript(src){
  const re=/(#[^\n]*)|("(?:[^"\\]|\\.)*"?)|(-?\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_.]*)|([{}=<>])|(\s+)|([^\s])/g;
  let out="", m;
  while((m=re.exec(src))){
    if(m[1]) out+='<span class="tok-com">'+esc(m[1])+'</span>';
    else if(m[2]) out+='<span class="tok-str">'+esc(m[2])+'</span>';
    else if(m[3]) out+='<span class="tok-num">'+esc(m[3])+'</span>';
    else if(m[4]) out+=classifyWord(m[4]);
    else if(m[5]) out+='<span class="tok-punct">'+m[5].replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</span>';
    else out+=esc(m[0]);
  }
  return out;
}
/* pragmatic linter → [{line, level:'error'|'warn', msg}] */
function lintScript(text, f){
  const out=[], lines=text.split("\n");
  const indentOf=ln=>(ln.match(/^[ \t]*/)[0].replace(/\t/g,"    ")).length;
  // ---- brace + quote balance. Each open '{' remembers its line and indent, and
  // whether it has deeper-indented content ('deep'). When a non-'}' line dedents
  // back to/under a deep open block, that block's '}' was forgotten there — which
  // pinpoints a missing brace far better than counting can. The 'deep' guard keeps
  // flat / unindented code from false-positiving.
  let inStr=false; const stack=[];
  for(let li=0; li<lines.length; li++){
    const ln=lines[li];
    const trimmed=ln.replace(/#.*/,"").trim();
    if(trimmed!==""){
      const indent=indentOf(ln);
      while(stack.length && stack[stack.length-1].deep && trimmed[0]!=="}" && indent<=stack[stack.length-1].indent){
        const op=stack.pop();
        if(op.synthetic) continue;   // we already reported the missing '{' for this block
        out.push({line:li+1, level:"error", msg:"a '}' is likely missing above line "+(li+1)+" — the block opened on line "+op.line+" is never closed"});
      }
      if(stack.length && indent>stack[stack.length-1].indent) stack[stack.length-1].deep=true;
      // symmetric to the check above: a bare "key =" whose value block below is
      // missing its opening '{'. Synthesise the open so the rest of the braces
      // still balance (no phantom errors at the bottom) and pinpoint it here.
      if(/^[A-Za-z_][\w.]*\s*=\s*$/.test(trimmed)){
        let ni=li+1; while(ni<lines.length && lines[ni].replace(/#.*/,"").trim()==="") ni++;
        const nt = ni<lines.length ? lines[ni].replace(/#.*/,"").trim() : "";
        if(nt && nt[0]!=="{" && indentOf(lines[ni])>indent){
          out.push({line:li+1, level:"error", msg:"a '{' is likely missing here — line "+(li+1)+" opens a block ('… =') but its opening brace is gone"});
          stack.push({line:li+1, indent, deep:false, synthetic:true});
        }
      }
    }
    let q=0;
    for(let i=0;i<ln.length;i++){
      const c=ln[i];
      if(inStr){ if(c==="\\"){ i++; continue; } if(c==='"') inStr=false; continue; }
      if(c==="#") break;
      if(c==='"'){ inStr=true; q++; continue; }
      if(c==="{") stack.push({line:li+1, indent:indentOf(ln), deep:false});
      else if(c==="}"){ if(stack.length) stack.pop(); else out.push({line:li+1, level:"error", msg:"unexpected '}' — there's no open '{' for it to close"}); }
    }
    if(q%2===1){ out.push({line:li+1, level:"error", msg:"unterminated string (odd number of quotes on this line)"}); inStr=false; }
  }
  // anything still open at EOF (a block that runs off the end)
  stack.forEach(op=>{
    if(op.synthetic) return;   // its missing '{' was already reported at its line
    let g=0;
    for(let i=op.line; i<lines.length; i++){ if(!lines[i].trim()) continue; if(indentOf(lines[i])<=op.indent){ g=i+1; break; } }
    out.push({line:op.line, level:"error", msg:"this '{' is never closed — a '}' is likely missing "+(g?("just before line "+g):"at the end of the script")});
  });
  // ---- a key followed by a stray operator instead of '=' (e.g. add_political_power - 75)
  for(let li=0; li<lines.length; li++){
    const raw=lines[li].replace(/#.*$/,"");
    const m=/([A-Za-z_][A-Za-z0-9_]*)\s+([-+*\/])\s/.exec(raw);
    if(m) out.push({line:li+1, level:"error", msg:"'"+m[1]+" "+m[2]+"' — use '=' to assign (e.g. "+m[1]+" = …)"});
  }
  // focus references that aren't in the tree (only reliable in a focus context).
  // NOTE: no blanket "unknown keyword" check — HOI4 has thousands of valid
  // effects/triggers plus mod scripted-effects, so that only produced noise.
  const existing = f ? new Set(P.focuses.filter(x=>x!==f).map(x=>focusKey(x))) : null;
  if(existing){
    for(let li=0; li<lines.length; li++){
      const raw=lines[li].replace(/#.*$/,"");
      let fr; const fre=/\bfocus\s*=\s*([A-Za-z0-9_]+)/g;
      while((fr=fre.exec(raw))){ if(!existing.has(fr[1]) && fr[1]!==focusKey(f)) out.push({line:li+1, level:"warn", msg:"focus '"+fr[1]+"' isn't in this tree (won't link on the canvas)"}); }
    }
  }
  if(f){
    const idm=/(^|\s)id\s*=\s*([A-Za-z0-9_]+)/.exec(text);
    if(idm && existing && existing.has(idm[2])) out.push({line:(text.slice(0,idm.index).split("\n").length), level:"error", msg:"duplicate id — another focus already uses '"+idm[2]+"'"});
  }
  return out;
}
function makeCodeEditor(opts){

    '<div class="code-legend"><span class="tok-eff">effect</span><span class="tok-trig">trigger</span><span class="tok-mod">modifier</span><span class="tok-tag">TAG / scope</span><span class="tok-num">number</span><span class="tok-str">"text"</span></div>';

    gutter.innerHTML=g;
    const errList=markers.filter(m=>m.level==="error"), errs=errList.length, warns=markers.length-errs;
    const firstBad=(errList[0]||markers[0]); const fl=firstBad?firstBad.line:0;
    status.dataset.jump=fl||"";
    status.innerHTML = errs? '<span class="err">'+errs+' error'+(errs>1?"s":"")+'</span>'+(warns?' · <span class="warn">'+warns+'</span>':'')+(fl?' <span class="jump">→ go to line '+fl+'</span>':'')
      : warns? '<span class="warn">'+warns+' warning'+(warns>1?"s":"")+'</span>'+(fl?' <span class="jump">→ line '+fl+'</span>':'') : '<span class="ok">✓ no issues</span>';
    syncScroll();
  }
  function jumpToLine(nn){
    const arr=ta.value.split("\n"); let idx=0; for(let i=0;i<nn-1 && i<arr.length;i++) idx+=arr[i].length+1;

  }
  gutter.addEventListener("click", e=>{ const t=e.target.closest("[data-l]"); if(t) jumpToLine(+t.dataset.l); });
  status.addEventListener("click", ()=>{ if(status.dataset.jump) jumpToLine(+status.dataset.jump); });
  ta.addEventListener("input",()=>{ paint(); if(opts.onChange) opts.onChange(ta.value); });
  ta.addEventListener("scroll", syncScroll);
  // Tab / Shift+Tab: indent the selection like VS Code (execInsert keeps native undo)
  function execInsert(txt){ if(!document.execCommand||!document.execCommand("insertText",false,txt)){ const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value; ta.value=v.slice(0,s)+txt+v.slice(e); ta.selectionStart=ta.selectionEnd=s+txt.length; } paint(); if(opts.onChange) opts.onChange(ta.value); }
  ta.addEventListener("keydown", e=>{
    if(e.key!=="Tab") return;
    e.preventDefault();
    const v=ta.value, s=ta.selectionStart, en=ta.selectionEnd;
    if(!e.shiftKey && s===en){ execInsert("\t"); return; }
    const ls=v.lastIndexOf("\n", s-1)+1;
    const effEnd=(en>s && v[en-1]==="\n") ? en-1 : en;
    let le=v.indexOf("\n", effEnd); if(le===-1) le=v.length;
    const block=v.slice(ls,le).split("\n");
    const nb=(e.shiftKey ? block.map(l=> l.startsWith("\t")?l.slice(1):l.replace(/^ {1,4}/,"")) : block.map(l=> l===""?l:"\t"+l)).join("\n");
    ta.selectionStart=ls; ta.selectionEnd=le;
    execInsert(nb);

  });
  const pb=wrap.querySelector("[data-cpick]"); if(pb) pb.onclick=ev=>opts.onPicker&&opts.onPicker(ev.currentTarget, ta);
  ta.value=opts.initial||"";
  requestAnimationFrame(paint);
  return { el:wrap, ta, getValue:()=>ta.value, setValue:v=>{ ta.value=v; paint(); }, refresh:paint };
}

   Full per-focus Script mode — edit the whole focus, synced to the tool
   ===================================================================== */
function focusToScript(f){
  let s="### name: "+(f.name||"")+"\n### desc: "+((f.desc||"").replace(/\n/g,"\\n"))+"\n";
  s+="focus = {\n\tid = "+focusKey(f)+"\n";

  s+="\tx = "+f.x+"\n\ty = "+f.y+"\n";
  if(f.relTo && byId(f.relTo)) s+="\trelative_position_id = "+focusKey(byId(f.relTo))+"\n";
  s+="\tcost = "+(f.cost||0)+"\n";
  if(f.prereqRaw && f.prereqRaw.length) f.prereqRaw.forEach(r=>s+="\tprerequisite = { "+String(r).trim().replace(/\s+/g," ")+" }\n");
  else if(f.prereq && f.prereq.length){ const v=f.prereq.map(byId).filter(Boolean);
    if(f.prereqMode==="any") s+="\tprerequisite = { "+v.map(p=>"focus = "+focusKey(p)).join(" ")+" }\n";
    else v.forEach(p=>s+="\tprerequisite = { focus = "+focusKey(p)+" }\n"); }
  if(f.mutex && f.mutex.length){ const v=f.mutex.map(byId).filter(Boolean); if(v.length) s+="\tmutually_exclusive = { "+v.map(p=>"focus = "+focusKey(p)).join(" ")+" }\n"; }
  if(f.searchFilters && f.searchFilters.length) s+="\tsearch_filters = { "+f.searchFilters.join(" ")+" }\n";
  if(f.willWarWith) s+="\twill_lead_to_war_with = "+f.willWarWith+"\n";
  [["availCap","available_if_capitulated"],["cancelInvalid","cancel_if_invalid"],["contInvalid","continue_if_invalid"],["dynamic","dynamic"]].forEach(p=>{ if(f.flags[p[0]]) s+="\t"+p[1]+" = yes\n"; });
  if((f.allowBranch||"").trim()) s+=block("allow_branch", f.allowBranch, 1);
  if((f.available||"").trim()) s+=block("available", f.available, 1);
  if((f.bypass||"").trim()) s+=block("bypass", f.bypass, 1);
  if((f.selectEffect||"").trim()) s+=block("select_effect", f.selectEffect, 1);
  s+=block("completion_reward", (f.reward||"").trim(), 1);

  if((f.aiWillDo||"").trim()) s+=block("ai_will_do", f.aiWillDo, 1);

}
function scriptToFocus(text, f){
  let name=null, desc=null;
  const nm=/^[ \t]*###[ \t]*name:[ \t]*(.*)$/m.exec(text); if(nm) name=nm[1].trim();
  const dm=/^[ \t]*###[ \t]*desc:[ \t]*(.*)$/m.exec(text); if(dm) desc=dm[1].replace(/\\n/g,"\n");
  const top=pdxEntries(stripComments(text));
  const fe=top.find(e=>e.key==="focus" && e.block!=null);
  if(!fe) return false;
  const nf=parseFocus(fe.block);
  if(!nf.key) return false;
  if(name!=null) f.name=name; if(desc!=null) f.desc=desc;
  ["key","icon","iconBlock","x","y","cost","searchFilters","flags","willWarWith","available","bypass","selectEffect","reward","completeTooltip","aiWillDo","allowBranch","extra","prereqRaw"].forEach(k=>{ f[k]=nf[k]; });
  f.keyEdited=true;
  const keymap={}; P.focuses.forEach(x=>{ if(x.id!==f.id) keymap[focusKey(x)]=x; });
  f.prereq=[]; (nf._pre||[]).forEach(grp=>grp.forEach(k=>{ if(keymap[k] && f.prereq.indexOf(keymap[k].id)<0) f.prereq.push(keymap[k].id); }));
  P.focuses.forEach(x=>{ if(x.mutex) x.mutex=x.mutex.filter(m=>m!==f.id); });
  f.mutex=[]; (nf._mx||[]).forEach(k=>{ if(keymap[k]){ const t=keymap[k]; if(f.mutex.indexOf(t.id)<0) f.mutex.push(t.id); if(t.mutex.indexOf(f.id)<0) t.mutex.push(f.id); } });
  f.relTo = (nf._rel && keymap[nf._rel]) ? keymap[nf._rel].id : "";
  return true;
}

/* ---- branch preview ----
   hiddenFlags is the set of flags currently switched OFF. A branch gated by
   such a flag stays greyed on the canvas even after the preview bar closes,
   until you switch its flag back on. */
let previewBarOpen=false, hiddenFlags=new Set();
function togglePreview(){
  previewBarOpen=!previewBarOpen;
  $("#bPreview").classList.toggle("active", previewBarOpen);
  if(previewBarOpen){ renderPreviewBar(); $("#previewBar").classList.add("on"); }
  else $("#previewBar").classList.remove("on");
  applyPreview();
}
function renderPreviewBar(){
  const bar=$("#previewBar"), flags=P.flags.filter(fl=>fl.key);
  bar.innerHTML='<h5>Preview branches</h5>'+
    (flags.length? flags.map(fl=>'<label><input type="checkbox" data-pf="'+esc(fl.key)+'"'+(hiddenFlags.has(fl.key)?"":" checked")+'> '+esc(fl.key)+'</label>').join("")
      : '<div class="mini">No flags. Add some with ⚑ Flags.</div>')+
    '<div class="mini" style="margin-top:6px">Unchecked = its branch is hidden (stays hidden when you close this).</div>';
  bar.querySelectorAll("[data-pf]").forEach(cb=>cb.onchange=()=>{ if(cb.checked) hiddenFlags.delete(cb.dataset.pf); else hiddenFlags.add(cb.dataset.pf); applyPreview(); });
}
// The set of focuses hidden by the currently-off flags: every focus directly
// gated by an off flag PLUS everything downstream of it. allow_branch hides the
// whole branch in-game, so the preview greys the whole branch too. Downstream is
// walked along prerequisite edges, honouring each focus's all/any mode: an "all"
// focus is blocked if ANY prerequisite is hidden, an "any" focus only if they all are.
function previewHiddenSet(){
  const hidden=new Set();
  P.focuses.forEach(f=>{ const g=branchGate(f); if(g && hiddenFlags.has(g.key)) hidden.add(f.id); });
  if(!hidden.size) return hidden;
  let changed=true;
  while(changed){
    changed=false;
    P.focuses.forEach(f=>{
      if(hidden.has(f.id)) return;
      const pr=(f.prereq||[]).filter(id=>byId(id));
      if(!pr.length) return;
      const blocked = f.prereqMode==="any" ? pr.every(id=>hidden.has(id)) : pr.some(id=>hidden.has(id));
      if(blocked){ hidden.add(f.id); changed=true; }
    });
  }
  return hidden;
}
function applyPreview(){
  const hidden = hiddenFlags.size ? previewHiddenSet() : null;
  document.querySelectorAll(".node").forEach(n=>{
    n.classList.toggle("hidden-preview", !!(hidden && hidden.has(n.dataset.id)));
  });
}

/* ---- global search ---- */
function focusOn(id){
  const f=byId(id); if(!f) return;
  const rect=stage.getBoundingClientRect();
  view.x=rect.width/2-(cellLeft(f.x)+NW/2)*view.z;
  view.y=rect.height/2-(cellTop(f.y)+NH/2)*view.z;
  applyTransform();
}
function searchText(f){
  return [f.name,f.key,f.reward,f.available,f.aiWillDo,f.selectEffect,f.bypass,f.completeTooltip,f.allowBranch,f.extra,(f.searchFilters||[]).join(" ")].join(" ").toLowerCase();
}
function runSearch(q){
  q=(q||"").trim().toLowerCase();
  const res=$("#searchRes");
  document.querySelectorAll(".node.hit").forEach(n=>n.classList.remove("hit"));
  if(!q){ if(res){ res.hidden=true; res.innerHTML=""; } return; }
  const hits=P.focuses.filter(f=>searchText(f).indexOf(q)>=0);
  const spirits=P.ideas.filter(i=>((i.name||"")+" "+ideaKey(i)+" "+(i.mods||[]).map(m=>m.k).join(" ")).toLowerCase().indexOf(q)>=0);
  hits.forEach(f=>{ const n=$('.node[data-id="'+f.id+'"]'); if(n) n.classList.add("hit"); });
  let html="";
  if(!hits.length && !spirits.length) html='<div class="none">No matches.</div>';
  hits.slice(0,80).forEach(f=>{ html+='<div class="sr" data-go="'+f.id+'"><div class="sn">'+esc(f.name||focusKey(f))+(f.external?' <span class="sw">external</span>':'')+'</div><div class="sk">'+esc(focusKey(f))+'</div></div>'; });
  spirits.slice(0,20).forEach(i=>{ html+='<div class="sr" data-spirit="1"><div class="sn">'+esc(i.name||ideaKey(i))+' <span class="sw">spirit</span></div><div class="sk">'+esc(ideaKey(i))+'</div></div>'; });
  res.innerHTML=html; res.hidden=false;
  res.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{ const id=el.dataset.go; select(id); focusOn(id); res.hidden=true; });
  res.querySelectorAll("[data-spirit]").forEach(el=>el.onclick=()=>{ res.hidden=true; openIdeas(); });
}

/* =====================================================================
   15. Wire up + init
   ===================================================================== */
function addFocusAt(px, py){
  const taken={}; P.focuses.forEach(f=>taken[f.x+","+f.y]=1);
  let x,y;
  if(px!=null){ x=Math.max(0,px|0); y=Math.max(0,py|0); while(taken[x+","+y]) x++; }
  else { outer: for(y=0;y<60;y++){ for(x=0;x<24;x++){ if(!taken[x+","+y]) break outer; } } }
  const f=newFocus(x,y); f.reward="add_political_power = 100";
  P.focuses.push(f); select(f.id); activeTab="basic"; renderPanel(); render();
  const el=$("#tabBasic #fName"); if(el) el.focus();
}
function createFocusAtClient(cx, cy){
  const rect=stage.getBoundingClientRect();
  const bx=(cx-rect.left-view.x)/view.z, by=(cy-rect.top-view.y)/view.z;   // board coords
  const gx=Math.round((bx-PAD-(GX-NW)/2)/GX), gy=Math.round((by-PAD-6)/GY);
  addFocusAt(gx, gy);
}
function delMany(ids){
  if(!ids.length) return;
  const set=new Set(ids);
  P.focuses=P.focuses.filter(f=>!set.has(f.id));
  P.focuses.forEach(f=>{ f.prereq=(f.prereq||[]).filter(p=>!set.has(p)); f.mutex=(f.mutex||[]).filter(m=>!set.has(m)); if(set.has(f.relTo)) f.relTo=""; });
  sel=new Set(); selId=null;
  renderPanel(); render();
}
function delFocus(id){ delMany([id]); }
function dupFocus(id){
  const src=byId(id); if(!src) return;
  const c=JSON.parse(JSON.stringify(src)); c.id=uid(); c.x=src.x+1; c.y=src.y; c.prereq=[]; c.mutex=[]; c.keyEdited=false; c.key=""; c.name=src.name?src.name+" copy":"";
  P.focuses.push(c); select(c.id);
}

$("#bAdd").onclick=()=>addFocusAt();
$("#bPre").onclick=()=>setLinkMode("pre");
$("#bMx").onclick=()=>setLinkMode("mx");
$("#bIdeas").onclick=openIdeas;
$("#bFlags").onclick=openFlags;
$("#bPreview").onclick=togglePreview;
$("#searchInput").oninput=e=>runSearch(e.target.value);
$("#searchInput").onkeydown=e=>{
  if(e.key==="Escape"){ e.target.value=""; runSearch(""); e.target.blur(); }
  if(e.key==="Enter"){ const first=$("#searchRes .sr[data-go]"); if(first) first.click(); }
};
document.addEventListener("click", e=>{ if(!e.target.closest("#searchWrap")){ const r=$("#searchRes"); if(r) r.hidden=true; } });
$("#bExport").onclick=()=>exportAll(false);
$("#bImport").onclick=openImport;
$("#bSave").onclick=saveProject;
$("#bOpen").onclick=()=>$("#fileProj").click();
$("#bSettings").onclick=openSettings;
$("#bHelp").onclick=openHelp;
$("#pDel").onclick=()=>{ if(selId) delFocus(selId); };
$("#pDup").onclick=()=>{ if(selId) dupFocus(selId); };
$("#pmDel").onclick=()=>{ if(sel.size) delMany([...sel]); };
$$(".tab").forEach(t=> t.onclick=()=>{ activeTab=t.dataset.tab; renderPanel(); });

$("#mMod").oninput=e=>{ P.meta.mod=e.target.value; persist(); };
$("#mTag").oninput=e=>{ P.meta.tag=e.target.value; if(selId){ const kf=$("#fKey"); const f=byId(selId); if(f&&!f.keyEdited&&kf){ kf.value=focusKey(f); $("#pKeyEcho").textContent=f.key; } } render(); };
$("#mStart").oninput=e=>{ P.meta.start=e.target.value; if(selId)refreshDerived(byId(selId)); render(); };
$("#mDpc").oninput=e=>{ P.meta.dpc=clampInt(e.target.value,1,60,7); if(selId)refreshDerived(byId(selId)); render(); };
$("#mDpc").onchange=e=>{ e.target.value=P.meta.dpc; };

$("#zIn").onclick=()=>{ const r=stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.15); };
$("#zOut").onclick=()=>{ const r=stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1/1.15); };
$("#zFit").onclick=fitView;

document.addEventListener("keydown", e=>{
  const t=e.target.tagName, typing=(t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable);
  // Ctrl/Cmd+S — no typing guard, so it fires while editing in the code window too:
  // stop the browser "save page" dialog and confirm that the tool already autosaved
  if((e.ctrlKey||e.metaKey) && (e.key==="s"||e.key==="S")){ e.preventDefault(); flashSaved(); return; }
  // undo / redo — leave text fields to the browser's own undo
  if((e.ctrlKey||e.metaKey) && (e.key==="z"||e.key==="Z") && !typing){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
  if((e.ctrlKey||e.metaKey) && (e.key==="y"||e.key==="Y") && !typing){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey) && (e.key==="a"||e.key==="A") && !typing){ e.preventDefault(); selectAll(); return; }
  if(e.key==="Escape"){ if(linkMode){ setLinkMode(linkMode); } closePicker(); if(sel.size) deselectAll(); }
  if((e.key==="Delete"||e.key==="Backspace") && sel.size && !typing){
    e.preventDefault(); delMany([...sel]);
  }
  if((e.key==="n"||e.key==="N"||e.key==="Insert") && P.settings.newFocus==="key" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault(); addFocusAt();
  }
});

/* boot */
(function init(){
  const had=loadSaved();
  if(!had){
    // seed a tiny example so the canvas isn't intimidatingly blank
    const a=newFocus(2,0); a.name="Rebuild the Nation"; a.icon="GFX_goal_generic_construct_civ_factory"; a.cost=5; a.reward="add_political_power = 100\nadd_stability = 0.05";
    const b=newFocus(2,1); b.name="Industrial Effort"; b.icon="GFX_goal_generic_production"; b.cost=7; b.prereq=[a.id]; b.reward="add_tech_bonus = {\n\tname = industry_bonus\n\tbonus = 0.5\n\tuses = 1\n\tcategory = industry\n}";
    P.focuses=[a,b];
  }
  applySettings(); syncTopbar(); render(); renderPanel(); fitView();
  pushHist();   // seed the undo history with the starting state
})();
</script>
