<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Tree Creator — The American Dream</title>
<meta name="description" content="Design Hearts of Iron IV national focus trees on a visual grid — dates, effects, modifiers, imported icons with shine — and export a ready-to-drop mod ZIP.">
<style>
:root{
  --paper:#F5F6F2; --card:#FFFFFF; --sunk:#EFF1EC; --board:#E7E9E2;
  --ink:#14171A; --ink2:#5A6169; --ink3:#8A9199;
  --line:#DEE1DA; --line2:#C9CDC3;
  --accent:#1F3A5F; --accent2:#2E5C8A; --gold:#8A6A18; --ok:#3E6B4A; --warn:#8A6A18; --bad:#A33A2A;
  --prereq:#5A6169; --mutex:#A33A2A;
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:var(--font-mono)}

/* ---------- layout ---------- */
.app{display:flex; flex-direction:column; height:100vh; overflow:hidden}
.topbar{
  display:flex; align-items:center; gap:10px; padding:8px 12px;
  background:var(--card); border-bottom:1px solid var(--line); flex:0 0 auto; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:8px; margin-right:6px}
.brand b{font-size:15px; letter-spacing:.2px}
.brand span{font-size:11px; color:var(--ink3)}
.topbar .field{display:flex; align-items:center; gap:5px}
.topbar .field label{font-size:11px; color:var(--ink2); text-transform:uppercase; letter-spacing:.4px}
.topbar input{
  background:var(--sunk); border:1px solid var(--line); border-radius:var(--r);
  padding:5px 7px; min-width:0;
}
.topbar input.tag{width:52px; text-transform:uppercase; text-align:center; font-family:var(--font-mono)}
.topbar input.date{width:82px; font-family:var(--font-mono)}
.topbar input.name{width:150px}
.topbar input.num{width:48px; text-align:center}
.spacer{flex:1 1 auto}
.btn{
  background:var(--card); border:1px solid var(--line2); border-radius:var(--r);
  padding:6px 11px; font-size:13px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2); color:#fff}
.btn.active{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk); color:var(--accent)}
.btn.sm{padding:3px 8px; font-size:12px}
.btn.danger:hover{border-color:var(--bad); color:var(--bad)}

/* ---------- body split ---------- */
.body{flex:1 1 auto; display:flex; min-height:0}
.stage{flex:1 1 auto; position:relative; overflow:hidden; background:var(--board); cursor:grab}
.stage.panning{cursor:grabbing; user-select:none}
.panel{
  flex:0 0 380px; max-width:44vw; background:var(--card); border-left:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
/* panel on the left instead of the right */
.body.panel-left{flex-direction:row-reverse}
.body.panel-left .panel{border-left:none; border-right:1px solid var(--line)}
/* hide the per-focus date line */
.board.nodates .node .meta{display:none}
/* dark theme — redefine the palette on body so modals/toasts inherit it too */
body.theme-dark{
  --paper:#171a1e; --card:#20252c; --sunk:#1a1f25; --board:#12151a;
  --ink:#e8ebef; --ink2:#a7afba; --ink3:#77808b;
  --line:#2f363f; --line2:#3d454f;
  --accent:#5b8fd6; --accent2:#7aa7e6; --prereq:#8b939d;
}
body.theme-dark .node{box-shadow:0 1px 2px rgba(0,0,0,.4)}
body.theme-dark .btn.primary{color:#0d1116}

/* ---------- board / canvas ---------- */
.board{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
.grid-bg{position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(0,0,0,.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,.045) 1px, transparent 1px);
}
svg.links{position:absolute; inset:0; pointer-events:none; overflow:visible}
.node{
  position:absolute; width:104px; height:98px; background:var(--card);
  border:1px solid var(--line2); border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.06);
  display:flex; flex-direction:column; align-items:center; padding:6px 4px 4px; cursor:grab; user-select:none;
  transition:border-color .1s, box-shadow .1s;
}
.node:hover{border-color:var(--accent2)}
.node.sel{border-color:var(--accent); box-shadow:0 0 0 2px rgba(31,58,95,.25)}
.node.primary{box-shadow:0 0 0 3px rgba(31,58,95,.45)}
.marquee{position:absolute; z-index:55; border:1.5px solid var(--accent); background:rgba(31,58,95,.12); border-radius:2px; pointer-events:none}
.mstats{display:flex; flex-direction:column; margin-bottom:6px}
.mstat{display:flex; justify-content:space-between; gap:10px; padding:6px 9px; border:1px solid var(--line); border-top:none; font-size:13px}
.mstat:first-child{border-top:1px solid var(--line); border-radius:var(--r) var(--r) 0 0}
.mstat:last-child{border-radius:0 0 var(--r) var(--r)}
.mstat span{color:var(--ink2)}
.mstat b{font-family:var(--font-mono)}
.mstat b.pos{color:var(--ok)} .mstat b.neg{color:var(--bad)}
.node.linksrc{border-color:var(--gold); box-shadow:0 0 0 2px rgba(138,106,24,.35)}
.node.dragging{cursor:grabbing; opacity:.9; z-index:50}
.node .ic{width:48px; height:48px; display:flex; align-items:center; justify-content:center;
  background:var(--sunk); border-radius:6px; overflow:hidden; flex:0 0 auto}
.node .ic img{width:100%; height:100%; object-fit:contain; image-rendering:auto;
  -webkit-user-drag:none; user-drag:none; pointer-events:none; user-select:none}
.node, .node *{ -webkit-user-drag:none; user-drag:none }
.node .ic .ph{font-size:9px; color:var(--ink3); text-align:center; line-height:1.1; padding:2px; word-break:break-all}
.node .nm{font-size:11px; font-weight:600; text-align:center; margin-top:3px; line-height:1.12;
  max-height:26px; overflow:hidden; width:100%}
.node .meta{font-size:9.5px; color:var(--ink2); margin-top:auto; font-family:var(--font-mono)}
.node .badge{position:absolute; top:-7px; right:-7px; background:var(--gold); color:#fff;
  font-size:9px; border-radius:8px; padding:1px 5px; display:none;
  max-width:96px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.node.hasadv .badge{display:block}
.node .planbadge{position:absolute; top:-6px; left:-6px; width:12px; height:12px; border-radius:50%;
  background:var(--ok); border:2px solid var(--card); display:none}
.node.planned .planbadge{display:block}
.node.external{border-style:dashed; opacity:.7; background:var(--sunk)}
.node.external .nm{font-style:italic}
.board.tallnodes .node{height:auto; min-height:98px; padding-bottom:8px}
.board.tallnodes .node .nm{max-height:none; overflow:visible}
.node.hit{box-shadow:0 0 0 3px var(--gold)}
.node.hidden-preview{opacity:.22}
.panel{position:relative}
.panel-grip{position:absolute; top:0; bottom:0; left:-3px; width:7px; cursor:col-resize; z-index:6}
.panel-grip:hover, .panel-grip.on{background:var(--accent2); opacity:.35}
.body.panel-left .panel-grip{left:auto; right:-3px}
.searchwrap{position:relative}
.search-in{background:var(--sunk); border:1px solid var(--line); border-radius:14px; padding:6px 12px; width:210px}
.search-res{position:absolute; top:120%; left:0; z-index:70; width:340px; max-width:80vw; max-height:360px; overflow:auto;
  background:var(--card); border:1px solid var(--line2); border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.22)}
.search-res .sr{padding:7px 10px; cursor:pointer; border-top:1px solid var(--line)}
.search-res .sr:first-child{border-top:none}
.search-res .sr:hover, .search-res .sr.hl{background:var(--sunk)}
.search-res .sr .sn{font-size:13px; font-weight:600}
.search-res .sr .sk{font-family:var(--font-mono); font-size:11px; color:var(--ink3)}
.search-res .sr .sw{font-size:11px; color:var(--accent2)}
.search-res .none{padding:10px; color:var(--ink3); font-size:12px}
.flagchip{display:inline-flex; align-items:center; gap:6px; padding:6px 8px; border:1px solid var(--line); border-radius:var(--r); margin:0 0 6px 0; width:100%}
.flagchip .fk{font-family:var(--font-mono); font-size:12px; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.flagchip .fs{font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink3)}
.previewbar{position:absolute; left:12px; top:12px; z-index:40; background:var(--card); border:1px solid var(--line2);
  border-radius:8px; padding:8px 10px; box-shadow:0 2px 10px rgba(0,0,0,.15); max-width:260px; display:none}
.previewbar.on{display:block}
.previewbar h5{margin:0 0 6px; font-size:12px}
.previewbar label{display:flex; gap:7px; align-items:center; font-size:12px; margin:3px 0; font-family:var(--font-mono)}
/* ---- code editor ---- */
:root{ --syn-com:#8A9199; --syn-str:#3E6B4A; --syn-num:#A9581F; --syn-eff:#2E5C8A; --syn-trig:#8A6A18; --syn-mod:#7A3FA0; --syn-tag:#A33A2A; --syn-bool:#3E6B4A; --syn-punct:#8A9199; }
body.theme-dark{ --syn-com:#7b838d; --syn-str:#7bc994; --syn-num:#e0a45f; --syn-eff:#7aa7e6; --syn-trig:#d8b45c; --syn-mod:#c79ce8; --syn-tag:#e79080; --syn-bool:#7bc994; --syn-punct:#8b939d; }
.code{display:flex; flex-direction:column; height:100%; min-height:0; width:100%; border:1px solid var(--line2); border-radius:var(--r); overflow:hidden; background:var(--card)}
.code-toolbar{display:flex; align-items:center; gap:8px; padding:6px 8px; border-bottom:1px solid var(--line); background:var(--sunk); flex:0 0 auto}
.code-status{margin-left:auto; font-size:12px}
.code-status .err{color:var(--bad); font-weight:600} .code-status .warn{color:var(--warn); font-weight:600} .code-status .ok{color:var(--ok)}
.code-body{flex:1 1 auto; display:flex; min-height:0; position:relative; font-family:var(--font-mono); font-size:12.5px; line-height:1.55}
.code-gutter{flex:0 0 auto; width:44px; overflow:hidden; text-align:right; color:var(--ink3); background:var(--sunk); border-right:1px solid var(--line); padding:8px 6px 8px 0; white-space:pre; user-select:none}
.code-gutter .gl{display:block}
.code-gutter .gl.e{color:var(--bad); font-weight:700} .code-gutter .gl.w{color:var(--warn); font-weight:700}
.code-gutter .gl.e, .code-gutter .gl.w{cursor:pointer}
.code-status{cursor:pointer}
.code-status .jump{color:var(--accent2); text-decoration:underline}
.code-editarea{flex:1 1 auto; position:relative; overflow:hidden}
.code-hl, .code-ta{margin:0; border:0; padding:8px 10px; font:inherit; line-height:inherit; white-space:pre; tab-size:4; -moz-tab-size:4; position:absolute; inset:0; box-sizing:border-box}
.code-hl{pointer-events:none; color:var(--ink); background:transparent; overflow:hidden}
.code-hl code{font:inherit; white-space:pre}
.code-ta{background:transparent; color:transparent; caret-color:var(--ink); resize:none; outline:none; overflow:auto}
.code-ta::selection{background:rgba(46,92,138,.28)}
.tok-com{color:var(--syn-com); font-style:italic} .tok-str{color:var(--syn-str)} .tok-num{color:var(--syn-num)}
.tok-eff{color:var(--syn-eff); font-weight:600} .tok-trig{color:var(--syn-trig); font-weight:600} .tok-mod{color:var(--syn-mod); font-weight:600}
.tok-tag{color:var(--syn-tag); font-weight:600} .tok-bool{color:var(--syn-bool)} .tok-punct{color:var(--syn-punct)}
.code-legend{flex:0 0 auto; font-size:10px; color:var(--ink3); padding:4px 8px; border-top:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap}

.stage-hint{position:absolute; left:50%; top:40%; transform:translate(-50%,-50%);
  text-align:center; color:var(--ink3); font-size:14px; pointer-events:none; width:70%}
.stage-hint b{color:var(--ink2)}
.linkbanner{position:sticky; top:0; z-index:60; margin:0; padding:7px 12px; text-align:center;
  background:var(--gold); color:#fff; font-size:13px; display:none}
.linkbanner.on{display:block}
.zoombar{position:absolute; right:12px; bottom:12px; z-index:40; background:var(--card);
  border:1px solid var(--line2); border-radius:20px; padding:4px 6px; display:flex; align-items:center; gap:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoombar button{border:none; background:transparent; width:26px; height:26px; border-radius:50%; font-size:15px}
.zoombar button:hover{background:var(--sunk)}
.zoombar span{font-size:11px; color:var(--ink2); min-width:38px; text-align:center; font-family:var(--font-mono)}

/* ---------- side panel ---------- */
.panel .ph-empty{padding:26px 18px; color:var(--ink3); font-size:13px; text-align:center}
.panel-head{padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; flex:0 0 auto}
.panel-head .ptitle{font-weight:600; font-size:13px}
.tabs{display:flex; gap:2px; padding:8px 12px 0; flex:0 0 auto}
.tab{padding:6px 12px; font-size:12.5px; border:1px solid transparent; border-bottom:none;
  border-radius:6px 6px 0 0; color:var(--ink2); background:transparent}
.tab.on{background:var(--sunk); color:var(--ink); border-color:var(--line)}
.tab .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gold); margin-left:5px; vertical-align:middle; opacity:0}
.tab.hasadv .dot{opacity:1}
.panel-scroll{flex:1 1 auto; overflow:auto; padding:12px 14px 40px; border-top:1px solid var(--line)}
.fld{margin-bottom:13px}
.fld > label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink2); margin-bottom:4px}
.fld .hint{font-size:11px; color:var(--ink3); margin-top:3px; line-height:1.35}
.inp, textarea.inp, select.inp{
  width:100%; background:var(--sunk); border:1px solid var(--line); border-radius:var(--r); padding:7px 8px;
}
textarea.inp{resize:vertical; font-family:var(--font-mono); font-size:12.5px; line-height:1.5; min-height:64px; white-space:pre}
.row2{display:flex; gap:8px}
.row2 > *{flex:1 1 0; min-width:0}
.inline{display:flex; align-items:center; gap:8px}
.iconpick{display:flex; align-items:center; gap:10px}
.iconpick .prev{width:56px; height:56px; background:var(--sunk); border:1px solid var(--line); border-radius:6px;
  display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto}
.iconpick .prev img{width:100%; height:100%; object-fit:contain}
.iconpick .prev .ph{font-size:8px; color:var(--ink3); text-align:center; padding:2px; word-break:break-all}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:2px}
.chip{display:inline-flex; align-items:center; gap:5px; background:var(--sunk); border:1px solid var(--line);
  border-radius:14px; padding:3px 6px 3px 9px; font-size:12px; font-family:var(--font-mono)}
.chip button{border:none; background:transparent; color:var(--ink3); font-size:14px; line-height:1; padding:0 2px}
.chip button:hover{color:var(--bad)}
.chip.mx{border-color:#e3c9c4; background:#f8ecea}
.derived{background:var(--sunk); border:1px solid var(--line); border-radius:var(--r); padding:8px 10px; font-size:12px}
.derived b{font-family:var(--font-mono); color:var(--accent)}
.seg{display:inline-flex; border:1px solid var(--line2); border-radius:var(--r); overflow:hidden}
.seg button{border:none; background:var(--card); padding:4px 10px; font-size:12px}
.seg button.on{background:var(--accent); color:#fff}
.checkline{display:flex; align-items:center; gap:7px; font-size:13px; margin:6px 0}
.checkline input{width:15px; height:15px}
.mini{font-size:11px; color:var(--ink3)}
.fx-tools{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:5px}
details.adv-sub{border:1px solid var(--line); border-radius:var(--r); margin-bottom:11px; background:var(--sunk)}
details.adv-sub > summary{padding:7px 10px; font-size:12.5px; font-weight:600; cursor:pointer; list-style:none}
details.adv-sub > summary::-webkit-details-marker{display:none}
details.adv-sub > summary::before{content:"▸ "; color:var(--ink3)}
details.adv-sub[open] > summary::before{content:"▾ "}
details.adv-sub .adv-body{padding:0 10px 10px}
.filtergrid{display:grid; grid-template-columns:1fr 1fr; gap:3px 10px}
.filtergrid label{font-size:12px; display:flex; gap:6px; align-items:center}

/* ---------- picker dropdown ---------- */
.pick{position:absolute; z-index:500; width:340px; max-width:90vw; background:var(--card);
  border:1px solid var(--line2); border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.22); overflow:hidden}
.pick-top{padding:8px; border-bottom:1px solid var(--line)}
.pick-top input{width:100%; background:var(--sunk); border:1px solid var(--line); border-radius:var(--r); padding:7px 9px}
.pick-list{max-height:320px; overflow:auto}
.pick-grp{padding:6px 10px 2px; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink3);
  position:sticky; top:0; background:var(--card)}
.pick-item{padding:6px 10px; cursor:pointer; border-top:1px solid var(--line)}
.pick-item:hover, .pick-item.hl{background:var(--sunk)}
.pick-item .pn{font-family:var(--font-mono); font-size:12.5px; color:var(--accent)}
.pick-item .pd{font-size:11.5px; color:var(--ink2); line-height:1.3}

/* ---------- modal ---------- */
.veil{position:fixed; inset:0; background:rgba(20,23,26,.42); z-index:300; display:flex; align-items:center; justify-content:center; padding:24px}
.modal{background:var(--card); border-radius:10px; width:760px; max-width:96vw; max-height:90vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.modal-h h3{margin:0; font-size:15px}
.modal-b{padding:14px 16px; overflow:auto}
.modal-f{padding:11px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; align-items:center}

/* icon library grid */
.iconsearch{display:flex; gap:8px; margin-bottom:10px}
.iconsearch input{flex:1 1 auto; background:var(--sunk); border:1px solid var(--line); border-radius:var(--r); padding:8px 10px}
.icongrid{height:min(58vh,460px); overflow:auto; position:relative}
.icontile{border:1px solid var(--line); border-radius:6px; padding:6px 4px; text-align:center; cursor:pointer; background:var(--sunk); overflow:hidden}
.icontile:hover{border-color:var(--accent); background:var(--card)}
.icontile.sel{border-color:var(--accent); box-shadow:0 0 0 2px rgba(31,58,95,.2)}
.icontile .box{width:100%; height:52px; display:flex; align-items:center; justify-content:center; background:var(--board); border-radius:4px; margin-bottom:4px; overflow:hidden}
.icontile .box img{max-width:100%; max-height:100%; object-fit:contain}
.icontile .box .g{font-size:9px; color:var(--ink3); padding:3px; word-break:break-all; line-height:1.15}
.icontile .cap{font-size:10px; color:var(--ink2); font-family:var(--font-mono); word-break:break-all; line-height:1.1; max-height:24px; overflow:hidden}
.libcount{font-size:11px; color:var(--ink3); margin-left:auto}

/* ideas manager */
.idea-card{border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; background:var(--sunk)}
.idea-card .ihead{display:flex; gap:8px; align-items:center; margin-bottom:8px}
.mod-row{display:flex; gap:6px; align-items:center; margin:4px 0}
.mod-row .mk{flex:1 1 auto; font-family:var(--font-mono); font-size:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:5px 7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mod-row input{width:78px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:5px 6px; font-family:var(--font-mono); text-align:right}

/* toast */
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:9px 16px; border-radius:20px; font-size:13px; z-index:400; box-shadow:0 6px 24px rgba(0,0,0,.3)}
.issue{border:1px solid var(--line); border-left-width:3px; border-radius:var(--r); padding:8px 10px; margin-bottom:7px; font-size:13px; background:var(--card)}
.issue.error{border-left-color:var(--bad)}
.issue.warn{border-left-color:var(--warn)}
.issue.info{border-left-color:var(--accent2)}

/* ---- undo / redo: snapshots hooked into every autosave ---- */
let hist=[], hp=-1, histTimer=null, restoring=false, selUndo=null;
// Clearing the selection isn't a data change, so it never hits the history
// stack — but an accidental deselect still feels undoable. Remember what was
// selected (and the data snapshot at the time) so the next undo can put it back,
// as long as nothing else has changed since.
function deselectAll(){
  if(sel.size){ flushHist(); selUndo={ ids:[...sel], selId, snap:JSON.stringify(P) }; }
  select(null);
}
function pushHist(){
  const snap=JSON.stringify(P);
  if(hp>=0 && hist[hp]===snap) return;          // nothing changed
  hist=hist.slice(0,hp+1); hist.push(snap); hp=hist.length-1;
  if(hist.length>80){ hist.shift(); hp--; }
}
function pushHistSoon(){ clearTimeout(histTimer); histTimer=setTimeout(()=>{ histTimer=null; pushHist(); }, 400); }
function flushHist(){ if(histTimer){ clearTimeout(histTimer); histTimer=null; pushHist(); } }
function restoreHist(snap){
  restoring=true;
  const keep=selId;
  P=normalize(JSON.parse(snap));
  selId=P.focuses.some(f=>f.id===keep)?keep:null;
  sel=selId?new Set([selId]):new Set();
  try{ store.set(SAVE_KEY, JSON.stringify(P)); }catch(e){}
  applySettings(); syncTopbar(); render(); renderPanel();
  restoring=false;
}
function undo(){
  flushHist();
  // if the last thing that happened was a deselect (nothing changed since), undo
  // puts the selection back rather than reaching for the previous data change
  if(selUndo && !sel.size && JSON.stringify(P)===selUndo.snap && selUndo.ids.every(id=>P.focuses.some(f=>f.id===id))){
    sel=new Set(selUndo.ids);
    selId=(selUndo.selId && P.focuses.some(f=>f.id===selUndo.selId)) ? selUndo.selId : ([...sel].pop()||null);
    selUndo=null; renderPanel(); render(); toast("Reselected"); return;
  }
  selUndo=null;
  if(hp>0){ hp--; restoreHist(hist[hp]); toast("Undo"); } else toast("Nothing to undo");
}
function redo(){ if(hp<hist.length-1){ hp++; restoreHist(hist[hp]); toast("Redo"); } else toast("Nothing to redo"); }
function loadSaved(){
  const raw=store.get(SAVE_KEY) || store.get(SAVE_KEY_OLD); if(!raw) return false;
  try{
    const j=JSON.parse(raw);
    if(j && j.focuses){ P = normalize(j); return true; }
  }catch(e){}
  return false;
}
function normalize(j){
  const m=Object.assign(defMeta(), j.meta||{});
  const icons=j.icons||{};
  const focuses=(j.focuses||[]).map(f=>Object.assign(newFocus(f.x||0,f.y||0), f, {
    flags:Object.assign({availCap:false,cancelInvalid:false,contInvalid:false,dynamic:false}, f.flags||{}),
    searchFilters:f.searchFilters||[], prereq:f.prereq||[], mutex:f.mutex||[],
    vars:Object.assign({aprOn:false,apr:5,chaosOn:false,chaos:5}, f.vars||{}), plan:!!f.plan
  }));
  const ideas=(j.ideas||[]).map(i=>Object.assign(newIdea(), i, { mods:i.mods||[] }));
  const settings=Object.assign(defSettings(), j.settings||{});
  const flags=Array.isArray(j.flags)?j.flags:[];
  return { meta:m, focuses, ideas, icons, flags, settings };
}

function computeDates(){
  const dpc=Math.max(1, P.meta.dpc||7);
  const base=parseDate(P.meta.start)||{y:1936,mo:1,d:1};
  const memo={};
  function rec(id, stack){
    if(memo[id]!=null) return memo[id];
    const f=byId(id); if(!f) return 0;
    if(stack.has(id)) return (f.cost||0)*dpc;
    stack.add(id);
    const pre=(f.prereq||[]).filter(pid=>byId(pid));
    let b=0;
    if(pre.length){
      const vals=pre.map(pid=>rec(pid,stack));
      b = f.prereqMode==="any" ? Math.min.apply(null,vals) : Math.max.apply(null,vals);
    }
    stack.delete(id);
    const t=b+(f.cost||0)*dpc; memo[id]=t; return t;
  }
  const out={};
  P.focuses.forEach(f=>{
    const total=rec(f.id,new Set());
    out[f.id]={ days:(f.cost||0)*dpc, total:total, finish:addDays(base,total) };
  });
  return out;
}
function parseDate(s){ const m=/^\s*(\d+)\.(\d+)\.(\d+)/.exec(String(s||"")); return m?{y:+m[1],mo:+m[2],d:+m[3]}:null; }
function addDays(base,days){
  const dt=new Date(Date.UTC(base.y,base.mo-1,base.d));
  dt.setUTCDate(dt.getUTCDate()+Math.round(days));
  return dt.getUTCFullYear()+"."+(dt.getUTCMonth()+1)+"."+dt.getUTCDate();
}

let DATES={};
function advBeyondFilters(f){
  // "advanced" in the labelling sense — everything except search filters and
  // relative positioning (which is just layout, not an option)
  return !!(f.available||f.aiWillDo||f.selectEffect||f.bypass||f.completeTooltip||
    f.willWarWith||f.allowBranch||
    (f.flags&&(f.flags.availCap||f.flags.cancelInvalid||f.flags.contInvalid||f.flags.dynamic)));
}
function focusHasAdv(f){ return advBeyondFilters(f) || (f.searchFilters&&f.searchFilters.length>0); }
const SF_LABELS = (()=>{ const m={}; SEARCH_FILTERS.forEach(([c,l])=>m[c]=l); return m; })();
function filterNames(f){
  return (f.searchFilters||[]).map(c=> SF_LABELS[c] || c.replace(/^FOCUS_FILTER_/,"").toLowerCase().replace(/_/g," "));
}
/* what to show on the Advanced tab / node badge, per the advLabel setting */
function advLabelText(f, short){
  const names=filterNames(f), other=advBeyondFilters(f);
  const ftxt = names.length ? (short ? names[0].toLowerCase()+(names.length>1?"+"+(names.length-1):"") : names[0]+(names.length>1?" +"+(names.length-1):"")) : "";
  const adv = short ? "adv" : "Advanced";
  const mode = P.settings.advLabel || "auto";
  if(mode==="advanced") return adv;
  if(mode==="filter")   return ftxt || adv;
  if(mode==="both")     return ftxt ? (other ? ftxt+(short?" adv":" · Advanced") : ftxt) : adv;
  /* auto */            return (names.length && !other) ? ftxt : adv;
}

function nodeAnchor(f, which){
  const l=cellLeft(f.x), t=cellTop(f.y);
  if(which==="top") return {x:l+NW/2, y:t};
  if(which==="bottom") return {x:l+NW/2, y:t+NH};
  if(which==="left") return {x:l, y:t+NH/2};
  if(which==="right") return {x:l+NW, y:t+NH/2};
  return {x:l+NW/2, y:t+NH/2};
}
function drawLinks(){
  const svg=$("#links");
  let maxX=6,maxY=4; P.focuses.forEach(f=>{ maxX=Math.max(maxX,f.x); maxY=Math.max(maxY,f.y); });
  svg.setAttribute("width", cellLeft(maxX+2)); svg.setAttribute("height", cellTop(maxY+2));
  let s="";
  // prerequisite links: parent bottom -> child top (elbow).
  // "all of them" (AND): solid separate lines, filled dot.
  // "any one" (OR): dashed lines that converge to a shared junction, hollow dot.
  P.focuses.forEach(child=>{
    const pre=(child.prereq||[]).map(byId).filter(Boolean);
    if(!pre.length) return;
    const b=nodeAnchor(child,"top");
    const isOr = child.prereqMode==="any" && pre.length>1;
    if(isOr){
      const jy=b.y-18;                                   // junction just above the child
      s+='<path d="M '+b.x+' '+jy+' L '+b.x+' '+b.y+'" fill="none" stroke="var(--prereq)" stroke-width="2"/>';
      pre.forEach(parent=>{
        const a=nodeAnchor(parent,"bottom");
        const midY=Math.min((a.y+jy)/2, jy);
        s+='<path d="M '+a.x+' '+a.y+' L '+a.x+' '+midY+' L '+b.x+' '+midY+' L '+b.x+' '+jy+
           '" fill="none" stroke="var(--prereq)" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>';
      });
      s+='<circle cx="'+b.x+'" cy="'+b.y+'" r="3.5" fill="var(--card)" stroke="var(--prereq)" stroke-width="1.6"/>';
    }else{
      pre.forEach(parent=>{
        const a=nodeAnchor(parent,"bottom");
        const midY=(a.y+b.y)/2;
        s+='<path d="M '+a.x+' '+a.y+' L '+a.x+' '+midY+' L '+b.x+' '+midY+' L '+b.x+' '+b.y+
           '" fill="none" stroke="var(--prereq)" stroke-width="2" stroke-linejoin="round"/>';
      });
      s+='<circle cx="'+b.x+'" cy="'+b.y+'" r="3" fill="var(--prereq)"/>';
    }
  });
  // mutex links (draw each pair once)
  const seen={};
  P.focuses.forEach(f=>{
    (f.mutex||[]).forEach(oid=>{
      const key=[f.id,oid].sort().join("|"); if(seen[key])return; seen[key]=1;
      const o=byId(oid); if(!o)return;
      const a=nodeAnchor(f, f.x<=o.x?"right":"left");
      const b=nodeAnchor(o, f.x<=o.x?"left":"right");
      s+='<path d="M '+a.x+' '+a.y+' L '+b.x+' '+b.y+'" fill="none" stroke="var(--mutex)" stroke-width="2" stroke-dasharray="5 4"/>';
    });
  });
  svg.innerHTML=s;
}

/* =====================================================================
   6b. Multi-select panel — smart auto-sum + bulk edit
   ===================================================================== */
const STAT_FX = [
  ["add_political_power","Political power"], ["add_stability","Stability"],
  ["add_war_support","War support"], ["add_manpower","Manpower"],
  ["add_command_power","Command power"], ["army_experience","Army XP"],
  ["navy_experience","Navy XP"], ["air_experience","Air XP"],
  ["add_research_slot","Research slots"]
];
function sumEffect(text, name){
  const rx=new RegExp("(?:^|[^A-Za-z0-9_])"+name+"\\s*=\\s*(-?\\d+(?:\\.\\d+)?)","g");
  let m,n=0,hit=false; while((m=rx.exec(String(text||"")))){ n+=parseFloat(m[1]); hit=true; }
  return hit?n:null;
}
function fmtNum(n){ return (Math.round(n*1000)/1000).toString(); }
function renderMulti(){
  const ids=[...sel], fs=ids.map(byId).filter(Boolean);
  $("#pmTitle").textContent=fs.length+" focuses selected";
  const dpc=Math.max(1,P.meta.dpc||7);
  let totalCost=0, minTot=Infinity, maxTot=-Infinity, minStr="", maxStr="", apr=0, chaos=0, aprN=0, chaosN=0;
  const stats={};
  fs.forEach(f=>{
    totalCost+=(f.cost||0);
    const d=DATES[f.id];
    if(d){ if(d.total<minTot){minTot=d.total; minStr=d.finish;} if(d.total>maxTot){maxTot=d.total; maxStr=d.finish;} }
    if(P.settings.aprchaos && f.vars){ if(f.vars.aprOn){apr+=Number(f.vars.apr)||0; aprN++;} if(f.vars.chaosOn){chaos+=Number(f.vars.chaos)||0; chaosN++;} }
    STAT_FX.forEach(([k])=>{ const v=sumEffect(f.reward,k); if(v!=null) stats[k]=(stats[k]||0)+v; });
  });
  let rows='<div class="mstat"><span>Focuses</span><b>'+fs.length+'</b></div>'+
    '<div class="mstat"><span>Total cost</span><b>'+totalCost+' pts · '+(totalCost*dpc)+' days</b></div>';
  if(minStr) rows+='<div class="mstat"><span>Completes</span><b>'+esc(minStr)+(minStr!==maxStr?" → "+esc(maxStr):"")+'</b></div>';
  if(P.settings.aprchaos && aprN) rows+='<div class="mstat"><span>Approval Δ</span><b class="'+(apr>=0?"pos":"neg")+'">'+(apr>=0?"+":"")+fmtNum(apr)+'</b></div>';
  if(P.settings.aprchaos && chaosN) rows+='<div class="mstat"><span>Chaos Δ</span><b class="'+(chaos<=0?"pos":"neg")+'">'+(chaos>=0?"+":"")+fmtNum(chaos)+'</b></div>';
  STAT_FX.forEach(([k,label])=>{ if(stats[k]) rows+='<div class="mstat"><span>'+esc(label)+'</span><b>'+(stats[k]>0?"+":"")+fmtNum(stats[k])+'</b></div>'; });

  const plannedAll=fs.length&&fs.every(f=>f.plan), plannedNone=fs.every(f=>!f.plan);
  let bulk='<div class="fld"><label>Show on the story-planner timeline</label>'+
    '<div class="inline"><button class="btn sm" id="bmPlanOn">Add all</button><button class="btn sm" id="bmPlanOff">Remove all</button>'+
    '<span class="mini">'+(plannedAll?"all shown":plannedNone?"none":"mixed")+'</span></div></div>'+
    '<div class="fld"><label>Search filters (applied to all)</label><div class="filtergrid">'+
      SEARCH_FILTERS.map(sf=>{ const cnt=fs.filter(f=>(f.searchFilters||[]).indexOf(sf[0])>=0).length;
        return '<label><input type="checkbox" data-bsf="'+sf[0]+'"'+(cnt===fs.length&&cnt?" checked":"")+'>'+esc(sf[1])+'</label>'; }).join("")+
    '</div></div>';
  if(P.settings.bulkCost) bulk+='<div class="fld"><label>Cost</label><div class="inline"><input class="inp mono" id="bmCostN" style="width:70px; flex:0 0 auto" placeholder="pts"><button class="btn sm" id="bmCost">Apply to all</button></div></div>';
  if(P.settings.bulkMutex){
    const idset=new Set(ids), linked=fs.some(f=>(f.mutex||[]).some(m=>idset.has(m)));
    bulk+='<div class="fld"><label>Mutually exclusive</label><div class="inline">'+
      '<button class="btn sm" id="bmMx">Make these a group</button>'+
      (linked?'<button class="btn sm" id="bmMxClear">Separate them</button>':'')+
      '</div><div class="hint">'+(linked?"These focuses are currently mutually exclusive with each other. ":"")+'A group means only one of them can be taken.</div></div>';
  }
  if(P.settings.bulkApr && P.settings.aprchaos) bulk+='<div class="fld"><label>Approval &amp; chaos (all)</label><div class="inline"><span class="mini">apr</span><input class="inp mono" id="bmApr" style="width:52px; flex:0 0 auto"><span class="mini">chaos</span><input class="inp mono" id="bmChaos" style="width:52px; flex:0 0 auto"><button class="btn sm" id="bmVars">Apply</button></div></div>';
  if(P.settings.bulkIcon) bulk+='<div class="fld"><label>Icon</label><button class="btn sm" id="bmIcon">Set icon for all…</button></div>';

  $("#tabMulti").innerHTML='<div class="mstats">'+rows+'</div>'+bulk+
    '<div class="hint" style="margin-top:8px">Ctrl-click to add / remove. Drag any selected focus to move the whole group.</div>';

  $("#bmPlanOn").onclick=()=>{ fs.forEach(f=>f.plan=true); persist(); render(); renderMulti(); };
  $("#bmPlanOff").onclick=()=>{ fs.forEach(f=>f.plan=false); persist(); render(); renderMulti(); };
  $("#tabMulti").querySelectorAll("[data-bsf]").forEach(cb=>{
    const sf=cb.dataset.bsf, cnt=fs.filter(f=>(f.searchFilters||[]).indexOf(sf)>=0).length;
    if(cnt>0 && cnt<fs.length) cb.indeterminate=true;
    cb.onchange=()=>{ fs.forEach(f=>{ f.searchFilters=f.searchFilters||[]; const i=f.searchFilters.indexOf(sf);
      if(cb.checked){ if(i<0) f.searchFilters.push(sf); } else if(i>=0) f.searchFilters.splice(i,1); });
      persist(); render(); renderMulti(); };
  });
  const q=s=>$("#tabMulti "+s)||$(s);
  if($("#bmCost")) $("#bmCost").onclick=()=>{ const v=clampInt($("#bmCostN").value,0,1000,null); if(v==null){toast("Enter a cost.");return;} fs.forEach(f=>f.cost=v); persist(); render(); renderMulti(); };
  if($("#bmMx")) $("#bmMx").onclick=()=>{ fs.forEach(f=>{ f.mutex=f.mutex||[]; fs.forEach(o=>{ if(o!==f && f.mutex.indexOf(o.id)<0) f.mutex.push(o.id); }); }); persist(); render(); renderMulti(); toast("Made mutually exclusive"); };
  if($("#bmMxClear")) $("#bmMxClear").onclick=()=>{ const set=new Set(ids); fs.forEach(f=>{ f.mutex=(f.mutex||[]).filter(m=>!set.has(m)); }); persist(); render(); renderMulti(); };
  if($("#bmVars")) $("#bmVars").onclick=()=>{ const a=$("#bmApr").value, c=$("#bmChaos").value; fs.forEach(f=>{ f.vars=f.vars||{aprOn:false,apr:5,chaosOn:false,chaos:5}; if(a!==""){f.vars.aprOn=true; f.vars.apr=Number(a)||0;} if(c!==""){f.vars.chaosOn=true; f.vars.chaos=Number(c)||0;} }); persist(); render(); renderMulti(); };
  if($("#bmIcon")) $("#bmIcon").onclick=()=>openIconPicker(name=>{ fs.forEach(f=>f.icon=name); persist(); render(); renderMulti(); });
}

function refreshDerived(f){

function liveNode(f){
  const n=$('.node[data-id="'+f.id+'"]'); if(!n) return;

function prereqChips(f){

    const p=byId(pid); if(!p) return "";

  }).join("")+'</div>';

function mutexChips(f){

    const o=byId(oid); if(!o) return "";
    return '<span class="chip mx">'+esc(o.name||focusKey(o))+'<button data-unmx="'+oid+'" title="Remove">×</button></span>';
  }).join("")+'</div>';
}
function unlinkPrereq(f,pid){ f.prereq=f.prereq.filter(x=>x!==pid); renderBasic(f); render(); }
function unlinkMutex(f,oid){
  f.mutex=(f.mutex||[]).filter(x=>x!==oid);
  const o=byId(oid); if(o) o.mutex=(o.mutex||[]).filter(x=>x!==f.id);
  renderBasic(f); render();
}
function setFocusIcon(f,name){ f.icon=name; renderBasic(f); render(); }

function bindChk(sel,fn){ const e=$(sel); if(e) e.onchange=()=>fn(e.checked); }

/* =====================================================================
   7. Canvas interaction — drag & link modes
   ===================================================================== */
let linkMode=null;     // 'pre' | 'mx' | null
let linkSrc=null;      // focus id chosen first
const stage=$("#stage"), board=$("#board");

board.addEventListener("mousedown", e=>{
  if(e.button!==0) return;                 // let middle/right pass through to panning
  const node=e.target.closest(".node");
  if(!node) return;
  e.preventDefault();                      // stop native image drag / text selection
  const f=byId(node.dataset.id); if(!f) return;
  if(linkMode){ handleLinkClick(f); return; }
  if(e.ctrlKey||e.metaKey){ toggleSel(f.id); return; }
  // if the grabbed node is part of a multi-selection, keep it and move the group;
  // otherwise select just this one
  if(!sel.has(f.id)){ selId=f.id; sel=new Set([f.id]); highlightSelection(); renderPanel(); }
  else { selId=f.id; highlightSelection(); }
  startDrag(f, node, e);
});
// never let the browser start its own drag of an icon inside the board
board.addEventListener("dragstart", e=>e.preventDefault());
// double-click a focus's icon to open the icon picker for it
board.addEventListener("dblclick", e=>{
  const node=e.target.closest(".node"); if(!node) return;
  const f=byId(node.dataset.id); if(!f) return;
  if(e.target.closest(".ic")){ e.preventDefault(); e.stopPropagation(); if(!linkMode){ select(f.id); openIconPicker(name=>setFocusIcon(f,name)); } }
});
function highlightSelection(){
  document.querySelectorAll(".node").forEach(n=>{
    n.classList.toggle("sel", sel.has(n.dataset.id));
    n.classList.toggle("primary", n.dataset.id===selId && sel.size>1);
    n.classList.toggle("linksrc", n.dataset.id===linkSrc);
  });
}

  document.body.classList.toggle("theme-dark", s.theme==="dark");
  const gb=$("#gridBg"); if(gb) gb.style.display=s.showGrid?"block":"none";

  const pan=$("#panel"); if(pan){ pan.style.flex="0 0 "+(s.panelW||380)+"px"; pan.style.maxWidth="min("+(s.panelW||380)+"px, 60vw)"; }
  const sw=$("#searchWrap"); if(sw) sw.style.display=(s.searchBar===false)?"none":"";
}

/* ---- pan & zoom engine ---- */
function applyTransform(){
  board.style.transform="translate("+view.x+"px,"+view.y+"px) scale("+view.z+")";
}
function updZoom(){ const z=$("#zLbl"); if(z) z.textContent=Math.round(view.z*100)+"%"; }
function zoomAt(sx, sy, factor){
  const nz=Math.min(2.4, Math.max(0.25, view.z*factor));
  if(nz===view.z) return;
  const bx=(sx-view.x)/view.z, by=(sy-view.y)/view.z;   // board point under the cursor
  view.z=nz; view.x=sx-bx*nz; view.y=sy-by*nz;          // keep it fixed under the cursor
  applyTransform(); updZoom();
}
function panBy(dx, dy){ view.x+=dx; view.y+=dy; applyTransform(); }
function fitView(){
  const rect=stage.getBoundingClientRect();
  if(!P.focuses.length){ view.z=1; view.x=PAD; view.y=PAD; applyTransform(); updZoom(); return; }
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  P.focuses.forEach(f=>{ minX=Math.min(minX,f.x); minY=Math.min(minY,f.y); maxX=Math.max(maxX,f.x); maxY=Math.max(maxY,f.y); });
  const left=cellLeft(minX)-30, top=cellTop(minY)-30;
  const cw=cellLeft(maxX)+NW+30-left, ch=cellTop(maxY)+NH+30-top;
  const z=Math.min(1.3, Math.max(0.3, Math.min(rect.width/cw, rect.height/ch)));
  view.z=z;
  view.x=(rect.width-cw*z)/2 - left*z;
  view.y=(rect.height-ch*z)/2 - top*z;
  applyTransform(); updZoom();
}
function startPan(e){
  const sx=e.clientX, sy=e.clientY, ox=view.x, oy=view.y, btn=e.button;
  stage.classList.add("panning");
  let moved=false;
  function mv(ev){ if(Math.abs(ev.clientX-sx)>3||Math.abs(ev.clientY-sy)>3) moved=true; view.x=ox+(ev.clientX-sx); view.y=oy+(ev.clientY-sy); applyTransform(); }
  function up(){
    document.removeEventListener("mousemove",mv,true); document.removeEventListener("mouseup",up,true); stage.classList.remove("panning");
    if(!moved && btn===0 && sel.size) deselectAll();   // a plain click on empty canvas clears the selection (undo puts it back)
  }
  document.addEventListener("mousemove",mv,true); document.addEventListener("mouseup",up,true);
}
stage.addEventListener("mousedown", e=>{
  if(e.target.closest("#previewBar, .zoombar, .linkbanner, .marquee")) return;   // overlays handle their own clicks
  const onNode=e.target.closest(".node");
  if(e.button===1){ e.preventDefault(); startPan(e); return; }      // middle always pans
  if(e.button===0 && !onNode && !linkMode){
    e.preventDefault();
    if(P.settings.dragSelect) startMarquee(e);                       // drag-select on: box-select
    else startPan(e);                                                // otherwise pan
  }
});
// double-click empty canvas to drop a new focus (gesture switchable in Settings)
stage.addEventListener("dblclick", e=>{
  if(!e.target.closest("#board")) return;   // ignore overlays (preview/zoom bars)
  if(e.target.closest(".node")) return;
  if(linkMode){ setLinkMode(linkMode); return; }   // double-click empty exits prerequisite / exclusive mode, like Esc
  const g=P.settings.newFocus;
  if(g==="double" || (g==="shiftdouble" && e.shiftKey)) createFocusAtClient(e.clientX, e.clientY);
});
function startMarquee(e){
  const rect=stage.getBoundingClientRect();
  const add=e.ctrlKey||e.metaKey;
  const base=add?new Set(sel):new Set();
  const x0=e.clientX, y0=e.clientY;
  const box=document.createElement("div"); box.className="marquee"; stage.appendChild(box);
  let picked=new Set(base);
  function draw(ev){
    const l=Math.min(x0,ev.clientX), t=Math.min(y0,ev.clientY), w=Math.abs(ev.clientX-x0), h=Math.abs(ev.clientY-y0);
    box.style.left=(l-rect.left)+"px"; box.style.top=(t-rect.top)+"px"; box.style.width=w+"px"; box.style.height=h+"px";
    picked=new Set(base);
    document.querySelectorAll(".node").forEach(n=>{
      const r=n.getBoundingClientRect();
      if(r.left<l+w && r.right>l && r.top<t+h && r.bottom>t) picked.add(n.dataset.id);
      n.classList.toggle("sel", picked.has(n.dataset.id));
    });
  }
  function up(){
    document.removeEventListener("mousemove",draw,true); document.removeEventListener("mouseup",up,true);
    box.remove();
    sel=picked; selId=[...sel].pop()||null;
    renderPanel(); render();
  }
  document.addEventListener("mousemove",draw,true); document.addEventListener("mouseup",up,true);
}
stage.addEventListener("wheel", e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  // default action follows the setting; the modifier does the other one
  const zoomMode = (P.settings.wheel!=="pan");
  const doZoom = zoomMode ? !e.shiftKey : (e.ctrlKey||e.metaKey);
  if(doZoom){
    zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:1/1.12);
  }else{
    panBy(-e.deltaX - (e.shiftKey?e.deltaY:0), e.shiftKey?0:-e.deltaY);
  }
}, {passive:false});
// keep middle-click from opening the browser's autoscroll puck
stage.addEventListener("auxclick", e=>{ if(e.button===1) e.preventDefault(); });

function startDrag(f, node, e){
  const z=view.z;
  const startX=e.clientX, startY=e.clientY;
  // move every selected focus together, keeping their relative offsets
  const group=(sel.size>1 && sel.has(f.id)) ? [...sel].map(byId).filter(Boolean) : [f];
  const origin={}; group.forEach(g=>{ origin[g.id]={x:g.x,y:g.y}; });
  group.forEach(g=>{ const n=$('.node[data-id="'+g.id+'"]'); if(n) n.classList.add("dragging"); });
  let moved=false;
  function mv(ev){
    const dx=(ev.clientX-startX)/z, dy=(ev.clientY-startY)/z;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    // grid delta driven by the grabbed node, clamped so nothing goes negative
    let gdx=Math.round(dx/GX), gdy=Math.round(dy/GY);
    let minx=1e9,miny=1e9; group.forEach(g=>{ minx=Math.min(minx,origin[g.id].x); miny=Math.min(miny,origin[g.id].y); });
    gdx=Math.max(gdx,-minx); gdy=Math.max(gdy,-miny);
    let changed=false;
    group.forEach(g=>{
      const nx=origin[g.id].x+gdx, ny=origin[g.id].y+gdy;
      if(nx!==g.x||ny!==g.y){ g.x=nx; g.y=ny; const n=$('.node[data-id="'+g.id+'"]'); if(n){ n.style.left=cellLeft(nx)+"px"; n.style.top=cellTop(ny)+"px"; } changed=true; }
    });
    if(changed) drawLinks();
  }
  function up(){
    document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up);
    group.forEach(g=>{ const n=$('.node[data-id="'+g.id+'"]'); if(n) n.classList.remove("dragging"); });
    if(moved){ refreshDerived(f); render(); persist(); }
    else if(sel.size>1 && sel.has(f.id)){ select(f.id); }   // a click (no drag) on a grouped node collapses to just it
  }
  document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
}

function setLinkMode(m){
  linkMode=(linkMode===m)?null:m; linkSrc=null;
  $("#bPre").classList.toggle("active", linkMode==="pre");
  $("#bMx").classList.toggle("active", linkMode==="mx");
  const b=$("#linkBanner");
  if(linkMode==="pre"){ b.className="linkbanner on"; b.textContent="Prerequisite mode — click the PARENT focus, then the CHILD. Esc to stop."; }
  else if(linkMode==="mx"){ b.className="linkbanner on"; b.textContent="Exclusive mode — click one focus, then the other. Esc to stop."; }
  else b.className="linkbanner";
  render();
}
function handleLinkClick(f){
  if(!linkSrc){ linkSrc=f.id; render(); return; }
  if(linkSrc===f.id){ linkSrc=null; render(); return; }
  const src=byId(linkSrc), dst=f;
  if(linkMode==="pre"){
    // src is parent, dst is child -> child requires src
    if((dst.prereq||[]).indexOf(src.id)<0){
      if(wouldCycle(dst.id, src.id)){ toast("That would make a prerequisite loop."); }
      else { dst.prereq.push(src.id); toast(focusName(dst)+" now needs "+focusName(src)); }
    }
  }else if(linkMode==="mx"){
    src.mutex=src.mutex||[]; dst.mutex=dst.mutex||[];
    if(src.mutex.indexOf(dst.id)<0) src.mutex.push(dst.id);
    if(dst.mutex.indexOf(src.id)<0) dst.mutex.push(src.id);
    toast(focusName(src)+" ⇄ "+focusName(dst));
  }
  linkSrc=null; select(dst.id); render();
}
function focusName(f){ return f.name||focusKey(f); }
function wouldCycle(childId, newParentId){
  // adding newParent as prereq of child: cycle if child is (transitively) a prereq of newParent
  const stack=[newParentId], seen={};
  while(stack.length){
    const id=stack.pop(); if(id===childId) return true;
    if(seen[id]) continue; seen[id]=1;
    const f=byId(id); if(f) (f.prereq||[]).forEach(p=>stack.push(p));
  }
  return false;
}

/* virtualized icon grid: only the rows near the viewport are in the DOM, so
   all ~3100 icons scroll smoothly without building thousands of tiles */
let iconList=[], icScrollRAF=0;
const IC_TW=104, IC_TH=94, IC_GAP=8;
function fillIconGrid(q){
  q=(q||"").trim().toLowerCase();
  const custom=Object.keys(P.icons).filter(n=>!q||n.toLowerCase().indexOf(q)>=0);
  const libs=q?ICONS.filter(n=>n.toLowerCase().indexOf(q)>=0):ICONS;
  iconList=custom.concat(libs);
  const cc=$("#icCount"); if(cc) cc.textContent=iconList.length+" icon"+(iconList.length===1?"":"s");
  const g=$("#icGrid"); if(g) g.scrollTop=0;
  layoutIconWindow();
}
function iconTileHTML(name){
  const short=name.replace(/^GFX_/,"");
  let box;
  if(P.icons[name]) box='<img src="'+P.icons[name].url+'">';
  else if(P.settings.webIcons) box='<img src="'+iconURL(name)+'" loading="lazy" data-n="'+esc(short)+'" onerror="icoErr(this)">';
  else box='<span class="g">'+esc(short)+'</span>';
  return '<div class="icontile'+(iconSel===name?" sel":"")+'" data-ic="'+esc(name)+'" style="height:'+IC_TH+'px"><div class="box">'+box+'</div><div class="cap">'+esc(short)+'</div></div>';
}
function layoutIconWindow(){
  const g=$("#icGrid"); if(!g) return;
  if(!iconList.length){ g.innerHTML='<div class="mini" style="padding:14px">No icons match. Try Import image.</div>'; return; }
  const W=g.clientWidth||560;
  const cols=Math.max(1, Math.floor((W+IC_GAP)/(IC_TW+IC_GAP)));
  const rowH=IC_TH+IC_GAP, rows=Math.ceil(iconList.length/cols), totalH=rows*rowH;
  const scroll=g.scrollTop, vh=g.clientHeight||420;
  const startRow=Math.max(0, Math.floor(scroll/rowH)-2);
  const endRow=Math.min(rows, Math.ceil((scroll+vh)/rowH)+2);
  const startI=startRow*cols, endI=Math.min(iconList.length, endRow*cols);
  let inner=""; for(let i=startI;i<endI;i++) inner+=iconTileHTML(iconList[i]);
  g.innerHTML='<div style="height:'+totalH+'px; position:relative">'+
    '<div style="position:absolute; left:0; right:0; top:'+(startRow*rowH)+'px; display:grid; grid-template-columns:repeat('+cols+',minmax(0,1fr)); gap:'+IC_GAP+'px">'+inner+'</div></div>';
  g.querySelectorAll("[data-ic]").forEach(t=>{
    t.onclick=()=>{ iconSel=t.dataset.ic; g.querySelectorAll(".icontile").forEach(x=>x.classList.remove("sel")); t.classList.add("sel"); };
    t.ondblclick=()=>{ iconSel=t.dataset.ic; if(iconCb) iconCb(iconSel); closeIcon(); };   // dbl-click picks instantly
  });
}

/* image import: resize to 95x95, store as data URL under a GFX name */
let picImageMode="library"; // 'library' -> picker flow
$("#fileImg").onchange=ev=>{
  const file=ev.target.files[0]; ev.target.value="";
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const S=95;
      const cv=document.createElement("canvas"); cv.width=S; cv.height=S;
      const cx=cv.getContext("2d"); cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality="high";
      cx.clearRect(0,0,S,S); cx.drawImage(img,0,0,S,S);
      const base=(file.name.replace(/\.[^.]+$/,"")||"custom").replace(/[^A-Za-z0-9_-]/g,"_").toLowerCase();
      let name="GFX_focus_"+tag()+"_"+base, i=2;
      while(P.icons[name] && !(iconSel===name)){ name="GFX_focus_"+tag()+"_"+base+"_"+(i++); }
      P.icons[name]={ url:cv.toDataURL("image/png"), w:S, h:S, file:tag().toLowerCase()+"_"+base, ow:img.naturalWidth, oh:img.naturalHeight };
      persist();
      if($("#iconVeil")){ iconSel=name; fillIconGrid($("#icSearch").value); }
      else if(byId(selId)){ setFocusIcon(byId(selId), name); }
      toast("Imported "+name);
    };
    img.onerror=()=>toast("That file could not be read as an image.");
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
};

   ===================================================================== */
function ddsFromDataURL(url,w,h){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      const cx=cv.getContext("2d"); cx.drawImage(img,0,0,w,h);
      const px=cx.getImageData(0,0,w,h).data;
      const out=new Uint8Array(128+w*h*4), dv=new DataView(out.buffer);
      out[0]=0x44;out[1]=0x44;out[2]=0x53;out[3]=0x20;
      dv.setUint32(4,124,true); dv.setUint32(8,0x0002100F,true);
      dv.setUint32(12,h,true); dv.setUint32(16,w,true); dv.setUint32(20,w*4,true);
      dv.setUint32(24,1,true); dv.setUint32(28,1,true);
      dv.setUint32(76,32,true); dv.setUint32(80,0x41,true); dv.setUint32(84,0,true);
      dv.setUint32(88,32,true); dv.setUint32(92,0x00FF0000,true); dv.setUint32(96,0x0000FF00,true);
      dv.setUint32(100,0x000000FF,true); dv.setUint32(104,0xFF000000,true); dv.setUint32(108,0x1000,true);
      let p=128;
      for(let i=0;i<px.length;i+=4){ out[p++]=px[i+2]; out[p++]=px[i+1]; out[p++]=px[i]; out[p++]=px[i+3]; }
      res(out);
    };
    img.onerror=()=>rej(new Error("bad image")); img.src=url;
  });
}
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function utf8(s){ return new TextEncoder().encode(s); }
function makeZip(files){
  const parts=[],central=[]; let offset=0;
  const now=new Date();
  const dosTime=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()/2))&0xFFFF;
  const dosDate=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  files.forEach(f=>{
    const name=utf8(f.path), crc=crc32(f.data);
    const lh=new Uint8Array(30+name.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true); dv.setUint16(8,0,true);
    dv.setUint16(10,dosTime,true); dv.setUint16(12,dosDate,true); dv.setUint32(14,crc,true);
    dv.setUint32(18,f.data.length,true); dv.setUint32(22,f.data.length,true); dv.setUint16(26,name.length,true); dv.setUint16(28,0,true);
    lh.set(name,30); parts.push(lh,f.data);
    const ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0x0800,true);
    cv.setUint16(10,0,true); cv.setUint16(12,dosTime,true); cv.setUint16(14,dosDate,true); cv.setUint32(16,crc,true);
    cv.setUint32(20,f.data.length,true); cv.setUint32(24,f.data.length,true); cv.setUint16(28,name.length,true); cv.setUint32(42,offset,true);
    ch.set(name,46); central.push(ch); offset+=lh.length+f.data.length;
  });
  let cSize=0; central.forEach(c=>cSize+=c.length);
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cSize,true); ev.setUint32(16,offset,true);
  const all=parts.concat(central,[end]); let total=0; all.forEach(a=>total+=a.length);
  const out=new Uint8Array(total); let p=0; all.forEach(a=>{ out.set(a,p); p+=a.length; }); return out;
}
function download(name,data,type){
  const blob=new Blob([data],{type:type||"application/octet-stream"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* =====================================================================
   12. Build the mod files
   ===================================================================== */
function ind(s,n){ const pad="\t".repeat(n); return String(s||"").replace(/\r/g,"").split("\n").map(l=>l.trim()===""?"":pad+l).join("\n"); }
function block(name, body, n){ return "\t".repeat(n)+name+" = {\n"+ind(body,n+1)+"\n"+"\t".repeat(n)+"}\n"; }

function buildFocusFile(){
  const T=tag();
  let maxY=4; P.focuses.forEach(f=>{ if(!f.external) maxY=Math.max(maxY,f.y); });
  let s="focus_tree = {\n";
  s+="\tid = "+treeId()+"\n\n";
  if(P.meta.countryRaw && P.meta.countryRaw.trim()) s+=block("country", P.meta.countryRaw, 1)+"\n";
  else s+="\tcountry = {\n\t\tfactor = 0\n\t\tmodifier = {\n\t\t\tadd = 100\n\t\t\ttag = "+T+"\n\t\t}\n\t}\n\n";
  if(P.meta.treeExtra && P.meta.treeExtra.trim()) s+=ind(P.meta.treeExtra,1)+"\n\n";
  else s+="\tdefault = no\n\treset_on_civilwar = no\n\tcontinuous_focus_position = { x = 50 y = "+((maxY+3)*100)+" }\n\n";
  P.focuses.forEach(f=>{ if(!f.external) s+=buildFocus(f); });   // placeholders for external refs aren't exported
  s+="}\n";
  return s;
}
function buildFocus(f){
  const key=focusKey(f);
  let b="";
  b+="\tfocus = {\n";
  b+="\t\tid = "+key+"\n";
  if(f.iconBlock && f.iconBlock.trim()) b+=block("icon", f.iconBlock, 2);
  else b+="\t\ticon = "+(f.icon||"GFX_goal_unknown")+"\n";
  // if positioned relative to another focus, export coords relative to it so the
  // in-game position matches what you see on the canvas
  let ox=f.x, oy=f.y;
  if(f.relTo && byId(f.relTo)){
    const rel=byId(f.relTo);
    b+="\t\trelative_position_id = "+focusKey(rel)+"\n";
    ox=f.x-rel.x; oy=f.y-rel.y;
  }
  b+="\t\tx = "+ox+"\n\t\ty = "+oy+"\n";
  b+="\t\tcost = "+(f.cost||0)+"\n";
  // prerequisites — keep the exact imported grouping when it hasn't been edited
  if(f.prereqRaw && f.prereqRaw.length){
    f.prereqRaw.forEach(raw=>{ b+="\t\tprerequisite = { "+String(raw).trim().replace(/\s+/g," ")+" }\n"; });
  } else if(f.prereq && f.prereq.length){
    const valid=f.prereq.map(id=>byId(id)).filter(Boolean);
    if(valid.length){
      if(f.prereqMode==="any"){
        b+="\t\tprerequisite = { "+valid.map(p=>"focus = "+focusKey(p)).join(" ")+" }\n";
      }else{
        valid.forEach(p=>{ b+="\t\tprerequisite = { focus = "+focusKey(p)+" }\n"; });
      }
    }
  }
  // mutually exclusive
  if(f.mutex && f.mutex.length){
    const valid=f.mutex.map(id=>byId(id)).filter(Boolean);
    if(valid.length) b+="\t\tmutually_exclusive = { "+valid.map(p=>"focus = "+focusKey(p)).join(" ")+" }\n";
  }
  if(f.searchFilters && f.searchFilters.length) b+="\t\tsearch_filters = { "+f.searchFilters.join(" ")+" }\n";
  if(f.willWarWith) b+="\t\twill_lead_to_war_with = "+f.willWarWith+"\n";
  if(f.flags.availCap) b+="\t\tavailable_if_capitulated = yes\n";
  if(f.flags.cancelInvalid) b+="\t\tcancel_if_invalid = yes\n";
  if(f.flags.contInvalid) b+="\t\tcontinue_if_invalid = yes\n";
  if(f.flags.dynamic) b+="\t\tdynamic = yes\n";
  if(f.allowBranch.trim()) b+=block("allow_branch", f.allowBranch, 2);
  if(f.available.trim()) b+=block("available", f.available, 2);
  if(f.bypass.trim()) b+=block("bypass", f.bypass, 2);
  if(f.selectEffect.trim()) b+=block("select_effect", f.selectEffect, 2);
  // completion reward — plus the approval/chaos deltas (USA_apr_add / USA_chaos_add), like the Event Maker
  let rew=f.reward.trim();
  const v=f.vars||{};
  const extra=[];
  if(v.aprOn) extra.push("set_temp_variable = { apr_delta = "+(Number(v.apr)||0)+" }", "USA_apr_add = yes");
  if(v.chaosOn) extra.push("set_temp_variable = { chaos_delta = "+(Number(v.chaos)||0)+" }", "USA_chaos_add = yes");
  if(extra.length) rew = (rew?rew+"\n":"")+extra.join("\n");
  if(rew) b+=block("completion_reward", rew, 2);
  else b+="\t\tcompletion_reward = { }\n";
  if(f.completeTooltip.trim()) b+=block("complete_tooltip", f.completeTooltip, 2);
  if(f.aiWillDo.trim()) b+=block("ai_will_do", f.aiWillDo, 2);
  if(f.extra && f.extra.trim()) b+=ind(f.extra,2)+"\n";   // any imported keys we don't model
  b+="\t}\n\n";
  return b;
}

function ymlLine(key,val){ return " "+key+':0 "'+String(val||"").replace(/"/g,'\\"').replace(/\n/g,"\\n")+'"\n'; }
function buildLocFile(){
  let s="\uFEFFl_english:\n";
  s+="  ### National focus: "+treeId()+"\n";
  P.focuses.forEach(f=>{
    const key=focusKey(f);
    s+=ymlLine(key, f.name||key);
    s+=ymlLine(key+"_desc", f.desc||"");
  });
  if(P.ideas.length){
    s+="  ### National spirits\n";
    P.ideas.forEach(i=>{
      const k=ideaKey(i);
      s+=ymlLine(k, i.name||k);
      s+=ymlLine(k+"_desc", i.desc||"");
    });
  }
  return s;
}
function customIcons(){ return Object.keys(P.icons).filter(n=>usedIcon(n)); }
function usedIcon(n){ return P.focuses.some(f=>f.icon===n) || P.ideas.some(i=>i.icon===n); }
function buildGfxFile(){
  const icons=customIcons(); if(!icons.length) return "";
  let s="spriteTypes = {\n";
  icons.forEach(n=>{
    s+="\tSpriteType = {\n\t\tname = \""+n+"\"\n\t\ttexturefile = \"gfx/interface/goals/"+P.icons[n].file+".dds\"\n\t}\n";
  });
  s+="}\n";
  return s;
}
function buildShineFile(){
  const icons=customIcons(); if(!icons.length) return "";
  let s="spriteTypes = {\n";
  icons.forEach(n=>{
    const tex="gfx/interface/goals/"+P.icons[n].file+".dds";
    s+="\tSpriteType = {\n\t\tname = \""+n+"_shine\"\n\t\ttexturefile = \""+tex+"\"\n\t\teffectFile = \"gfx/FX/buttonstate.lua\"\n";
    for(const rot of [-90.0,90.0]){
      s+="\t\tanimation = {\n"+
         "\t\t\tanimationmaskfile = \""+tex+"\"\n"+
         "\t\t\tanimationtexturefile = \"gfx/interface/goals/shine_overlay.dds\"\n"+
         "\t\t\tanimationrotation = "+rot.toFixed(1)+"\n"+
         "\t\t\tanimationlooping = no\n"+
         "\t\t\tanimationtime = 0.75\n"+
         "\t\t\tanimationdelay = 0\n"+
         "\t\t\tanimationblendmode = \"add\"\n"+
         "\t\t\tanimationtype = \"scrolling\"\n"+
         "\t\t\tanimationrotationoffset = { x = 0.0 y = 0.0 }\n"+
         "\t\t\tanimationtexturescale = { x = 1.0 y = 1.0 }\n"+
         "\t\t}\n";
    }
    s+="\t\tlegacy_lazy_load = no\n\t}\n";
  });
  s+="}\n";
  return s;
}
function buildIdeasFile(){
  if(!P.ideas.length) return "";
  const T=tag();
  let s="ideas = {\n\tcountry = {\n";
  P.ideas.forEach(i=>{
    const k=ideaKey(i);
    s+="\t\t"+k+" = {\n";
    if(i.icon && i.icon.indexOf("GFX_")===0) s+="\t\t\tpicture = "+i.icon+"\n";
    const hasExtra=i.extra && i.extra.trim();
    if(!(hasExtra && /\ballowed\s*=/.test(i.extra))) s+="\t\t\tallowed = { always = yes }\n";
    s+="\t\t\tremoval_cost = "+(i.removalCost==null?-1:i.removalCost)+"\n";
    if(hasExtra) s+=ind(i.extra,3)+"\n";        // preserved sub-keys from an imported idea
    s+="\t\t\tmodifier = {\n";
    (i.mods||[]).forEach(m=>{ if(m.k) s+="\t\t\t\t"+m.k+" = "+(m.v===""?"0":m.v)+"\n"; });
    s+="\t\t\t}\n";
    s+="\t\t}\n";
  });
  s+="\t}\n}\n";
  return s;
}
function buildReadme(fileList){
  const T=tag(), ns=treeId();
  let r="Focus Tree Creator export — "+(P.meta.mod||"mod")+"\n";
  r+="Country: "+T+"   Focuses: "+P.focuses.length+"   Spirits: "+P.ideas.length+"\n";
  r+="Generated: "+new Date().toISOString().slice(0,10)+"\n\n";
  r+="Drop these folders into your mod (merging with what's there):\n\n";
  fileList.forEach(f=>r+="  "+f+"\n");
  r+="\nNotes:\n";
  r+="* The focus tree id is '"+ns+"'. It is set to country = "+T+" with add = 100.\n";
  r+="* Imported icons are uncompressed 32-bit DDS (95x95). Each has a matching\n";
  r+="  _shine sprite so the focus glows when available, exactly like vanilla.\n";
  r+="* Library icons (GFX_goal_* / GFX_focus_*) reference sprites already in the\n";
  r+="  base game, so no .dds is shipped for them.\n";
  r+="* Localisation is English; copy the yml for other languages as needed.\n";
  return r;
}

/* =====================================================================
   13. Validation + export
   ===================================================================== */
function validate(){
  const out=[];
  const keys={};
  P.focuses.forEach(f=>{
    const k=focusKey(f);
    if(!f.name) out.push(["warn", k, "has no in-game name."]);
    if(!/^[A-Za-z0-9_]+$/.test(k)) out.push(["error", k, "script id has characters the game will reject — use letters, numbers, underscore."]);
    if(keys[k]) out.push(["error", k, "duplicate script id — two focuses share it."]); keys[k]=1;
  });
  P.ideas.forEach(i=>{ const k=ideaKey(i); if(!/^[A-Za-z0-9_]+$/.test(k)) out.push(["error", k, "spirit id is invalid."]); });
  if(!P.focuses.length) out.push(["error","tree","no focuses to export."]);
  if(!parseDate(P.meta.start)) out.push(["warn","date","start date is not a valid Y.M.D — dates may look wrong."]);
  return out;
}
async function exportAll(skip){
  if(!P.focuses.length){ toast("Add a focus first."); return; }
  const issues=validate();
  if(!skip && issues.some(i=>i[0]==="error")){ showIssues(issues); return; }
  const T=tag(), ns=treeId();
  const files=[];
  const paths=[];
  function add(path,data){ files.push({path,data:utf8(data)}); paths.push(path); }
  add("common/national_focus/"+T+"_focus.txt", buildFocusFile());
  add("localisation/english/"+T+"_focus_l_english.yml", buildLocFile());
  const gfx=buildGfxFile(); if(gfx){ add("interface/"+T+"_focus.gfx", gfx); }
  const shine=buildShineFile(); if(shine){ add("interface/"+T+"_focus_shine.gfx", shine); }
  const ideas=buildIdeasFile(); if(ideas){ add("common/ideas/"+T+"_focus_ideas.txt", ideas); }
  // dds icons
  for(const n of customIcons()){
    try{ const dds=await ddsFromDataURL(P.icons[n].url, P.icons[n].w, P.icons[n].h);
      files.push({path:"gfx/interface/goals/"+P.icons[n].file+".dds", data:dds}); paths.push("gfx/interface/goals/"+P.icons[n].file+".dds"); }
    catch(e){}
  }
  files.push({path:"README.txt", data:utf8(buildReadme(paths))});
  download(ns+".zip", makeZip(files), "application/zip");
  toast("Exported "+files.length+" files");
}
function showIssues(issues){
  const veil=document.createElement("div"); veil.className="veil";
  const body=issues.map(i=>'<div class="issue '+i[0]+'"><span class="who">'+esc(i[1])+'</span> — '+esc(i[2])+'</div>').join("");
  const nErr=issues.filter(i=>i[0]==="error").length;
  veil.innerHTML='<div class="modal" style="width:520px"><div class="modal-h"><h3>Before exporting</h3></div>'+
    '<div class="modal-b">'+body+'</div>'+
    '<div class="modal-f"><button class="btn" id="ivClose">Close</button>'+
    (nErr?'<button class="btn danger" id="ivGo">Export anyway</button>':'<button class="btn primary" id="ivGo">Export</button>')+'</div></div>';
  document.body.appendChild(veil);
  veil.onclick=e=>{ if(e.target===veil) veil.remove(); };
  $("#ivClose").onclick=()=>veil.remove();
  $("#ivGo").onclick=()=>{ veil.remove(); exportAll(true); };
}

/* =====================================================================
   14b. Focus tree IMPORT — parse an existing tree / loc / ideas
   ===================================================================== */
function stripComments(t){
  let out="", inq=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(inq){ out+=c; if(c==="\\"){ out+=(t[i+1]||""); i++; } else if(c==='"') inq=false; continue; }
    if(c==='"'){ inq=true; out+=c; continue; }
    if(c==="#"){ while(i<t.length && t[i]!=="\n") i++; out+="\n"; continue; }
    out+=c;
  }
  return out;
}
/* one level of `key op value | { block }` entries; repeated keys kept */
function pdxEntries(text){
  const out=[]; let i=0; const n=text.length;
  const ws=c=>c===" "||c==="\t"||c==="\r"||c==="\n";
  function skip(){ while(i<n && ws(text[i])) i++; }
  function token(){
    skip(); if(i>=n) return null;
    if(text[i]==='"'){ let s=""; i++; while(i<n && text[i]!=='"'){ if(text[i]==="\\"){ s+=text[i+1]||""; i+=2; } else { s+=text[i]; i++; } } i++; return '"'+s+'"'; }
    let j=i; while(j<n && !ws(text[j]) && "={}<>".indexOf(text[j])<0) j++;
    if(j===i) return null;
    const w=text.slice(i,j); i=j; return w;
  }
  while(true){
    skip(); if(i>=n) break;
    if(text[i]==="}"){ i++; continue; }
    const key=token(); if(key==null) break;
    skip();
    let op="="; if(text[i]==="="||text[i]==="<"||text[i]===">"){ op=text[i]; i++; if(text[i]==="="){ op+="="; i++; } }
    skip();
    if(text[i]==="{"){
      let depth=0, j=i, inq=false;
      for(; j<n; j++){ const c=text[j];
        if(inq){ if(c==="\\"){ j++; continue; } if(c==='"') inq=false; }
        else { if(c==='"') inq=true; else if(c==="{") depth++; else if(c==="}"){ depth--; if(depth===0){ j++; break; } } }
      }
      out.push({ key, op, block:text.slice(i+1, j-1) }); i=j;
    } else { const v=token(); out.push({ key, op, value:(v==null?"":v) }); }
  }
  return out;
}
function focusKeysIn(block){
  const out=[], rx=/focus\s*=\s*([A-Za-z0-9_.]+)/g; let m;
  while((m=rx.exec(block))) out.push(m[1]);
  return out;
}
function parseFocus(block){
  const f=newFocus(0,0);
  f._pre=[]; f._mx=[]; f._rel=""; f.prereqRaw=[];
  const extra=[];
  pdxEntries(block).forEach(e=>{
    const k=e.key;
    if(k==="id"){ f.key=e.value; f.keyEdited=true; return; }
    if(k==="icon"){ if(e.block!=null){ f.iconBlock=e.block.trim(); const m=/value\s*=\s*([A-Za-z0-9_]+)/.exec(e.block)||/([A-Za-z0-9_]*GFX_[A-Za-z0-9_]+)/.exec(e.block); f.icon=m?m[1]:"GFX_goal_unknown"; } else f.icon=e.value; return; }
    if(k==="x"){ f.x=parseInt(e.value,10)||0; return; }
    if(k==="y"){ f.y=parseInt(e.value,10)||0; return; }
    if(k==="cost"){ f.cost=parseFloat(e.value)||0; return; }
    if(k==="relative_position_id"){ f._rel=e.value; return; }
    if(k==="prerequisite" && e.block!=null){ f.prereqRaw.push(e.block.trim().replace(/\s+/g," ")); f._pre.push(focusKeysIn(e.block)); return; }
    if(k==="mutually_exclusive" && e.block!=null){ focusKeysIn(e.block).forEach(x=>f._mx.push(x)); return; }
    if(k==="search_filters" && e.block!=null){ f.searchFilters=(e.block.match(/FOCUS_FILTER_[A-Z_0-9]+/g)||[]); return; }
    if(k==="available" && e.block!=null){ f.available=e.block.trim(); return; }
    if(k==="bypass" && e.block!=null){ f.bypass=e.block.trim(); return; }
    if(k==="select_effect" && e.block!=null){ f.selectEffect=e.block.trim(); return; }
    if(k==="completion_reward" && e.block!=null){ f.reward=e.block.trim(); return; }
    if(k==="complete_tooltip" && e.block!=null){ f.completeTooltip=e.block.trim(); return; }
    if(k==="ai_will_do" && e.block!=null){ f.aiWillDo=e.block.trim(); return; }
    if(k==="allow_branch" && e.block!=null){ f.allowBranch=e.block.trim(); return; }
    if(k==="will_lead_to_war_with"){ f.willWarWith=e.value; return; }
    if(k==="available_if_capitulated"){ f.flags.availCap=(e.value==="yes"); return; }
    if(k==="cancel_if_invalid"){ f.flags.cancelInvalid=(e.value==="yes"); return; }
    if(k==="continue_if_invalid"){ f.flags.contInvalid=(e.value==="yes"); return; }
    if(k==="dynamic"){ f.flags.dynamic=(e.value==="yes"); return; }
    if(e.block!=null) extra.push(k+" = {"+e.block+"}"); else extra.push(k+" "+e.op+" "+e.value);
  });
  f.extra=extra.join("\n");
  if(!f.prereqRaw.length) f.prereqRaw=null;
  return f;
}
function parseFocusTree(text){
  const top=pdxEntries(stripComments(text));
  const ft=top.find(e=>e.key==="focus_tree" && e.block!=null);
  const inner = ft ? pdxEntries(ft.block) : top;
  const out={ treeId:"", tag:"", countryRaw:"", treeExtra:[], focuses:[] };
  inner.forEach(e=>{
    if(e.key==="focus" && e.block!=null){ out.focuses.push(parseFocus(e.block)); return; }
    if(e.key==="id" && !e.block){ out.treeId=e.value; return; }
    if(e.key==="country" && e.block!=null){ out.countryRaw=e.block.replace(/^\s*\n/,"").replace(/\s+$/,""); const m=/tag\s*=\s*([A-Za-z0-9_]+)/.exec(e.block); if(m) out.tag=m[1]; return; }
    if(e.block!=null) out.treeExtra.push(e.key+" = {"+e.block+"}"); else out.treeExtra.push(e.key+" "+e.op+" "+e.value);
  });
  out.treeExtra=out.treeExtra.join("\n");
  return out;
}
function parseLoc(text){
  const map={};
  String(text).split(/\r?\n/).forEach(line=>{
    const m=/^\s*([A-Za-z0-9_.@$]+):\s*\d*\s*"([\s\S]*)"\s*$/.exec(line);
    if(m) map[m[1]]=m[2].replace(/\\"/g,'"').replace(/\\n/g,"\n");
  });
  return map;
}
function parseIdeas(text){
  const top=pdxEntries(stripComments(text));
  const ie=top.find(e=>e.key==="ideas" && e.block!=null); if(!ie) return [];
  const out=[];
  pdxEntries(ie.block).forEach(cat=>{
    if(cat.key!=="country" || cat.block==null) return;   // focus spirits live in country scope
    pdxEntries(cat.block).forEach(en=>{
      if(en.block==null) return;
      const idea=newIdea(); idea.key=en.key; const extra=[];
      pdxEntries(en.block).forEach(e=>{
        if(e.key==="picture"){ idea.icon=e.value; return; }
        if(e.key==="removal_cost"){ idea.removalCost=parseFloat(e.value); return; }
        if(e.key==="modifier" && e.block!=null){ pdxEntries(e.block).forEach(m=>{ if(m.value!=null && m.block==null) idea.mods.push({k:m.key, v:m.value}); }); return; }
        if(e.block!=null) extra.push(e.key+" = {"+e.block+"}"); else extra.push(e.key+" "+e.op+" "+e.value);
      });
      idea.extra=extra.join("\n");
      out.push(idea);
    });
  });
  return out;
}
function doImport(focusText, locText, ideasText, mode){
  const parsed=parseFocusTree(focusText);
  if(!parsed.focuses.length) throw new Error("no focuses found in that file");
  const loc=locText?parseLoc(locText):{};
  const ideas=ideasText?parseIdeas(ideasText):[];
  ideas.forEach(i=>{ if(loc[i.key]) i.name=loc[i.key]; if(loc[i.key+"_desc"]) i.desc=loc[i.key+"_desc"]; });
  const focuses=parsed.focuses, keymap={};
  focuses.forEach(f=>{ f.id=uid(); keymap[f.key]=f; if(loc[f.key]) f.name=loc[f.key]; if(loc[f.key+"_desc"]) f.desc=loc[f.key+"_desc"]; });
  let placeholders=0;
  function ensure(key){
    if(keymap[key]) return keymap[key];
    const ph=newFocus(0,0); ph.id=uid(); ph.key=key; ph.keyEdited=true; ph.external=true; ph.name=loc[key]||key; ph.cost=0;
    keymap[key]=ph; focuses.push(ph); placeholders++; return ph;
  }
  focuses.forEach(f=>{
    if(f.external) return;
    (f._pre||[]).forEach(group=>group.forEach(k=>{ const t=ensure(k); if(f.prereq.indexOf(t.id)<0) f.prereq.push(t.id); }));
    (f._mx||[]).forEach(k=>{ const t=ensure(k); if(f.mutex.indexOf(t.id)<0) f.mutex.push(t.id); if(t.mutex.indexOf(f.id)<0) t.mutex.push(f.id); });
    if(f._rel){ f.relTo = keymap[f._rel] ? keymap[f._rel].id : ""; }
  });
  // absolute positions from relative_position_id chains
  const pm={};
  function absPos(f, st){
    if(pm[f.id]) return pm[f.id];
    if(st.has(f.id)) return {x:f.x,y:f.y};
    st.add(f.id);
    let p={x:f.x,y:f.y};
    if(f.relTo){ const rel=focuses.find(z=>z.id===f.relTo); if(rel){ const rp=absPos(rel,st); p={x:rp.x+f.x, y:rp.y+f.y}; } }
    st.delete(f.id); pm[f.id]=p; return p;
  }
  focuses.forEach(f=>{ if(!f.external){ const p=absPos(f,new Set()); f._ax=p.x; f._ay=p.y; } });
  focuses.forEach(f=>{ if(f.external){ const ref=focuses.find(z=>!z.external && (z.prereq.indexOf(f.id)>=0||z.mutex.indexOf(f.id)>=0)); f._ax=ref?ref._ax:0; f._ay=ref?(ref._ay-1):0; } });
  let minX=Infinity,minY=Infinity; focuses.forEach(f=>{ minX=Math.min(minX,f._ax); minY=Math.min(minY,f._ay); });
  if(!isFinite(minX)){ minX=0; minY=0; }
  focuses.forEach(f=>{ f.x=f._ax-minX; f.y=f._ay-minY; ["_ax","_ay","_pre","_mx","_rel"].forEach(k=>delete f[k]); });

  if(mode==="merge" && P.focuses.length){
    let mx=0; P.focuses.forEach(f=>mx=Math.max(mx,f.x)); mx+=3;
    focuses.forEach(f=>f.x+=mx);
    P.focuses=P.focuses.concat(focuses); P.ideas=P.ideas.concat(ideas);
  } else {
    P.focuses=focuses; P.ideas=ideas;
    if(parsed.tag) P.meta.tag=parsed.tag;
    if(parsed.treeId) P.meta.treeId=parsed.treeId;
    P.meta.countryRaw=parsed.countryRaw||""; P.meta.treeExtra=parsed.treeExtra||"";
  }
  // scan for branch gates (flags / game rules in allow_branch) so the Flags
  // panel and Preview work on the imported tree straight away
  let gates=0; const seenFlag=new Set(P.flags.map(fl=>fl.key));
  focuses.forEach(f=>{ const g=branchGate(f); if(g && !seenFlag.has(g.key)){ seenFlag.add(g.key); P.flags.push({key:g.key, scope:g.scope, note:(g.scope==="rule"?"game rule — branch visibility":"branch flag (imported)")}); gates++; } });
  selId=null; sel=new Set();
  applySettings(); syncTopbar(); render(); renderPanel(); fitView(); pushHist();
  toast("Imported "+focuses.filter(f=>!f.external).length+" focuses"+(placeholders?" · "+placeholders+" external":"")+(ideas.length?" · "+ideas.length+" spirits":"")+(gates?" · "+gates+" branch flag"+(gates>1?"s":""):""));
}
